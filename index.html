<!DOCTYPE html>
<html>

<head>
  <title>Captain Ariel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    a {
      text-decoration: none;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }

    /* ⭐ HERO */
    .hero {
      position: relative;
      height: auto;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    /* ⭐ 标题 */
    .title {
      text-align: center;
      margin-top: 30px;
      font-family: 'Playfair Display', serif;
      letter-spacing: 6px;

      opacity: 0;
      transform: translateY(-10px);
      animation: fadeIn 1.8s ease forwards;
    }

    .title h1 {
      margin: 0;
      font-size: 24px;
    }

    .title p {
      margin-top: 10px;
      opacity: 0.7;
      letter-spacing: 3px;
    }

    /* ⭐ 导航 */
    .nav {
      text-align: center;
      margin-top: 25px;
    }

    .nav a {
      display: inline-block;
      margin: 8px 10px;
      opacity: 0.8;
      transition: 0.3s;
    }

    .nav a:hover {
      opacity: 1;
      letter-spacing: 2px;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================= */
    /* ⭐ 引导线（新） */
    /* ========================= */

    .guide-line {
      width: 1px;
      height: 80px;
      margin: 60px auto 20px;

      background: linear-gradient(
        to bottom,
        rgba(0,200,255,0),
        rgba(0,200,255,0.9),
        rgba(0,200,255,0)
      );

      box-shadow: 0 0 8px rgba(0,200,255,0.6);

      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ========================= */
    /* ⭐ PROJECT（优化） */
    /* ========================= */

    .projects {
      padding: 80px 8vw;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      max-width: 1100px;
      margin: auto;
    }

    .project-card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .project-card img {
      width: 100%;
      display: block;
      transition: 0.6s ease;
      opacity: 0.9;
    }

    /* ⭐ hover 微放大 */
    .project-card:hover img {
      transform: scale(1.04);
      opacity: 1;
    }

    /* ⭐ hover 暗层 */
    .project-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.2);
      transition: 0.4s;
    }

    .project-card:hover::after {
      background: rgba(0,0,0,0.5);
    }

    /* ⭐ 标题（默认隐藏） */
    .project-title {
      position: absolute;
      bottom: 30px;
      left: 30px;
      font-family: 'Playfair Display', serif;
      letter-spacing: 3px;

      opacity: 0;
      transform: translateY(10px);
      transition: 0.4s;
    }

    /* ⭐ hover 显示 */
    .project-card:hover .project-title {
      opacity: 1;
      transform: translateY(0);
    }

    /* ⭐ 进入动画（轻） */
    .project-card {
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 1s ease forwards;
    }

    .project-card:nth-child(1) { animation-delay: 0.2s; }
    .project-card:nth-child(2) { animation-delay: 0.4s; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================= */
    /* 📱 手机 */
    /* ========================= */

    @media (max-width: 768px) {

      .projects {
        grid-template-columns: 1fr;
        gap: 50px;
        padding: 60px 20px;
      }

      /* ⭐ 手机点击也能看到标题 */
      .project-title {
        opacity: 1;
        transform: none;
      }

    }

  </style>
</head>

<body>

<!-- ⭐ HERO -->
<div class="hero">

  <video autoplay muted loop playsinline>
    <source src="2.mp4" media="(max-width: 768px)">
    <source src="1.mp4" type="video/mp4">
  </video>

  <div class="title">
    <h1>Ariel RothbART</h1>
    <p>Illustration</p>
  </div>

  <div class="nav">
    <a href="about.html">About</a>
    <a href="commission.html">Commission</a>
    <a href="#">Character</a>
    <a href="#">Comics</a>
    <a href="#">Story</a>
    <a href="#">Log</a>
  </div>

</div>

<!-- ⭐ 引导线 -->
<div class="guide-line"></div>

<!-- ⭐ PROJECT -->
<div class="projects">

  <a href="#" class="project-card">
    <img src="poster1.png">
    <div class="project-title">Rhapsody in Neon</div>
  </a>

  <a href="#" class="project-card">
    <img src="poster2.png">
    <div class="project-title">Symphony Noir</div>
  </a>

</div>

</body>
</html>
