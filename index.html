<!DOCTYPE html>
<html>

<head>
  <title>Captain Ariel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">

  <style>

    a {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    /* ⭐ 渐变黑幕（重点） */
    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;

      background: linear-gradient(
        to top,
        rgba(0,0,0,0.85),
        rgba(0,0,0,0.4),
        transparent
      );

      z-index: 1;
    }

    /* ⭐ 标题 */
    .title {
      position: absolute;
      z-index: 2;
      text-align: center;
      width: 100%;
      bottom: 200px;
      font-family: 'Playfair Display', serif;
      letter-spacing: 6px;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.5),
        0 0 20px rgba(255,255,255,0.2);
    }

    .title p {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.7;
    }

    /* ⭐ 导航 */
    .nav {
      position: absolute;
      bottom: 110px;
      width: 100%;
      text-align: center;
      z-index: 2;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .nav a {
      color: white;
      text-decoration: none;
      margin: 6px 10px;
      display: inline-block;
      opacity: 0.6;
      transition: 0.3s;
    }

    .nav a:hover {
      opacity: 1;
      letter-spacing: 4px;
    }

    /* ⭐ 点亮动画 */
    @keyframes softBoot {
      from { opacity: 0.2; }
      to { opacity: 1; }
    }

    .nav a:nth-child(1) { animation: softBoot 1s forwards 0.2s; }
    .nav a:nth-child(2) { animation: softBoot 1s forwards 0.4s; }
    .nav a:nth-child(3) { animation: softBoot 1s forwards 0.6s; }
    .nav a:nth-child(4) { animation: softBoot 1s forwards 0.8s; }
    .nav a:nth-child(5) { animation: softBoot 1s forwards 1s; }
    .nav a:nth-child(6) { animation: softBoot 1s forwards 1.2s; }

    .logo {
      margin-top: 20px;
    }

    .logo img {
      width: 40px;
      opacity: 0.75;
    }

    /* ===================== */
    /* 📱 手机优化（关键） */
    /* ===================== */

    @media (max-width: 768px) {

      video {
        width: 100vw;
        height: 100vh;
        object-fit: cover;

        /* ⭐关键：人物居中 + 稍微放大 */
        object-position: center 35%;
      }

      .overlay {
        height: 45%;
      }

      .title {
        bottom: 180px;
      }

      .title h1 {
        font-size: 24px;
      }

      .nav {
        bottom: 80px;
      }

      .nav a {
        font-size: 13px;
      }

      .logo img {
        width: 34px;
      }
    }

  </style>
</head>

<body>

<div class="hero">

  <video autoplay muted loop playsinline>
    <source src="2.mp4" media="(max-width: 768px)">
    <source src="1.mp4" type="video/mp4">
  </video>

  <!-- ⭐ 渐变 -->
  <div class="overlay"></div>

  <!-- ⭐ 标题 -->
  <div class="title">
    <h1>Ariel RothbART</h1>
    <p>Illustration</p>
  </div>

  <!-- ⭐ 导航 -->
  <div class="nav">
    <a href="about.html">About</a>
    <a href="commission.html">Commission</a>
    <a href="#">Character</a>
    <a href="#">Comics</a>
    <a href="#">Story</a>
    <a href="#">Log</a>

    <div class="logo">
      <a href="index.html">
        <img src="logo.png">
      </a>
    </div>
  </div>

</div>

</body>
</html>
