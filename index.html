<!DOCTYPE html>
<html>

<head>
  <title>Captain Ariel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    a {
      text-decoration: none;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========================= */
    /* ⭐ HERO（完全恢复原版） */
    /* ========================= */

    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      position: absolute;
      top: 80px;
      right: 120px;
      text-align: right;
      font-family: 'Playfair Display', serif;
      letter-spacing: 6px;
      animation: fadeIn 2s ease forwards;
      opacity: 0;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .title p {
      margin-top: 6px;
      opacity: 0.7;
      letter-spacing: 3px;
    }

    .nav {
      position: absolute;
      top: 220px;
      right: 120px;
      text-align: right;
      font-size: 14px;
      letter-spacing: 2px;
    }

    /* ⭐ 顺序亮起（恢复） */
    @keyframes softBoot {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .nav a {
      display: block;
      opacity: 0.2;
    }

    .nav a:nth-child(1) { animation: softBoot 1s forwards 0.2s; }
    .nav a:nth-child(2) { animation: softBoot 1s forwards 0.4s; }
    .nav a:nth-child(3) { animation: softBoot 1s forwards 0.6s; }
    .nav a:nth-child(4) { animation: softBoot 1s forwards 0.8s; }
    .nav a:nth-child(5) { animation: softBoot 1s forwards 1s; }
    .nav a:nth-child(6) { animation: softBoot 1s forwards 1.2s; }

    .nav a:hover {
      opacity: 1;
      letter-spacing: 4px;
      transition: 0.3s;
    }

    /* ⭐ logo 恢复在目录下 */
    .logo {
      margin-top: 20px;
    }

    .logo img {
      width: 42px;
      opacity: 0.75;
      transition: 0.3s;
    }

    .logo img:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================= */
    /* ⭐ 光流系统（连在一起） */
    /* ========================= */

    .flow-system {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    /* ⭐ 主光束（从视频延续） */
    .beam {
      width: 2px;
      height: 140px;

      background: linear-gradient(
        to bottom,
        rgba(0,200,255,0),
        rgba(0,200,255,1),
        rgba(0,200,255,0)
      );

      box-shadow: 0 0 12px rgba(0,200,255,0.9);

      animation: flow 2.5s infinite;
    }

    /* ⭐ 分叉线（连成一体） */
    .branch {
      position: relative;
      width: 300px;
      height: 80px;
    }

    .branch::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 40px;
      background: #00c8ff;
      box-shadow: 0 0 10px #00c8ff;
    }

    .branch::after {
      content: "";
      position: absolute;
      top: 40px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #00c8ff;
      box-shadow: 0 0 10px #00c8ff;
    }

    /* ⭐ 光流动画 */
    @keyframes flow {
      0% { opacity: 0.2; transform: translateY(-20px); }
      50% { opacity: 1; }
      100% { opacity: 0.2; transform: translateY(20px); }
    }

    /* ========================= */
    /* ⭐ PROJECT（ticket风格） */
    /* ========================= */

    .projects {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin-top: 40px;
      margin-bottom: 120px;
    }

    .project-card {
      width: 260px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .project-card img {
      width: 100%;
      display: block;
      transition: 0.5s ease;
    }

    /* ⭐ hover：才变暗 */
    .project-card:hover img {
      transform: scale(1.08);
      filter: brightness(0.7);
    }

    /* ⭐ 标题 hover 才出现 */
    .project-title {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-family: 'Playfair Display', serif;
      letter-spacing: 2px;
      opacity: 0;
      transition: 0.3s;
    }

    .project-card:hover .project-title {
      opacity: 1;
    }

    /* ========================= */
    /* 📱 手机（保持你之前满意的） */
    /* ========================= */

    @media (max-width: 768px) {

      .hero {
        height: auto;
      }

      video {
        height: auto;
      }

      .title {
        position: static;
        text-align: center;
        margin-top: 20px;
      }

      .nav {
        position: static;
        text-align: center;
        margin-top: 20px;
      }

      .nav a {
        display: inline-block;
        margin: 8px;
      }

      .projects {
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }

      .project-card {
        width: 70%;
      }

      .project-title {
        opacity: 1;
      }
    }

  </style>
</head>

<body>

<div class="hero">

  <video autoplay muted loop playsinline>
    <source src="2.mp4" media="(max-width: 768px)">
    <source src="1.mp4" type="video/mp4">
  </video>

  <div class="title">
    <h1>Ariel RothbART</h1>
    <p>Illustration</p>
  </div>

  <div class="nav">
    <a href="about.html">About</a>
    <a href="commission.html">Commission</a>
    <a href="#">Character</a>
    <a href="#">Comics</a>
    <a href="#">Story</a>
    <a href="#">Log</a>

    <div class="logo">
      <a href="index.html">
        <img src="logo.png">
      </a>
    </div>
  </div>

</div>

<!-- ⭐ 光流 + 分叉（连贯） -->
<div class="flow-system">
  <div class="beam"></div>
  <div class="branch"></div>
</div>

<!-- ⭐ PROJECT -->
<div class="projects">

  <a href="#" class="project-card">
    <img src="poster1.png">
    <div class="project-title">Rhapsody in Neon</div>
  </a>

  <a href="#" class="project-card">
    <img src="poster2.png">
    <div class="project-title">Symphony Noir</div>
  </a>

</div>

</body>
</html>
