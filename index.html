<!DOCTYPE html>
<html>

<head>
  <title>Captain Ariel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    a {
      text-decoration: none;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========================= */
    /* ⭐ HERO（完全不动结构） */
    /* ========================= */

    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title {
      position: absolute;
      top: 80px;
      right: 120px;
      text-align: right;
      font-family: 'Playfair Display', serif;
      letter-spacing: 6px;
      animation: fadeIn 2s ease forwards;
      opacity: 0;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .title p {
      margin-top: 6px;
      opacity: 0.7;
    }

    .nav {
      position: absolute;
      top: 220px;
      right: 120px;
      text-align: right;
      letter-spacing: 2px;
    }

    .nav a {
      display: block;
      opacity: 0.3;
      transition: 0.3s;
    }

    .nav a:hover {
      opacity: 1;
      letter-spacing: 4px;
    }

    /* ⭐ 你已经定好的 logo（完全保留） */
    .home-logo {
      position: fixed;
      top: 80px;
      right: 60px;
      z-index: 1000;
    }

    .home-logo img {
      width: 80px;
      opacity: 0.8;
      transition: 0.3s;
    }

    .home-logo img:hover {
      opacity: 1;
      transform: scale(1.08);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================= */
    /* ⭐ 分叉引导线（重点） */
    /* ========================= */

    .flow {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 竖线 */
    .line-vertical {
      width: 2px;
      height: 80px;

      background: linear-gradient(
        to bottom,
        rgba(0,200,255,0),
        rgba(0,200,255,1),
        rgba(0,200,255,0)
      );

      box-shadow: 0 0 10px rgba(0,200,255,0.8);

      animation: flowLight 2s infinite;
    }

    /* 横线 */
    .line-horizontal {
      width: 220px;
      height: 2px;
      margin-top: 0;

      background: linear-gradient(
        to right,
        rgba(0,200,255,0),
        rgba(0,200,255,1),
        rgba(0,200,255,0)
      );

      box-shadow: 0 0 10px rgba(0,200,255,0.8);
    }

    @keyframes flowLight {
      0% { opacity: 0.2; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    /* ========================= */
    /* ⭐ PROJECT（票据尺寸） */
    /* ========================= */

    .projects {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin-top: 40px;
      margin-bottom: 120px;
    }

    .project-card {
      width: 260px;   /* ⭐像 ticket */
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .project-card img {
      width: 100%;
      display: block;
      transition: 0.5s ease;
    }

    /* ⭐ hover：轻微放大 + 变暗 */
    .project-card:hover img {
      transform: scale(1.08);
      filter: brightness(0.7);
    }

    /* ⭐ 标题（默认不显示） */
    .project-title {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-family: 'Playfair Display', serif;
      letter-spacing: 2px;

      opacity: 0;
      transition: 0.4s;
    }

    .project-card:hover .project-title {
      opacity: 1;
    }

    /* ========================= */
    /* 📱 手机（只做必要适配） */
    /* ========================= */

    @media (max-width: 768px) {

      .hero {
        height: auto;
      }

      video {
        height: auto;
      }

      .title {
        position: static;
        text-align: center;
        margin-top: 20px;
      }

      .nav {
        position: static;
        text-align: center;
        margin-top: 20px;
      }

      .nav a {
        display: inline-block;
        margin: 8px;
      }

      .projects {
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }

      .project-card {
        width: 70%;
      }

      /* 手机直接显示标题 */
      .project-title {
        opacity: 1;
      }
    }

  </style>
</head>

<body>

<!-- ⭐ HERO -->
<div class="hero">

  <video autoplay muted loop playsinline>
    <source src="2.mp4" media="(max-width: 768px)">
    <source src="1.mp4" type="video/mp4">
  </video>

  <div class="title">
    <h1>Ariel RothbART</h1>
    <p>Illustration</p>
  </div>

  <div class="nav">
    <a href="about.html">About</a>
    <a href="commission.html">Commission</a>
    <a href="#">Character</a>
    <a href="#">Comics</a>
    <a href="#">Story</a>
    <a href="#">Log</a>
  </div>

</div>

<!-- ⭐ LOGO（保留） -->
<a href="index.html" class="home-logo">
  <img src="logo.png">
</a>

<!-- ⭐ 引导线结构 -->
<div class="flow">
  <div class="line-vertical"></div>
  <div class="line-horizontal"></div>
</div>

<!-- ⭐ PROJECT -->
<div class="projects">

  <a href="#" class="project-card">
    <img src="poster1.png">
    <div class="project-title">Rhapsody in Neon</div>
  </a>

  <a href="#" class="project-card">
    <img src="poster2.png">
    <div class="project-title">Symphony Noir</div>
  </a>

</div>

</body>
</html>
