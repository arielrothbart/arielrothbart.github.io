<!DOCTYPE html>
<html>

<head>
  <title>Captain Ariel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    a {
      text-decoration: none;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== HERO ===== */

    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero::before {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 30%;

      background: linear-gradient(
        to top,
        rgba(0,0,0,1),
        rgba(0,0,0,0.8),
        rgba(0,0,0,0.4),
        rgba(0,0,0,0)
      );

      transform: translateY(60px);
      opacity: 0;
      animation: rise 1.8s ease forwards;
    }

    @keyframes rise {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .title {
      position: absolute;
      top: 80px;
      right: 120px;
      text-align: right;
      font-family: 'Playfair Display', serif;
      letter-spacing: 6px;
      animation: fadeIn 2s ease forwards;
      opacity: 0;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .title p {
      margin-top: 6px;
      opacity: 0.7;
      letter-spacing: 3px;
    }

    .nav {
      position: absolute;
      top: 220px;
      right: 120px;
      text-align: right;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .nav a {
      display: block;
      opacity: 0.2;
    }

    .nav a:hover {
      opacity: 1;
      letter-spacing: 4px;
      transition: 0.3s;
    }

    .logo img {
      width: 42px;
      opacity: 0.75;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* ===== SIGNAL ===== */

    .signal {
      width: 2px;
      height: 120px;
      margin: -40px auto 20px;
      background: linear-gradient(
        to bottom,
        rgba(0,200,255,0),
        rgba(0,200,255,1),
        rgba(0,200,255,0)
      );
      box-shadow: 0 0 14px rgba(0,200,255,0.9);
      animation: signalFlow 2.5s infinite;
    }

    @keyframes signalFlow {
      0% { opacity: 0.3; transform: translateY(-10px); }
      50% { opacity: 1; }
      100% { opacity: 0.3; transform: translateY(20px); }
    }

    /* ===== PROJECTS ===== */

    .projects {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin: 60px 0 120px;
    }

    .project-card {
      width: 260px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .project-card img {
      width: 100%;
      transition: 0.5s ease;
    }

    .project-card:hover img {
      transform: scale(1.08);
      filter: brightness(0.7);
    }

    .project-title {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-family: 'Playfair Display', serif;
      letter-spacing: 2px;
      opacity: 0;
      transition: 0.3s;
    }

    .project-card:hover .project-title {
      opacity: 1;
    }

  </style>
</head>

<body>

<div class="hero">

  <video autoplay muted loop playsinline>
    <source src="2.mp4" media="(max-width: 768px)">
    <source src="1.mp4" type="video/mp4">
  </video>

  <div class="title">
    <h1>Ariel RothbART</h1>
    <p>Illustration</p>
  </div>

  <div class="nav">
    <a href="about.html">About</a>
    <a href="commission.html">Commission</a>
    <a href="#">Character</a>
    <a href="#">Comics</a>
    <a href="#">Story</a>
    <a href="#">Log</a>

    <div class="logo">
      <a href="index.html">
        <img src="logo.png">
      </a>
    </div>
  </div>

</div>

<div class="signal"></div>

<!-- ⭐ PROJECTS -->
<div class="projects">

  <!-- 项目1 -->
  <a href="#" class="project-card">
    <img src="poster1.png">
    <div class="project-title">Rhapsody in Neon</div>
  </a>

  <!-- 项目2（已连接 Symphony Noir） -->
  <a href="sym-noir.html" class="project-card">
    <img src="poster2.png">
    <div class="project-title">Symphony Noir</div>
  </a>

</div>

</body>
</html>
