<!DOCTYPE html>
<html>

<head>
  <title>Captain Ariel</title>

  <!-- 字体-->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    /* 主视觉区域 */
    .hero {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .hero img {
      width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* 右上标题 */
    .title {
      position: absolute;
      top: 80px;
      right: 120px;
      text-align: right;
      font-family: 'Playfair Display', serif;
      letter-spacing: 6px;
      animation: fadeIn 2s ease;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .title p {
      margin: 6px 0 0 0;
      font-size: 14px;
      letter-spacing: 3px;
      opacity: 0.7;
    }

    /* 右侧导航 */
    .nav {
      position: absolute;
      top: 220px;
      right: 120px;
      text-align: right;
      font-size: 14px;
      letter-spacing: 2px;
      line-height: 1.8;
    }

    .nav a {
      color: white;
      text-decoration: none;
      display: block;
      transition: 0.3s;
    }

    .nav a:hover {
      opacity: 0.5;
    }

    /* 左下角 logo */
    .logo {
  position: fixed;
  bottom: 80px;
  left: 80px;
}
.logo img {
  width: 40px;
  opacity: 0.5;
  mix-blend-mode: screen;
  transition: 0.3s;
}
    .logo img {
      width: 40px;
      opacity: 0.7;
      transition: 0.3s;
    }

    .logo img:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    /* 淡入动画 */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>
</head>

<body>

  <div class="hero">

    <img src="1.gif">

    <!-- 标题 -->
    <div class="title">
      <h1>Ariel RothbART</h1>
      <p>Illustration</p>
    </div>

    <!-- 右侧目录 -->
    <div class="nav">
      <a href="#">About</a>
      <a href="#">Archive</a>
      <a href="#">Character</a>
      <a href="#">Story</a>
      <a href="#">Comics</a>
    </div>

  </div>

  <!-- 左下角 Home 图标 -->
  <a href="index.html" class="logo">
    <img src="logo.png">
  </a>

</body>

</html>
