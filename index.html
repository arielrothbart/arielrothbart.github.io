<!DOCTYPE html>
<html>

<head>
  <title>Captain Ariel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    a {
      text-decoration: none;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }

    /* ⭐ HERO */
    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    /* ⭐ 标题 */
    .title {
      position: absolute;
      top: 80px;
      right: 120px;
      text-align: right;
      font-family: 'Playfair Display', serif;
      letter-spacing: 6px;

      opacity: 0;
      transform: translateY(-10px);
      animation: fadeIn 1.8s ease forwards;
      z-index: 2;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .title p {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.7;
      letter-spacing: 3px;
    }

    /* ⭐ 导航 */
    .nav {
      position: absolute;
      top: 220px;
      right: 120px;
      text-align: right;
      font-size: 14px;
      letter-spacing: 2px;
      z-index: 2;
    }

    .nav a {
      display: block;
      opacity: 0.3;
      transition: 0.3s;
    }

    .nav a:hover {
      opacity: 1;
      letter-spacing: 4px;
    }

    /* ⭐ 动画 */
    @keyframes softBoot {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .nav a:nth-child(1) { animation: softBoot 1s forwards 0.3s; }
    .nav a:nth-child(2) { animation: softBoot 1s forwards 0.5s; }
    .nav a:nth-child(3) { animation: softBoot 1s forwards 0.7s; }
    .nav a:nth-child(4) { animation: softBoot 1s forwards 0.9s; }
    .nav a:nth-child(5) { animation: softBoot 1s forwards 1.1s; }
    .nav a:nth-child(6) { animation: softBoot 1s forwards 1.3s; }

    .logo {
      margin-top: 20px;
    }

    .logo img {
      width: 42px;
      opacity: 0.7;
      transition: 0.3s;
    }

    .logo img:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================= */
    /* ⭐ PROJECT 区块（新加） */
    /* ========================= */

    .projects {
      padding: 100px 8vw;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      background: black;
    }

    .project-card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .project-card img {
      width: 100%;
      display: block;
      transition: 0.6s ease;
    }

    /* ⭐ hover 放大（电影感） */
    .project-card:hover img {
      transform: scale(1.05);
    }

    /* ⭐ 暗层 */
    .project-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      transition: 0.4s;
    }

    .project-card:hover::after {
      background: rgba(0,0,0,0.2);
    }

    /* ⭐ 标题 */
    .project-title {
      position: absolute;
      bottom: 30px;
      left: 30px;
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      letter-spacing: 3px;
      z-index: 2;
    }

    /* ⭐ 进入动画（轻） */
    .project-card {
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 1s ease forwards;
    }

    .project-card:nth-child(1) { animation-delay: 0.2s; }
    .project-card:nth-child(2) { animation-delay: 0.4s; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================= */
    /* 📱 手机 */
    /* ========================= */

    @media (max-width: 768px) {

      video {
        object-position: 40% 25%;
      }

      .title {
        bottom: 200px;
        top: auto;
        right: 0;
        width: 100%;
        text-align: center;
      }

      .nav {
        bottom: 90px;
        top: auto;
        right: 0;
        width: 100%;
        text-align: center;
      }

      .nav a {
        display: inline-block;
        margin: 6px 10px;
      }

      .projects {
        grid-template-columns: 1fr;
        gap: 40px;
        padding: 60px 20px;
      }

    }

  </style>
</head>

<body>

<!-- ⭐ HERO -->
<div class="hero">

  <video autoplay muted loop playsinline>
    <source src="2.mp4" media="(max-width: 768px)">
    <source src="1.mp4" type="video/mp4">
  </video>

  <div class="title">
    <h1>Ariel RothbART</h1>
    <p>Illustration</p>
  </div>

  <div class="nav">
    <a href="about.html">About</a>
    <a href="commission.html">Commission</a>
    <a href="#">Character</a>
    <a href="#">Comics</a>
    <a href="#">Story</a>
    <a href="#">Log</a>

    <div class="logo">
      <a href="index.html">
        <img src="logo.png">
      </a>
    </div>
  </div>

</div>

<!-- ⭐ PROJECTS -->
<div class="projects">

  <a href="#" class="project-card">
    <img src="poster1.png">
    <div class="project-title">Rhapsody in Neon</div>
  </a>

  <a href="#" class="project-card">
    <img src="poster2.png">
    <div class="project-title">Symphony Noir</div>
  </a>

</div>

</body>
</html>
