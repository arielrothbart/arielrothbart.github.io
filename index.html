<!DOCTYPE html>
  
<head>
  <title>Captain Ariel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
  <style>
@font-face {
  font-family: 'VladBold';
  src: url('./fonts/Vladivostok-Bold.woff2') format('woff2'),
       url('./fonts/Vladivostok-Bold.woff') format('woff');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    a {
      text-decoration: none;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========================= */
    /* ⭐ HERO（完全不动） */
    /* ========================= */

    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 120px;

      background: linear-gradient(
        to bottom,
        rgba(0,200,255,0),
        rgba(0,200,255,1),
        rgba(0,200,255,0)
      );

      box-shadow: 0 0 18px rgba(0,200,255,1);

      animation: beamFlow 2.5s infinite;
      pointer-events: none;
    }

    @keyframes beamFlow {
      0% { opacity: 0; transform: translate(-50%, -10px); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, 20px); }
    }

    .title {
  position: absolute;
  top: 80px;
  right: 120px;
  text-align: right;
font-family: 'Poiret One', sans-serif;
  font-weight: 400;
  letter-spacing: 6px;

  opacity: 0;
  transform: translateY(-40px); /* ⭐关键这一行 */

  animation: fadeIn 2.5s ease forwards;
}

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .title p {
      margin-top: 6px;
      opacity: 0.7;
      letter-spacing: 3px;
    }

    .nav {
  position: absolute;
  top: 200px;          /* 稍微往下，呼吸感更好 */
  right: 140px;        /* 稍微往左一点，避免贴边 */

  text-align: right;
  font-size: 18px;     /* ⭐ 放大字体 */
  letter-spacing: 3px; /* ⭐ 更有设计感 */
  line-height: 1.8;    /* ⭐ 拉开行距 */
  
 font-family: 'Playfair Display', serif;
  text-shadow: 0 0 6px rgba(255,255,255,0.15);
      
}

    @keyframes softBoot {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

.nav a {
  display: block;
  opacity: 0.25;

  margin: 6px 0;
  transition: 0.3s;

  text-shadow: 0 0 4px rgba(0,0,0,0.6);  /* ⭐关键 */
}

    .nav a:nth-child(1) { animation: softBoot 1.2s forwards 0.6s; }
    .nav a:nth-child(2) { animation: softBoot 1.2s forwards 0.2s; }
    .nav a:nth-child(3) { animation: softBoot 1.2s forwards 1.0s; }
    .nav a:nth-child(4) { animation: softBoot 1.2s forwards 0.4s; }
    .nav a:nth-child(5) { animation: softBoot 1.2s forwards 1.2s; }
    .nav a:nth-child(6) { animation: softBoot 1.2s forwards 0.8s; }

  .nav a:hover {
  opacity: 1;
  letter-spacing: 5px;   /* ⭐ hover 更明显一点 */
  transform: translateX(-4px); /* ⭐ 微微滑动，很有质感 */
}

    .logo {
      margin-top: 20px;
    }

  .logo img {
  width: 60px;       /* ⭐ 放大 */
  opacity: 0.8;
  transition: 0.3s;
}

  .logo img:hover {
  opacity: 1;
  transform: scale(1.15);
}

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================= */
    /* ⭐ 主光流 */
    /* ========================= */
.beam {
  width: 2px;
  height: 180px; /* ⭐拉长 */

  margin: -60px auto 0; /* ⭐关键：往上拉 */

  background: linear-gradient(
    to bottom,
    rgba(0,200,255,0),
    rgba(0,200,255,1),
    rgba(0,200,255,0)
  );

  box-shadow: 0 0 16px rgba(0,200,255,1);

  animation: flow 2.5s infinite;
}
.beam::before {
  content: "";
 position: relative; 
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #00c8ff;
  box-shadow: 0 0 12px #00c8ff;
}
    .energy-dot {
  position: absolute;
  bottom: 00px;     /* 控制高度，想往上就改这个 */
  left: 50%;
  transform: translateX(-50%);

  width: 8px;
  height: 8px;
  border-radius: 50%;

  background: #00c8ff;

  box-shadow:
    0 0 6px #00c8ff,
    0 0 14px #00c8ff,
    0 0 28px rgba(0,200,255,0.8);

  animation: dotPulse 2.5s infinite ease-in-out;
}

@keyframes dotPulse {
  0%   { opacity: 0.3; transform: translateX(-50%) scale(0.8); }
  50%  { opacity: 1;   transform: translateX(-50%) scale(1.2); }
  100% { opacity: 0.3; transform: translateX(-50%) scale(0.8); }
}
    /* ========================= */
    /* ⭐ PROJECT */
    /* ========================= */

    .projects {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin: 40px 0 120px;
    }

    .project-card {
      width: 260px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .project-card img {
      width: 100%;
      transition: 0.5s ease;
    }

    .project-card:hover img {
      transform: scale(1.08);
     filter: brightness(1.1) contrast(1.1);
    }

    .project-title {
     display: none;
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-family: 'Playfair Display', serif;
      letter-spacing: 2px;
      opacity: 0;
      transition: 0.3s;
    }

    .project-card:hover .project-title {
      opacity: 1;
    }

    .projects:hover .beam {
      box-shadow: 0 0 22px #00c8ff;
    }
.lounge-entry{
  position: absolute;        /* 👈 改这里 */
  left: 50%;
  transform: translateX(-50%);

  top: calc(100vh + 120px);  /* 👈 关键：在首屏下面 */

  width: 220px;
  height: 50px;

  cursor: pointer;
  z-index: 10;
}

/* 两层 */
.chip{
  position:absolute;
  width:100%;
  padding:12px 0;

  text-align:center;
  font-size:13px;
  letter-spacing:2px;

  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.02);

  transition:0.3s ease;
}

/* 上层 */
.chip.top{
  top:0;
  left:0;
  z-index:2;
}

/* 下层 */
.chip.bottom{
  top:6px;
  left:6px;
  opacity:0.4;
}

/* hover 错位 */
.lounge-entry:hover .top{
  transform:translate(4px,4px);
}

.lounge-entry:hover .bottom{
  transform:translate(-4px,-4px);
  opacity:0.8;
}

/* hover 发光 */
.lounge-entry:hover .chip{
  border-color:#00c8ff;
  box-shadow:0 0 10px rgba(0,200,255,0.6);
}
  @media (max-width: 768px) {

    .hero {
        height: auto;
      }

      video {
        height: auto;
      }

      .title {
        position: static;
        text-align: center;
        margin-top: 20px;
      }

      .nav {
        position: static;
        text-align: center;
        margin-top: 20px;
      }

      .nav a {
        display: inline-block;
        margin: 8px;
      }

      .projects {
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }

      .project-card {
        width: 70%;
      }

      .project-title {
        opacity: 1;
      }
    }

  </style>
</head>

<body>

<div class="hero">
<div class="energy-dot"></div>
<video autoplay muted loop playsinline preload="auto" webkit-playsinline id="heroVideo">

  <!-- 📱 手机 -->

  <!-- 💻 桌面： -->
  <source src="images/index/1.webm" media="(min-width: 769px)" type="video/webm">
  <source src="images/index/1.mp4" media="(min-width: 769px)" type="video/mp4">
 
</video>

  <div class="title">
    <h1>Ariel RothbART</h1>
    <p>Illustration</p>
  </div>

  <div class="nav">
    <a href="about.html">About</a>
    <a href="commission.html">Commission</a>
    <a href="#">Character</a>
   <a href="comics.html">Comics</a>
    <a href="#">Story</a>
    <a href="#">Log</a>

    <div class="logo">
      <a href="index.html">
        <img src="logo.png">
      </a>
    </div>
  </div>

</div>

<div class="projects">

 <a href="transmission.html" class="project-card">
  <img src="images/index/poster1.jpg">
  <div class="project-title">Rhapsody in Neon</div>
  </a>

  <!-- ⭐ 这里只改了这一行 -->
  <a href="sym-noir.html" class="project-card">
    <img src="images/index/poster2.jpg">
    <div class="project-title">Symphony Noir</div>
  </a>
</div>

<a href="lounge.html" class="lounge-entry">
  <div class="chip top">CREW LOUNGE</div>
  <div class="chip bottom">CREW LOUNGE</div>
</div>  
<script>
const video = document.getElementById("heroVideo");

// ⭐ 1. 页面加载时就尝试播放
function tryPlayVideo() {
  if (video) {
    const playPromise = video.play();

    if (playPromise !== undefined) {
      playPromise.catch(() => {
        // 自动播放失败（iOS常见）
        console.log("Autoplay blocked, waiting for interaction");
      });
    }
  }
}

// ⭐ DOM加载完成就试
document.addEventListener("DOMContentLoaded", tryPlayVideo);

// ⭐ 页面真正显示时再试一次（关键！）
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    tryPlayVideo();
  }
});

// ⭐ 2. 用户交互兜底（滑动 / 点屏）
document.addEventListener("touchstart", tryPlayVideo, { once: true });
document.addEventListener("scroll", tryPlayVideo, { once: true });
</script>
</body>
</html>
