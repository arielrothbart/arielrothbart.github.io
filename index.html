<!DOCTYPE html>
<html>

<head>
  <title>Captain Ariel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    a {
      text-decoration: none;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }

    /* ⭐ HERO */
    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    /* ⭐ 标题（电脑端保持不动） */
    .title {
      position: absolute;
      top: 80px;
      right: 120px;
      text-align: right;
      font-family: 'Playfair Display', serif;
      letter-spacing: 6px;

      opacity: 0;
      transform: translateY(-10px);
      animation: fadeIn 1.8s ease forwards;
      z-index: 2;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .title p {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.7;
      letter-spacing: 3px;
    }

    /* ⭐ 导航（电脑端保持不动） */
    .nav {
      position: absolute;
      top: 220px;
      right: 120px;
      text-align: right;
      font-size: 14px;
      letter-spacing: 2px;
      z-index: 2;
    }

    .nav a {
      display: block;
      opacity: 0.3;
      transition: 0.3s;
    }

    .nav a:hover {
      opacity: 1;
      letter-spacing: 4px;
    }

    /* ⭐ 顺序亮起 */
    @keyframes softBoot {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .nav a:nth-child(1) { animation: softBoot 1s forwards 0.3s; }
    .nav a:nth-child(2) { animation: softBoot 1s forwards 0.5s; }
    .nav a:nth-child(3) { animation: softBoot 1s forwards 0.7s; }
    .nav a:nth-child(4) { animation: softBoot 1s forwards 0.9s; }
    .nav a:nth-child(5) { animation: softBoot 1s forwards 1.1s; }
    .nav a:nth-child(6) { animation: softBoot 1s forwards 1.3s; }

    .logo {
      margin-top: 20px;
    }

    .logo img {
      width: 42px;
      opacity: 0.7;
      transition: 0.3s;
    }

    .logo img:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    /* ⭐ 渐显 */
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================= */
    /* 📱 手机端（完全重做结构） */
    /* ========================= */

    @media (max-width: 768px) {

      .hero {
        height: auto;
        display: flex;
        flex-direction: column;
      }

      video {
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      /* ⭐ 新的信息区 */
      .mobile-panel {
        background: linear-gradient(
          to bottom,
          rgba(0,0,0,0.2),
          rgba(0,0,0,0.95)
        );

        padding: 30px 20px 40px;
        text-align: center;
      }

      /* ⭐ 标题 */
      .title {
        position: static;
        text-align: center;
        margin-bottom: 20px;
      }

      .title h1 {
        font-size: 24px;
        letter-spacing: 4px;
      }

      .title p {
        font-size: 12px;
        margin-top: 6px;
      }

      /* ⭐ 导航 */
      .nav {
        position: static;
        text-align: center;
        margin-top: 10px;
      }

      .nav a {
        display: inline-block;
        margin: 6px 10px;
        font-size: 13px;
        opacity: 0.8;
      }

      .nav a:hover {
        letter-spacing: 2px;
      }

      .logo img {
        width: 32px;
      }

    }

  </style>
</head>

<body>

<div class="hero">

  <video autoplay muted loop playsinline>
    <source src="2.mp4" media="(max-width: 768px)">
    <source src="1.mp4" type="video/mp4">
  </video>

  <!-- ⭐ 手机端用 -->
  <div class="mobile-panel">

    <div class="title">
      <h1>Ariel RothbART</h1>
      <p>Illustration</p>
    </div>

    <div class="nav">
      <a href="about.html">About</a>
      <a href="commission.html">Commission</a>
      <a href="#">Character</a>
      <a href="#">Comics</a>
      <a href="#">Story</a>
      <a href="#">Log</a>

      <div class="logo">
        <a href="index.html">
          <img src="logo.png">
        </a>
      </div>
    </div>

  </div>

</div>

</body>
</html>
