  <style>
@font-face {
  font-family: 'VladBold';
  src: url('./fonts/Vladivostok-Bold.woff2') format('woff2'),
       url('./fonts/Vladivostok-Bold.woff') format('woff');

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    a {
      text-decoration: none;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========================= */
    /* ⭐ HERO（完全不动） */
    /* ========================= */

    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 120px;

      background: linear-gradient(
        to bottom,
        rgba(0,200,255,0),
        rgba(0,200,255,1),
        rgba(0,200,255,0)
      );

      box-shadow: 0 0 18px rgba(0,200,255,1);

      animation: beamFlow 2.5s infinite;
      pointer-events: none;
    }

    @keyframes beamFlow {
      0% { opacity: 0; transform: translate(-50%, -10px); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, 20px); }
    }

    .title {
  position: absolute;
  top: 80px;
  right: 120px;
  text-align: right;
font-family: 'Poiret One', sans-serif;
  font-weight: 400;
  letter-spacing: 6px;

  opacity: 0;
  transform: translateY(-40px); /* ⭐关键这一行 */

  animation: fadeIn 2.5s ease forwards;
}

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .title p {
      margin-top: 6px;
      opacity: 0.7;
      letter-spacing: 3px;
    }

    .nav {
  position: absolute;
  top: 200px;          /* 稍微往下，呼吸感更好 */
  right: 140px;        /* 稍微往左一点，避免贴边 */

  text-align: right;
  font-size: 18px;     /* ⭐ 放大字体 */
  letter-spacing: 3px; /* ⭐ 更有设计感 */
  line-height: 1.8;    /* ⭐ 拉开行距 */
  
 font-family: 'Playfair Display', serif;
  text-shadow: 0 0 6px rgba(255,255,255,0.15);
      
}

    @keyframes softBoot {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

.nav a {
  display: block;
  opacity: 0.25;

  margin: 6px 0;
  transition: 0.3s;

  text-shadow: 0 0 4px rgba(0,0,0,0.6);  /* ⭐关键 */
}

    .nav a:nth-child(1) { animation: softBoot 1.2s forwards 0.6s; }
    .nav a:nth-child(2) { animation: softBoot 1.2s forwards 0.2s; }
    .nav a:nth-child(3) { animation: softBoot 1.2s forwards 1.0s; }
    .nav a:nth-child(4) { animation: softBoot 1.2s forwards 0.4s; }
    .nav a:nth-child(5) { animation: softBoot 1.2s forwards 1.2s; }
    .nav a:nth-child(6) { animation: softBoot 1.2s forwards 0.8s; }

  .nav a:hover {
  opacity: 1;
  letter-spacing: 5px;   /* ⭐ hover 更明显一点 */
  transform: translateX(-4px); /* ⭐ 微微滑动，很有质感 */
}

    .logo {
      margin-top: 20px;
    }

  .logo img {
  width: 60px;       /* ⭐ 放大 */
  opacity: 0.8;
  transition: 0.3s;
}

  .logo img:hover {
  opacity: 1;
  transform: scale(1.15);
}

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================= */
    /* ⭐ 主光流 */
    /* ========================= */
.beam {
  width: 2px;
  height: 180px; /* ⭐拉长 */

  margin: -60px auto 0; /* ⭐关键：往上拉 */

  background: linear-gradient(
    to bottom,
    rgba(0,200,255,0),
    rgba(0,200,255,1),
    rgba(0,200,255,0)
  );

  box-shadow: 0 0 16px rgba(0,200,255,1);

  animation: flow 2.5s infinite;
}
.beam::before {
  content: "";
 position: relative; 
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #00c8ff;
  box-shadow: 0 0 12px #00c8ff;
}
    .energy-dot {
  position: absolute;
  bottom: 00px;     /* 控制高度，想往上就改这个 */
  left: 50%;
  transform: translateX(-50%);

  width: 8px;
  height: 8px;
  border-radius: 50%;

  background: #00c8ff;

  box-shadow:
    0 0 6px #00c8ff,
    0 0 14px #00c8ff,
    0 0 28px rgba(0,200,255,0.8);

  animation: dotPulse 2.5s infinite ease-in-out;
}

@keyframes dotPulse {
  0%   { opacity: 0.3; transform: translateX(-50%) scale(0.8); }
  50%  { opacity: 1;   transform: translateX(-50%) scale(1.2); }
  100% { opacity: 0.3; transform: translateX(-50%) scale(0.8); }
}
    /* ========================= */
    /* ⭐ PROJECT */
    /* ========================= */

    .projects {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin: 40px 0 120px;
    }

    .project-card {
      width: 260px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .project-card img {
      width: 100%;
      transition: 0.5s ease;
    }

    .project-card:hover img {
      transform: scale(1.08);
     filter: brightness(1.1) contrast(1.1);
    }

    .project-title {
     display: none;
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-family: 'Playfair Display', serif;
      letter-spacing: 2px;
      opacity: 0;
      transition: 0.3s;
    }

    .project-card:hover .project-title {
      opacity: 1;
    }

    .projects:hover .beam {
      box-shadow: 0 0 22px #00c8ff;
    }
.lounge-entry{
  width:220px;
  height:90px;

  margin:35px auto 120px;  /* 👈 控制上下间距 */

  position:relative;
  cursor:pointer;
}
.lounge-wrapper{
  display:flex;
  justify-content:center;
}
/* 两层 */
.chip{
  top:45px;  
  position:absolute;
  width:100%;
  padding:12px 0;

  text-align:center;
  font-size:13px;
  letter-spacing:2px;

  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.02);

  transition:0.3s ease;
}

/* 上层 */
.chip.top{
  top:0;
  left:0;
  z-index:2;
}

/* 下层 */
.chip.bottom{
  top:6px;
  left:6px;
  opacity:0.4;
}

/* hover 错位 */
.lounge-entry:hover .top{
  transform:translate(4px,4px);
}

.lounge-entry:hover .bottom{
  transform:translate(-4px,-4px);
  opacity:0.8;
}

/* hover 发光 */
.lounge-entry:hover .chip{
  border-color:#00c8ff;
  box-shadow:0 0 10px rgba(0,200,255,0.6);
}
/* 点击瞬间：整体轻微按下 */
.lounge-entry{
  transition: transform 0.15s ease;
}
/* 点击时：发光更强 */
.lounge-entry:active .chip{
  border-color:#00c8ff;
  box-shadow:
    0 0 8px rgba(0,200,255,0.8),
    0 0 20px rgba(0,200,255,0.6);
}
.lounge-entry:active{
  transform: scale(0.97);
}
    /* 咖啡：轮廓发光（不是方块） */
.lounge-entry:hover .coffee-icon img{
  filter: drop-shadow(0 0 6px rgba(0,200,255,0.6));
}

.lounge-entry:active .coffee-icon img{
  filter: drop-shadow(0 0 10px rgba(0,200,255,0.9));
}
    
  @media (max-width: 768px) {

    .hero {
        height: auto;
      }

      video {
        height: auto;
      }

      .title {
        position: static;
        text-align: center;
        margin-top: 20px;
      }

      .nav {
        position: static;
        text-align: center;
        margin-top: 20px;
      }

      .nav a {
        display: inline-block;
        margin: 8px;
      }

      .projects {
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }

      .project-card {
        width: 70%;
      }

      .project-title {
        opacity: 1;
      }
    .lounge-entry:hover .coffee-icon{
  opacity:1;
  transform:translateX(-50%) scale(1.05);
}
    }
/* 整体位置 */
.coffee-icon{
  position:absolute;
  left:50%;
  transform:translateX(-50%);

  top:-60px;   /* 👈 往上“抬”到红框位置 */

  width:60px;
  height:60px;

  opacity:0.6;
  pointer-events:none;
}
    .coffee-icon img{
  width:100%;
  height:100%;
  object-fit:contain;
}


/* hover 联动 */
.lounge-entry:hover .coffee-icon{
  opacity:1;
}

/* 极简指引样式 */
.simple-guide {
  display: flex;
  flex-direction: column; /* 让线和字竖着排，正好在两张海报中间 */
  align-items: center;
  justify-content: center;
  gap: 15px;
  pointer-events: none;
}

.simple-guide span {
  font-family: 'Poiret One', sans-serif;
  font-size: 11px;
  letter-spacing: 4px;
  color: #00c8ff;
  opacity: 0.5;
  white-space: nowrap;
  /* 竖排文字如果是横着的，可以加这个： */
  writing-mode: vertical-lr; 
}

.guide-line {
  width: 1px;
  height: 80px;
  background: linear-gradient(to bottom, transparent, #00c8ff, transparent);
  box-shadow: 0 0 8px rgba(0,200,255,0.5);
}

/* P5P 特殊入口样式 */
.p5p-entry {
    filter: grayscale(0.8) contrast(1.2); /* 初始状态黑白感，暗示是旧档案 */
    transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1);
}

.p5p-entry:hover {
    filter: grayscale(0) brightness(1.1); /* 移入时恢复色彩 */
}

.p5p-entry::before {
    content: "COOPERATIVE WORK";
    position: absolute;
    top: -20px;
    left: 0;
    font-size: 10px;
    letter-spacing: 2px;
    color: #ff4444; /* 给同人企划一点警示色，更有P5的感觉 */
    opacity: 0;
    transition: 0.5s;
}

.p5p-entry:hover::before {
    opacity: 0.7;
    transform: translateY(10px);
}

/* 手机端适配：海报变上下排时，指引也变横向 */
@media (max-width: 768px) {
  .simple-guide {
    flex-direction: row;
    width: 100%;
    margin: 20px 0;
  }
  .simple-guide span {
    writing-mode: horizontal-tb;
  }
  .guide-line {
    width: 50px;
    height: 1px;
    background: linear-gradient(to right, transparent, #00c8ff, transparent);
  }
}

<script>
const video = document.getElementById("heroVideo");

// ⭐ 1. 页面加载时就尝试播放
function tryPlayVideo() {
  if (video) {
    const playPromise = video.play();

    if (playPromise !== undefined) {
      playPromise.catch(() => {
        // 自动播放失败（iOS常见）
        console.log("Autoplay blocked, waiting for interaction");
      });
    }
  }
}

// ⭐ DOM加载完成就试
document.addEventListener("DOMContentLoaded", tryPlayVideo);

// ⭐ 页面真正显示时再试一次（关键！）
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    tryPlayVideo();
  }
});

// ⭐ 2. 用户交互兜底（滑动 / 点屏）
document.addEventListener("touchstart", tryPlayVideo, { once: true });
document.addEventListener("scroll", tryPlayVideo, { once: true });
</script>
