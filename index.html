<!DOCTYPE html>
<html>

<head>
  <title>Captain Ariel</title>

  <!-- ⭐关键：移动端必须 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    .hero {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .title {
      position: absolute;
      top: 80px;
      right: 120px;
      text-align: right;
      font-family: 'Playfair Display', serif;
      letter-spacing: 6px;
      animation: fadeIn 2s ease;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .title p {
      margin: 6px 0 0 0;
      font-size: 14px;
      letter-spacing: 3px;
      opacity: 0.7;
    }

    .nav {
      position: absolute;
      top: 220px;
      right: 120px;
      text-align: right;
      font-size: 14px;
      letter-spacing: 2px;
      line-height: 1.8;
    }

    .nav a {
      color: white;
      text-decoration: none;
      display: block;
      transition: 0.3s;
    }

    .nav a:hover {
      opacity: 0.5;
    }

    .logo {
      margin-top: 20px;
    }

    .logo img {
      width: 42px;
      opacity: 0.75;
      transition: 0.3s;
    }

    .logo img:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 📱 移动端 */
    @media (max-width: 768px) {

      .hero {
        flex-direction: column;
        justify-content: flex-start;
        height: auto;
        padding-top: 40px;
      }

      video {
        width: 100%;
        max-height: 50vh;
      }

      .title {
        position: static;
        text-align: center;
        margin-bottom: 20px;
      }

      .title h1 { font-size: 22px; }
      .title p { font-size: 12px; }

      .nav {
        position: static;
        text-align: center;
        margin-top: 10px;
      }

      .nav a {
        display: inline-block;
        margin: 6px 10px;
      }

      .logo {
        margin-top: 15px;
      }
    }

  </style>
</head>

<body>

  <div class="hero">

    <!-- ⭐ 改良视频写法 -->
    <video autoplay muted loop playsinline webkit-playsinline preload="auto">
      <source src="2.mp4" media="(max-width: 768px)">
      <source src="1.mp4" type="video/mp4">
    </video>

    <div class="title">
      <h1>Ariel RothbART</h1>
      <p>Illustration</p>
    </div>

    <div class="nav">
      <a href="#">About</a>
     <a href="commission.html">Commission</a>
      <a href="#">Character</a>
      <a href="#">Story</a>
      <a href="#">Comics</a>

      <div class="logo">
        <a href="index.html">
          <img src="logo.png">
        </a>
      </div>
    </div>

  </div>

</body>

</html>
