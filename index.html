<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Captain Ariel ✦ Rhapsody</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  
  <meta property="og:title" content="Captain Ariel | Visual Narratives">
  <meta property="og:description" content="Art, design and fragments of a drifting world">
  <meta property="og:image" content="https://captainariel.art/preview.jpg">
  <meta property="og:url" content="https://captainariel.art">
  <meta property="og:type" content="website">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'VladBold';
      src: url('./fonts/Vladivostok-Bold.woff2') format('woff2'),
           url('./fonts/Vladivostok-Bold.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    a {
      text-decoration: none;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========================= */
    /* ⭐ HERO（完全不动） */
    /* ========================= */

    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 120px;

      background: linear-gradient(
        to bottom,
        rgba(0,200,255,0),
        rgba(0,200,255,1),
        rgba(0,200,255,0)
      );

      box-shadow: 0 0 18px rgba(0,200,255,1);

      animation: beamFlow 2.5s infinite;
      pointer-events: none;
    }

    @keyframes beamFlow {
      0% { opacity: 0; transform: translate(-50%, -10px); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, 20px); }
    }

    .title {
      position: absolute;
      top: 80px;
      right: 120px;
      text-align: right;
      font-family: 'Poiret One', sans-serif;
      font-weight: 400;
      letter-spacing: 6px;

      opacity: 0;
      transform: translateY(-40px);

      animation: fadeIn 2.5s ease forwards;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .title p {
      margin-top: 6px;
      opacity: 0.7;
      letter-spacing: 3px;
    }

    .nav {
      position: absolute;
      top: 200px;          
      right: 140px;        

      text-align: right;
      font-size: 18px;     
      letter-spacing: 3px; 
      line-height: 1.8;    
      
      font-family: 'Playfair Display', serif;
      text-shadow: 0 0 6px rgba(255,255,255,0.15);
    }

    @keyframes softBoot {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .nav a {
      display: block;
      opacity: 0.25;

      margin: 6px 0;
      transition: 0.3s;

      text-shadow: 0 0 4px rgba(0,0,0,0.6);  
    }

    .nav a:nth-child(1) { animation: softBoot 1.2s forwards 0.6s; }
    .nav a:nth-child(2) { animation: softBoot 1.2s forwards 0.2s; }
    .nav a:nth-child(3) { animation: softBoot 1.2s forwards 1.0s; }
    .nav a:nth-child(4) { animation: softBoot 1.2s forwards 0.4s; }
    .nav a:nth-child(5) { animation: softBoot 1.2s forwards 1.2s; }
    .nav a:nth-child(6) { animation: softBoot 1.2s forwards 0.8s; }

    .nav a:hover {
      opacity: 1;
      letter-spacing: 5px;   
      transform: translateX(-4px); 
    }

    .logo {
      margin-top: 20px;
    }

    .logo img {
      width: 60px;       
      opacity: 0.8;
      transition: 0.3s;
    }

    .logo img:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================= */
    /* ⭐ 主光流 */
    /* ========================= */
    .beam {
      width: 2px;
      height: 180px; 

      margin: -60px auto 0; 

      background: linear-gradient(
        to bottom,
        rgba(0,200,255,0),
        rgba(0,200,255,1),
        rgba(0,200,255,0)
      );

      box-shadow: 0 0 16px rgba(0,200,255,1);

      animation: flow 2.5s infinite;
    }
    .beam::before {
      content: "";
      position: relative; 
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00c8ff;
      box-shadow: 0 0 12px #00c8ff;
    }
    .energy-dot {
      position: absolute;
      bottom: 00px;     
      left: 50%;
      transform: translateX(-50%);

      width: 8px;
      height: 8px;
      border-radius: 50%;

      background: #00c8ff;

      box-shadow:
        0 0 6px #00c8ff,
        0 0 14px #00c8ff,
        0 0 28px rgba(0,200,255,0.8);

      animation: dotPulse 2.5s infinite ease-in-out;
    }

    @keyframes dotPulse {
      0%   { opacity: 0.3; transform: translateX(-50%) scale(0.8); }
      50%  { opacity: 1;   transform: translateX(-50%) scale(1.2); }
      100% { opacity: 0.3; transform: translateX(-50%) scale(0.8); }
    }
    /* ========================= */
    /* ⭐ PROJECT */
    /* ========================= */

    .projects {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin: 40px 0 120px;
    }

    .project-card {
      width: 260px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .project-card img {
      width: 100%;
      transition: 0.5s ease;
    }

    .project-card:hover img {
      transform: scale(1.08);
      filter: brightness(1.1) contrast(1.1);
    }

    .project-title {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-family: 'Playfair Display', serif;
      letter-spacing: 2px;
      opacity: 0;
      transition: 0.3s;
    }

    .project-card:hover .project-title {
      opacity: 1;
    }

    .projects:hover .beam {
      box-shadow: 0 0 22px #00c8ff;
    }
    .lounge-entry{
      width:220px;
      height:90px;

      margin:35px auto 120px;  
      position:relative;
      cursor:pointer;
    }
    .lounge-wrapper{
      display:flex;
      justify-content:center;
    }
    /* 两层 */
    .chip{
      top:45px;  
      position:absolute;
      width:100%;
      padding:12px 0;

      text-align:center;
      font-size:13px;
      letter-spacing:2px;

      border:1px solid rgba(255,255,255,0.2);
      background:rgba(255,255,255,0.02);

      transition:0.3s ease;
    }

    /* 上层 */
    .chip.top {
      top:0;
      left:0;
      z-index:2;
    }

    /* 下层 */
    .chip.bottom{
      top:6px;
      left:6px;
      opacity:0.4;
    }

    /* hover 错位 */
    .lounge-entry:hover .top{
      transform:translate(4px,4px);
    }

    .lounge-entry:hover .bottom{
      transform:translate(-4px,-4px);
      opacity:0.8;
    }

    /* hover 发光 */
    .lounge-entry:hover .chip{
      border-color:#00c8ff;
      box-shadow:0 0 10px rgba(0,200,255,0.6);
    }
    /* 点击瞬间：整体轻微按下 */
    .lounge-entry{
      transition: transform 0.15s ease;
    }
    /* 点击时：发光更强 */
    .lounge-entry:active .chip{
      border-color:#00c8ff;
      box-shadow:
        0 0 8px rgba(0,200,255,0.8),
        0 0 20px rgba(0,200,255,0.6);
    }
    .lounge-entry:active{
      transform: scale(0.97);
    }
    /* 咖啡：轮廓发光（不是方块） */
    .lounge-entry:hover .coffee-icon img{
      filter: drop-shadow(0 0 6px rgba(0,200,255,0.6));
    }

    .lounge-entry:active .coffee-icon img{
      filter: drop-shadow(0 0 10px rgba(0,200,255,0.9));
    }
    
    @media (max-width: 768px) {

      .hero {
          height: auto;
        }

        video {
          height: auto;
        }

        .title {
          position: static;
          text-align: center;
          margin-top: 20px;
        }

        .nav {
          position: static;
          text-align: center;
          margin-top: 20px;
        }

        .nav a {
          display: inline-block;
          margin: 8px;
        }

        .projects {
          flex-direction: column;
          align-items: center;
          gap: 40px;
        }

        .project-card {
          width: 70%;
        }

        .project-title {
          opacity: 1;
        }
      .lounge-entry:hover .coffee-icon{
        opacity:1;
        transform:translateX(-50%) scale(1.05);
      }
    }
    /* 整体位置 */
    .coffee-icon{
      position:absolute;
      left:50%;
      transform:translateX(-50%);

      top:-60px;   

      width:60px;
      height:60px;

      opacity:0.6;
      pointer-events:none;
    }
    .coffee-icon img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    /* hover 联动 */
    .lounge-entry:hover .coffee-icon{
      opacity:1;
    }

    /* 极简指引样式 */
    .simple-guide {
      display: flex;
      flex-direction: column; 
      align-items: center;
      justify-content: center;
      gap: 15px;
      pointer-events: none;
    }

    .simple-guide span {
      font-family: 'Poiret One', sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: #00c8ff;
      opacity: 0.5;
      white-space: nowrap;
      writing-mode: vertical-lr; 
    }

    .guide-line {
      width: 1px;
      height: 80px;
      background: linear-gradient(to bottom, transparent, #00c8ff, transparent);
      box-shadow: 0 0 8px rgba(0,200,255,0.5);
    }

    /* P5P 特殊入口样式 */
    .p5p-entry {
        filter: grayscale(0.8) contrast(1.2); 
        transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1);
    }

    .p5p-entry:hover {
        filter: grayscale(0) brightness(1.1); 
    }

    .p5p-entry::before {
        content: "COOPERATIVE WORK";
        position: absolute;
        top: -20px;
        left: 0;
        font-size: 10px;
        letter-spacing: 2px;
        color: #ff4444; 
        opacity: 0;
        transition: 0.5s;
    }

    .p5p-entry:hover::before {
        opacity: 0.7;
        transform: translateY(10px);
    }

    /* 手机端适配：海报变上下排时，指引也变横向 */
    @media (max-width: 768px) {
      .simple-guide {
        flex-direction: row;
        width: 100%;
        margin: 20px 0;
      }
      .simple-guide span {
        writing-mode: horizontal-tb;
      }
      .guide-line {
        width: 50px;
        height: 1px;
        background: linear-gradient(to right, transparent, #00c8ff, transparent);
      }
    }

    /* ========================================================
       ⭐ 新增：Personnel Files 专属悬停左侧双行副注文案
       ======================================================== */
    .nav a[href="pfile.html"] {
        position: relative; /* 为伪元素提供定位基准，不改变物理大小 */
    }

    .nav a[href="pfile.html"]::before {
        content: "Characters\A Worldbuilding"; /* \A 是 CSS 中的换行符 */
        position: absolute;
        right: calc(100% + 18px); /* 精确落在 Personnel Files 文字左侧并留出空隙 */
        top: 50%;
        transform: translateY(-50%); /* 确保纵向绝对居中 */
        
        /* 辅助小字样式设计 */
        font-family: 'Inter', sans-serif; /* 使用更小巧方正的现代无衬线体做细节支撑 */
        font-size: 10px;
        line-height: 1.3;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.35); /* 偏暗、退居次要层级的冷白调 */
        text-align: right;
        white-space: pre; /* 关键：告知浏览器识别 \A 符号进行换行 */
        
        /* 动态控制 */
        opacity: 0;
        transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        pointer-events: none; /* 鼠标穿透，防止干扰正常的点击区域 */
    }

    /* 鼠标移入整个链接时，小字亮起 */
    .nav a[href="pfile.html"]:hover::before {
        opacity: 1;
    }

    /* 响应式保护：当手机端导航栏变为横向 Inline 块时，强行关闭此特效，防止排版挤压崩溃 */
    @media (max-width: 768px) {
        .nav a[href="pfile.html"]::before {
            display: none !important;
        }
    }
  </style>
</head>

<body>

<div class="hero">
<div class="energy-dot"></div>
<video autoplay muted loop playsinline preload="auto" webkit-playsinline id="heroVideo">
  <source src="images/index/2.mp4" media="(max-width: 768px)" type="video/mp4">
  <source src="images/index/1.webm" media="(min-width: 769px)" type="video/webm">
  <source src="images/index/1.mp4" media="(min-width: 769px)" type="video/mp4">
</video>

  <div class="title">
    <h1>Ariel RothbART</h1>
    <p>Illustration</p>
  </div>

  <div class="nav">
    <a href="about.html">About</a>
    <a href="commission.html">Commission</a>
    <a href="pfile.html">Personnel Files</a>
    <a href="illustration.html">Illustration</a>
    <a href="comics.html">Comics</a>
    <a href="log.html">Log</a>

    <div class="logo">
      <a href="index.html">
        <img src="logo.png">
      </a>
    </div>
  </div>

</div>

<div class="projects">
 <a href="transmission.html" class="project-card">
  <img src="images/index/poster1.jpg">
  <div class="project-title">Rhapsody in Neon</div>
  </a>

  <div class="simple-guide">
    <div class="guide-line"></div>
    <span>SELECT A REALITY</span>
    <div class="guide-line"></div>
  </div>

  <a href="sym-noir.html" class="project-card">
    <img src="images/index/poster2.jpg">
    <div class="project-title">Symphony Noir</div>
  </a>
</div>

<div class="lounge-wrapper">
 <a href="lounge.html" class="lounge-entry">
  <div class="coffee-icon">
    <img src="images/index/coffee_icon.png" alt="coffee">
  </div>
  <div class="chip top">CREW LOUNGE</div>
  <div class="chip bottom">CREW LOUNGE</div>
</a>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin: -30px 0 40px;">
  <div style="width: 100px; height: 1px; background: linear-gradient(to right, transparent, #00c8ff); opacity: 0.4;"></div>
  <span style="font-family: 'Poiret One', sans-serif; font-size: 11px; letter-spacing: 5px; color: #00c8ff; opacity: 0.6; white-space: nowrap;">ARCHIVE</span>
  <div style="width: 100px; height: 1px; background: linear-gradient(to left, transparent, #00c8ff); opacity: 0.4;"></div>
</div>

<div class="projects" style="margin-top: -20px; padding-bottom: 120px; justify-content: center;">
  <a href="p5p.html" class="project-card">
 <img src="images/index/p5p.gif" alt="Persona 5 Personal">
    <div class="project-title" style="display:block; opacity: 0.8; font-size: 12px; letter-spacing: 3px;">
        Persona 5 Personal
    </div>
  </a>
</div>

<script>
const video = document.getElementById("heroVideo");

function tryPlayVideo() {
  if (video) {
    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        console.log("Autoplay blocked, waiting for interaction");
      });
    }
  }
}

document.addEventListener("DOMContentLoaded", tryPlayVideo);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    tryPlayVideo();
  }
});
document.addEventListener("touchstart", tryPlayVideo, { once: true });
document.addEventListener("scroll", tryPlayVideo, { once: true });
</script>
</body>
</html>
