<!DOCTYPE html>
<html>

<head>
  <title>Captain Ariel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    .hero {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .title {
      position: absolute;
      top: 80px;
      right: 120px;
      text-align: right;
      font-family: 'Playfair Display', serif;
      letter-spacing: 6px;
      animation: fadeIn 2s ease;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .title p {
      margin: 6px 0 0 0;
      font-size: 14px;
      letter-spacing: 3px;
      opacity: 0.7;
    }

    .nav {
      position: absolute;
      top: 220px;
      right: 120px;
      text-align: right;
      font-size: 14px;
      letter-spacing: 2px;
      line-height: 1.8;
    }

    /* ⭐导航初始 */
    .nav a {
      color: white;
      text-decoration: none;
      display: block;
      opacity: 0.2;
      letter-spacing: 2px;
      transition: 0.3s;
    }

    /* ⭐优化后的动画（更快一点） */
    @keyframes softBoot {
      0%   { opacity: 0.2; }
      20%  { opacity: 0.4; }
      40%  { opacity: 0.3; }
      60%  { opacity: 0.7; }
      80%  { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* ⭐顺序 + 更快节奏 */
    .nav a:nth-child(1) { animation: softBoot 1.2s ease forwards; animation-delay: 0.2s; }
    .nav a:nth-child(2) { animation: softBoot 1.2s ease forwards; animation-delay: 0.4s; }
    .nav a:nth-child(3) { animation: softBoot 1.2s ease forwards; animation-delay: 0.6s; }
    .nav a:nth-child(4) { animation: softBoot 1.2s ease forwards; animation-delay: 0.8s; }
    .nav a:nth-child(5) { animation: softBoot 1.2s ease forwards; animation-delay: 1.0s; }
    .nav a:nth-child(6) { animation: softBoot 1.2s ease forwards; animation-delay: 1.2s; }

    .nav a:hover {
      opacity: 1;
      letter-spacing: 4px;
    }

    .logo {
      margin-top: 20px;
    }

    .logo img {
      width: 42px;
      opacity: 0.75;
      transition: 0.3s;
    }

    .logo img:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 📱 手机 */
    @media (max-width: 768px) {

      .hero {
        flex-direction: column;
        justify-content: flex-start;
        height: auto;
        padding-top: 40px;
      }

      video {
        width: 100%;
        max-height: 50vh;
      }

      .title {
        position: static;
        text-align: center;
        margin-bottom: 20px;
      }

      .title h1 { font-size: 22px; }
      .title p { font-size: 12px; }

      .nav {
        position: static;
        text-align: center;
        margin-top: 10px;
      }

      .nav a {
        display: inline-block;
        margin: 6px 10px;
      }

      .logo {
        margin-top: 15px;
      }
    }

  </style>
</head>

<body>

  <div class="hero">

    <video autoplay muted loop playsinline webkit-playsinline preload="auto">
      <source src="2.mp4" media="(max-width: 768px)">
      <source src="1.mp4" type="video/mp4">
    </video>

    <div class="title">
      <h1>Ariel RothbART</h1>
      <p>Illustration</p>
    </div>

    <!-- ⭐顺序已按你要求 -->
    <div class="nav">
      <a href="#">About</a>
      <a href="commission.html">Commission</a>
      <a href="#">Character</a>
      <a href="#">Comics</a>
      <a href="#">Story</a>
      <a href="#">Log</a>

      <div class="logo">
        <a href="index.html">
          <img src="logo.png">
        </a>
      </div>
    </div>

  </div>

</body>

</html>
