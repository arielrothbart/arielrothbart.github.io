<!DOCTYPE html>
<html>

<head>
  <title>Captain Ariel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter:wght@300&display=swap" rel="stylesheet">

  <style>

    a {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    /* ⭐ 标题 */
    .title {
      position: absolute;
      top: 80px;
      right: 120px;
      text-align: right;
      font-family: 'Playfair Display', serif;
      letter-spacing: 6px;
      z-index: 2;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .title p {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.7;
    }

    /* ⭐ 导航 */
    .nav {
      position: absolute;
      top: 220px;
      right: 120px;
      text-align: right;
      font-size: 14px;
      letter-spacing: 2px;
      z-index: 2;
    }

    .nav a {
      color: white;
      text-decoration: none;
      display: block;
      opacity: 0.4;
      transition: 0.3s;
    }

    .nav a:hover {
      opacity: 1;
      letter-spacing: 4px;
    }

    /* ⭐ 动画 */
    @keyframes softBoot {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .nav a:nth-child(1) { animation: softBoot 1s forwards 0.2s; }
    .nav a:nth-child(2) { animation: softBoot 1s forwards 0.4s; }
    .nav a:nth-child(3) { animation: softBoot 1s forwards 0.6s; }
    .nav a:nth-child(4) { animation: softBoot 1s forwards 0.8s; }
    .nav a:nth-child(5) { animation: softBoot 1s forwards 1s; }
    .nav a:nth-child(6) { animation: softBoot 1s forwards 1.2s; }

    .logo {
      margin-top: 20px;
    }

    .logo img {
      width: 42px;
      opacity: 0.7;
    }

    /* ========================= */
    /* 📱 手机端重做布局（重点） */
    /* ========================= */

    @media (max-width: 768px) {

      video {
        width: 100vw;
        height: 100vh;
        object-fit: cover;

        /* ⭐ 控制构图 */
        object-position: center 25%;
      }

      /* ⭐ 标题放中间 */
      .title {
        top: auto;
        bottom: 220px;
        right: 0;
        width: 100%;
        text-align: center;
      }

      .title h1 {
        font-size: 24px;
      }

      /* ⭐ 导航放下方（关键） */
      .nav {
        top: auto;
        bottom: 120px;
        right: 0;
        width: 100%;
        text-align: center;
      }

      .nav a {
        display: inline-block;
        margin: 6px 10px;
        font-size: 13px;
      }

      /* ⭐ logo */
      .logo {
        margin-top: 20px;
      }

      .logo img {
        width: 36px;
      }
    }

  </style>
</head>

<body>

<div class="hero">

  <video autoplay muted loop playsinline>
    <source src="2.mp4" media="(max-width: 768px)">
    <source src="1.mp4" type="video/mp4">
  </video>

  <div class="title">
    <h1>Ariel RothbART</h1>
    <p>Illustration</p>
  </div>

  <div class="nav">
    <a href="about.html">About</a>
    <a href="commission.html">Commission</a>
    <a href="#">Character</a>
    <a href="#">Comics</a>
    <a href="#">Story</a>
    <a href="#">Log</a>

    <div class="logo">
      <a href="index.html">
        <img src="logo.png">
      </a>
    </div>
  </div>

</div>

</body>
</html>
