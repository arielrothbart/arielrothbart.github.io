<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valley of Gloom</title>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial, sans-serif;
}

/* ===== HOME LOGO ===== */
.home-logo {
  position: fixed;
  top: 80px;
  right: 60px;
  z-index: 1000;
}

.home-logo img {
  width: 80px;
  opacity: 0.8;
  transition: 0.3s;
}

.home-logo img:hover {
  opacity: 1;
  transform: scale(1.08);
}
/* ===== TITLE ===== */
.header{
  text-align:center;
  margin-top:80px;
}

.title{
  font-family: 'Amatic SC', cursive;
  font-size:72px;
  letter-spacing:4px;
  opacity:0.9;
}

.subtitle{
  font-family: 'Amatic SC', cursive;
  font-size:18px;
  opacity:0.6;
  line-height:1.6;
}


/* ===== VIEWER ===== */
.viewer{
  margin-top:60px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* 图片 */
.viewer img{
  max-width:500px;
  max-height:80vh;
}

/* 翻页按钮（大） */
.nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:60px;
  color:white;
  background:none;
  border:none;
  cursor:pointer;
  opacity:0.25;
  transition:0.2s;
}

.prev{
  left:80px;
}

.next{
  right:80px;
}

/* ===== ABOUT ===== */
.info{
  margin-top:60px;
  text-align:center;
}

.about-label{
  color:#b33;
  font-size:12px;
  letter-spacing:2px;
  margin-right:20px;
}

.about-text{
  display:inline-block;
  font-size:13px;
  opacity:0.7;
  max-width:600px;
}

/* ===== DIVIDER ===== */
.divider{
  width:80%;
  height:1px;
  background:#333;
  margin:80px auto 40px;
}

/* ===== NAV PROJECT ===== */
.project-nav{
  display:flex;
  justify-content:space-between;
  width:80%;
  margin:0 auto 80px;
  font-size:18px;
}

.project-nav a{
  color:white;
  text-decoration:none;
  opacity:0.6;
  transition:0.2s;
}

.project-nav a:hover{
  opacity:1;
}
.nav:hover{
  opacity:0.8;
  transform:translateY(-50%) scale(1.2);
}
  .nav:active{
  transform:translateY(-50%) scale(0.95);
}
.small{
  font-size:10px;
  opacity:0.4;
  display:block;
  margin-bottom:6px;
}
  .zoom-viewer{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);

  display:none;
  justify-content:center;
  align-items:center;

  z-index:2000;
}

.zoom-viewer img{
  max-width:90%;
  max-height:90%;
  cursor:zoom-out;
}
  img{
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:auto;
}
</style>

</head>

<body>

<!-- HOME -->
<a href="index.html" class="home-logo">
  <img src="logo.png">
</a>

<!-- HEADER -->
<div class="header">
  <div class="title">VALLEY OF GLOOM</div>
  <div class="subtitle">
    Original comic story (adaptation of Sherlock Holmes series)<br>
    Cthulhu style based on Colonel Moran's perspective.
  </div>
</div>

<!-- VIEWER -->
<div class="viewer">

  <button class="nav prev" onclick="prevPage()">‹</button>

 <img id="page" src="images/comics/comic-01/page1.jpg">

  <button class="nav next" onclick="nextPage()">›</button>

</div>

<!-- ABOUT -->
<div class="info">
  <span class="about-label">ABOUT</span>
  <span class="about-text">
    Colonel Moran entering the wine cellar. He is about to talk to the head of the gangster — Lord McGinty.
  </span>
</div>

<!-- DIVIDER -->
<div class="divider"></div>

<!-- PROJECT NAV -->
<div class="project-nav">

  <a href="comics.html">
    <span class="small">BACK TO SHELF</span>
    ‹ Comics
  </a>

  <a href="comic-02.html">
    <span class="small">NEXT PROJECT</span>
    Rhapsody in Neon ›
  </a>

</div>

<script>
let currentPage = 1;
const totalPages = 7; // 页数改这里
let isZoomed = false;
  
function updatePage(direction = "next"){
  const img = document.getElementById("page");

  const offset = 120;

  /* 第一段：滑出 */
  img.style.transition = "transform 0.3s ease, opacity 0.3s ease";
  img.style.transform =
    direction === "next"
      ? `translateX(-${offset}px)`
      : `translateX(${offset}px)`;
  img.style.opacity = 0;

  setTimeout(() => {

    /* 换图 */
    img.src = "images/comics/comic-01/page" + currentPage + ".jpg";

    /* 瞬间跳到另一边 */
    img.style.transition = "none";
    img.style.transform =
      direction === "next"
        ? `translateX(${offset}px)`
        : `translateX(-${offset}px)`;

    img.offsetHeight; // 强制刷新

    /* 第二段：滑入 */
    img.style.transition = "transform 0.4s cubic-bezier(0.22,1,0.36,1), opacity 0.4s ease";
    img.style.transform = "translateX(0)";
    img.style.opacity = 1;

  }, 200);
}

function nextPage(){
  if(currentPage < totalPages){
    currentPage++;
    updatePage("next");
  }
}

function prevPage(){
  if(currentPage > 1){
    currentPage--;
    updatePage("prev");
  }
}
  document.addEventListener("contextmenu", e => e.preventDefault());
</script>
 
<div class="zoom-viewer" id="zoomViewer">
  <img id="zoomImg">
</div>
   <script>
const zoomViewer = document.getElementById("zoomViewer");
const zoomImg = document.getElementById("zoomImg");
const pageImg = document.getElementById("page");

  document.addEventListener("keydown", e => {
  if (isZoomed) return;

  if (e.key === "ArrowRight") nextPage();
  if (e.key === "ArrowLeft") prevPage();
});
     
/* 点击放大 */
pageImg.onclick = () => {
  zoomViewer.style.display = "flex";
  zoomImg.src = pageImg.src;
  isZoomed = true;
};
     
/* 点击关闭 */
zoomViewer.onclick = () => {
  zoomViewer.style.display = "none";
  isZoomed = false;
};
</script>
</body>
</html>
