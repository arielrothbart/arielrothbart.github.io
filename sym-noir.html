<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
  overflow:hidden;
}

/* ===== sidebar ===== */
.sidebar{
  position:fixed;
  width:220px;
  height:100vh;
  background:#0a0a0a;
  padding:30px;
  z-index:10;
}

.logo{
  width:80px;
  cursor:pointer;
}

.title{
  font-size:24px;
  margin:20px 0;
  cursor:pointer;
}

.nav-item{
  margin:10px 0;
  color:#666;
  cursor:pointer;
}

.nav-item.active{
  color:white;
}

/* ===== main ===== */
.main{
  margin-left:220px;
  height:100vh;
  position:relative;
}

/* ===== title ===== */
.title-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.title-screen img{
  width:760px;
  opacity:0;
  animation:fadeIn 2s forwards;
}

@keyframes fadeIn{
  to{opacity:1;}
}

.fade-out{
  animation:ghostOut 1.2s forwards;
}

@keyframes ghostOut{
  to{
    opacity:0;
    transform:translateY(-60px);
    filter:blur(6px);
  }
}

/* ===== ⭐ story ===== */
.story-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  padding:80px;
}

.story-text{
  max-width:720px;
  line-height:1.9;
  font-size:14px;
  color:#ddd;
  transition:0.4s;
}

/* ===== characters ===== */
.character-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  gap:120px;
}

.char img{
  width:150px;
  border-radius:50%;
}

.fade-char{
  animation:ghostOut 1s forwards;
}

/* ===== ENTER ===== */
.enter-btn{
  font-size:12px;
  cursor:pointer;
  opacity:0.7;
  letter-spacing:2px;
  transition:0.3s;
}

.enter-btn:hover{
  opacity:1;
  letter-spacing:6px;
  transform:scale(1.1);
}

.enter-btn.active{
  letter-spacing:18px;
  opacity:0;
  transform:scale(1.3);
  transition:0.5s;
}

/* ===== network ===== */
.network-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  overflow:hidden;
}

.viewer{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:grab;
  position:relative;
}

.viewer img{
  max-width:90%;
  max-height:90%;
  user-select:none;
}

/* ===== hint ===== */
.hint{
  position:absolute;
  right:30px;
  bottom:25px;
  font-size:11px;
  color:rgba(255,255,255,0.4);
  pointer-events:none;
  animation:fadeHint 3s infinite;
}

@keyframes fadeHint{
  0%,100%{opacity:0.3;}
  50%{opacity:0.8;}
}

/* ===== mobile nav ===== */
.mobile-nav{
  display:none;
}

.mobile-logo{
  display:none;
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  width:60px;
  z-index:50;
}

@media (max-width:768px){

  body{
    overflow:auto !important;
  }

  .sidebar{
    display:none !important;
  }

  .main{
    margin-left:0 !important;
  }

  .mobile-logo{
    display:block;
  }

  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:0;
    width:100%;
    height:60px;
    background:#0a0a0a;
    justify-content:space-around;
    align-items:center;
    font-size:12px;
    z-index:100;
  }

  .mobile-nav div{
    color:#888;
  }

  .mobile-nav div:active{
    color:white;
  }

}

</style>
</head>

<body oncontextmenu="return false">

<img src="logo.png" class="mobile-logo" onclick="goHome()">

<div class="mobile-nav">
  <div onclick="showTitle()">Title</div>
  <div onclick="navChar.onclick()">Chars</div>
  <div onclick="navNet.onclick()">Net</div>
</div>

<div class="sidebar">
  <img src="logo.png" class="logo" onclick="goHome()">
  <div class="title" onclick="showTitle()">Symphony Noir</div>

  <div class="nav-item active" id="nav-title">Title</div>
  <div class="nav-item" id="nav-char">Characters</div>
  <div class="nav-item" id="nav-net">Network</div>
  <div class="nav-item" onclick="goTimeline()">Timeline</div>
</div>

<div class="main">

<div class="title-screen" id="title">
  <img src="images/title.png">
</div>

<!-- ⭐ story -->
<div class="story-screen" id="story">
  <div class="story-text" id="storyText"></div>
</div>

<div class="character-screen" id="chars">
  <div class="char" id="yagami"><img src="images/yagami.png"></div>
  <div class="enter-btn" id="enterBtn">ENTER</div>
  <div class="char" id="shin"><img src="images/shin.png"></div>
</div>

<div class="network-screen" id="network">
  <div class="viewer" id="viewer">
    <img src="images/network.png" id="netImg">
  </div>

  <div class="hint">
    Scroll to zoom · 拖动滚轮放大
  </div>
</div>

</div>

<script>

function goTimeline(){
  window.location.href = "timeline.html";
}

/* ===== elements ===== */
const title = document.getElementById("title");
const story = document.getElementById("story");
const storyText = document.getElementById("storyText");
const chars = document.getElementById("chars");
const network = document.getElementById("network");

const yagami = document.getElementById("yagami");
const shin = document.getElementById("shin");

const navTitle = document.getElementById("nav-title");
const navChar = document.getElementById("nav-char");
const navNet = document.getElementById("nav-net");

const viewer = document.getElementById("viewer");
const img = document.getElementById("netImg");
const enterBtn = document.getElementById("enterBtn");

/* ===== nav ===== */
function setNav(t,c,n){
  navTitle.classList.toggle("active",t);
  navChar.classList.toggle("active",c);
  navNet.classList.toggle("active",n);
}

function goHome(){window.location.href="index.html";}

function resetCharacters(){
  yagami.classList.remove("fade-char");
  shin.classList.remove("fade-char");
  enterBtn.classList.remove("active");
}

/* ⭐ 文本 */
const cnText = `
<h2>Symphony Noir</h2>
黑色交响建立在两段半架空的历史之上。

1980年代至千禧年前后的美国佛蒙特州。  
八神重英与 菅原真，作为第二代日本移民，在这片寂静而寒冷的土地上生活。  

从小能够感知到鬼魂的菅原真在大学里教授神秘学，警官八神的身上则有一个古老又性格乖张的幽灵。
他们组成了为他人排忧解难的驱魔搭档，在一次次案件中化险为夷。
两人也逐渐发现，附身于八神身上的“恶灵”安东尼奥生前并不简单。


更早的年代。  
西班牙王朝正值鼎盛时。  

国王奥斯瓦尔多和其胞弟安东尼奥关系亲密。
二人在政治与战争上强强联手，堪称一代枭雄。 
但二人都在感情上却是难言的弱者。

他们的王朝究竟为何在一夜之间覆灭？
又是怎样强烈的感情，让安东尼奥愤怒至极，
即便在死后也不愿离去，甘愿成为飘荡于世间500年的幽灵？

菅原真和八神就深入马德里，只为探寻身上恶灵的故事。

`;

const enText = `
<h2>Symphony Noir</h2>
A story buried beneath fractured history.  
Time slips. Memory decays. Some things refuse to leave.

Vermont, United States. Late 20th century.  
Yagami Shigefua and Sugahara Shin, second-generation immigrants, live between the ordinary and the unseen.

Shin has perceived spirits since childhood, eventually turning to the study of the occult.  
Yagami, now a police officer, carries within him something ancient. Something unwilling.

They begin to take cases others cannot explain.  
Each incident points toward the same name.

Antonio.

Centuries earlier.  
At the height of a Spanish dynasty.

King Osvaldo and his brother Antonio stand side by side.  
They rule. They conquer. They shape an era.

And beneath it all, something unspoken takes root.  
The dynasty collapses in a single night.

Antonio dies.  
But never leaves.

Five hundred years later, the echo remains.

So they go to Madrid.
`;

storyText.innerHTML = cnText;

storyText.onmouseenter = ()=>{
  storyText.innerHTML = enText;
};

storyText.onmouseleave = ()=>{
  storyText.innerHTML = cnText;
};

/* ===== navigation ===== */
function showTitle(){
  resetCharacters();

  title.classList.remove("fade-out");
  title.style.display="flex";

  story.style.display="none";
  chars.style.display="none";
  network.style.display="none";

  setNav(true,false,false);
}

navTitle.onclick = showTitle;

navChar.onclick = ()=>{
  resetCharacters();
  title.style.display="none";
  story.style.display="none";
  chars.style.display="flex";
  network.style.display="none";
  setNav(false,true,false);
};

navNet.onclick = ()=>{
  title.style.display="none";
  story.style.display="none";
  chars.style.display="none";
  network.style.display="block";
  setNav(false,false,true);
};

/* ===== flow ===== */
title.onclick = ()=>{
  title.classList.add("fade-out");

  setTimeout(()=>{
    title.style.display="none";
    story.style.display="flex";
    setNav(false,false,false);
  },1000);
};

enterBtn.onclick = ()=>{

  enterBtn.classList.add("active");

  yagami.classList.add("fade-char");
  shin.classList.add("fade-char");

  setTimeout(()=>{
    chars.style.display="none";
    network.style.display="block";
    setNav(false,false,true);
  },700);
};

/* ===== zoom + drag ===== */
if(window.innerWidth > 768){

  let scale = 1;
  let x = 0, y = 0;
  let dragging = false;

  viewer.addEventListener("wheel", e=>{
    e.preventDefault();
    scale += e.deltaY * -0.001;
    scale = Math.min(Math.max(0.5,scale),3);

    img.style.transform =
      `translate(${x}px,${y}px) scale(${scale})`;
  });

  viewer.addEventListener("mousedown", ()=>dragging=true);
  window.addEventListener("mouseup", ()=>dragging=false);

  window.addEventListener("mousemove", e=>{
    if(!dragging) return;

    x += e.movementX;
    y += e.movementY;

    img.style.transform =
      `translate(${x}px,${y}px) scale(${scale})`;
  });

  viewer.addEventListener("click", (e)=>{
    if(e.target.id === "viewer"){
      scale = 1;
      x = 0;
      y = 0;
      img.style.transform = "translate(0,0) scale(1)";
    }
  });

}

</script>

</body>
</html>
