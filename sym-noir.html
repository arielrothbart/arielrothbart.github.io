<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
  overflow:hidden;
}

/* ===== 左侧 ===== */
.sidebar{
  position:fixed;
  width:220px;
  height:100vh;
  background:rgba(10,10,10,0.95);
  padding:30px;
}

.logo{
  width:90px;
  cursor:pointer;
  opacity:0.8;
  transition:0.3s;
}
.logo:hover{
  opacity:1;
  transform:scale(1.05);
}

.title{
  font-size:20px;
  margin:20px 0;
  cursor:pointer;
}

.nav-item{
  margin:12px 0;
  color:#555;
  cursor:pointer;
}

.nav-item.active{
  color:white;
}

/* ===== 主区域 ===== */
.main{
  margin-left:220px;
  height:100vh;
  position:relative;
}

/* ===== 标题 ===== */
.title-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

.title-screen img{
  width:750px;
  opacity:0;
  transform:translateY(-40px);
  animation:titleIn 2.5s forwards;
}

@keyframes titleIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.fade-out{
  animation:titleOut 1.5s forwards;
}

@keyframes titleOut{
  to{
    opacity:0;
    filter:blur(6px);
    transform:translateY(60px);
  }
}

/* ===== 主角 ===== */
.character-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  gap:140px;
}

.char{
  transition:1s;
}

.char img{
  width:160px;
  border-radius:50%;
}

/* 消散 */
.fade-char{
  animation:fadeChar 1s forwards;
}

@keyframes fadeChar{
  to{
    opacity:0;
    transform:scale(0.6);
    filter:blur(6px);
  }
}

/* ENTER */
.enter-btn{
  font-size:12px;
  letter-spacing:2px;
  cursor:pointer;
  opacity:0.7;
  transition:0.3s;
}

.enter-btn:hover{
  opacity:1;
  letter-spacing:5px;
}

/* ===== 关系图 ===== */
.network-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  opacity:0;
  transition:1s;
}

.network-screen.show{
  opacity:1;
}

.network-inner{
  transform-origin:center;
}

.network-bg{
  width:120%;
  height:120%;
  object-fit:contain;
}

/* ===== 面板 ===== */
.panel{
  position:fixed;
  right:-400px;
  top:0;
  width:400px;
  height:100vh;
  background:#111;
  padding:30px;
  transition:0.4s;
}

.panel.active{
  right:0;
}

.panel button{
  position:absolute;
  top:20px;
  right:20px;
}

</style>
</head>

<body>

<div class="sidebar">

  <img src="logo.png" class="logo" onclick="goHome()">

  <div class="title" onclick="reloadPage()">Symphony Noir</div>

  <div class="nav-item active" onclick="goTitle()">Title</div>
  <div class="nav-item" onclick="goChar()">Characters</div>
  <div class="nav-item" onclick="goNet()">Network</div>

</div>

<div class="main">

<!-- 标题 -->
<div class="title-screen" id="title" onclick="enterCharacters()">
  <img src="images/title.png">
</div>

<!-- 主角 -->
<div class="character-screen" id="chars">

  <div class="char" id="yagami">
    <img src="images/yagami.png">
  </div>

  <div class="enter-btn" onclick="enterNetwork()">ENTER</div>

  <div class="char" id="shin">
    <img src="images/shin.png">
  </div>

</div>

<!-- 关系图 -->
<div class="network-screen" id="network">
  <div class="network-inner" id="inner">
    <img src="images/network.png" class="network-bg">
  </div>
</div>

</div>

<div class="panel" id="panel">
  <h2 id="name"></h2>
  <button onclick="closePanel()">Close</button>
</div>

<script>

/* ===== 导航 ===== */
function goHome(){
  window.location.href="index.html";
}

function reloadPage(){
  location.reload();
}

function goTitle(){
  location.reload();
}

function goChar(){
  enterCharacters();
}

function goNet(){
  enterNetwork();
}

/* ===== 页面 ===== */
function enterCharacters(){
  document.getElementById("title").classList.add("fade-out");

  setTimeout(()=>{
    document.getElementById("title").style.display="none";
    document.getElementById("chars").style.display="flex";
  },1200);
}

function enterNetwork(){

  document.getElementById("yagami").classList.add("fade-char");
  document.getElementById("shin").classList.add("fade-char");

  setTimeout(()=>{
    document.getElementById("chars").style.display="none";
    document.getElementById("network").style.display="block";

    setTimeout(()=>{
      document.getElementById("network").classList.add("show");
    },50);

  },800);
}

/* ===== 缩放拖动 ===== */
let scale=1,x=0,y=0,drag=false;

document.addEventListener("wheel",e=>{
  scale+=e.deltaY*-0.001;
  scale=Math.min(Math.max(0.8,scale),2.5);
  update();
});

document.addEventListener("mousedown",()=>drag=true);
document.addEventListener("mouseup",()=>drag=false);

document.addEventListener("mousemove",e=>{
  if(!drag)return;
  x+=e.movementX;
  y+=e.movementY;
  update();
});

/* ⭐ 点击恢复 */
document.addEventListener("click",e=>{
  if(e.target.classList.contains("network-bg")){
    scale=1;
    x=0;
    y=0;
    update();
  }
});

function update(){
  inner.style.transform=`translate(${x}px,${y}px) scale(${scale})`;
}

/* ===== panel ===== */
function closePanel(){
  document.getElementById("panel").classList.remove("active");
}

</script>

</body>
</html>
