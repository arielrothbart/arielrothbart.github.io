<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<style>

body {
  margin: 0;
  background: black;
  color: white;
  font-family: serif;
  overflow: hidden;
}

/* ===== 左侧 ===== */
.sidebar {
  position: fixed;
  width: 220px;
  height: 100vh;
  background: rgba(10,10,10,0.95);
  padding: 30px;
}

.sidebar h2 {
  margin-bottom: 20px;
}

.nav-item {
  color: #666;
  margin: 10px 0;
}

.nav-item.active {
  color: #fff;
}

/* ===== 主区域 ===== */
.main {
  margin-left: 220px;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ===== 标题 ===== */
.title-screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.title-screen img {
  width: 420px;
  opacity: 0;
  animation: fade 2s forwards;
}

@keyframes fade {
  to { opacity: 1; }
}

/* ===== 主角页 ===== */
.character-screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 120px;
}

.char img {
  width: 140px;
  border-radius: 50%;
  cursor: pointer;
  transition: 0.3s;
}

.char img:hover {
  transform: scale(1.1);
}

/* 中间入口 */
.enter-btn {
  cursor: pointer;
  opacity: 0.7;
  transition: 0.3s;
}

.enter-btn:hover {
  opacity: 1;
}

/* ===== 关系图 ===== */
.network-screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: none;
}

.network-container {
  width: 100%;
  height: 100%;
  overflow: hidden;
  cursor: grab;
}

/* ⭐ 可移动层 */
.network-inner {
  width: 100%;
  height: 100%;
  transform-origin: center;
}

.network-bg {
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
}

/* ===== 人物点击点 ===== */
.node {
  position: absolute;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  cursor: pointer;
}

/* ===== 面板（修复跑出屏幕问题） ===== */
.panel {
  position: fixed;
  right: -400px;
  top: 0;
  width: 400px;
  height: 100vh;
  background: #111;
  padding: 30px;
  transition: 0.4s;
  z-index: 20;
}

.panel.active {
  right: 0;
}

.panel button {
  margin-top: 20px;
}

</style>
</head>

<body>

<div class="sidebar">
  <h2>Symphony Noir</h2>

  <div id="nav-title" class="nav-item active">Title</div>
  <div id="nav-char" class="nav-item">Characters</div>
  <div id="nav-net" class="nav-item">Network</div>
</div>

<div class="main">

  <!-- 标题 -->
  <div class="title-screen" onclick="enterCharacters()">
    <img src="images/title.png">
  </div>

  <!-- 主角 -->
  <div class="character-screen" id="chars">

    <div class="char" onclick="openPanel('Yagami')">
      <img src="images/yagami.png">
    </div>

    <!-- ⭐ 中间入口 -->
    <div class="enter-btn" onclick="enterNetwork()">
      Enter Network
    </div>

    <div class="char" onclick="openPanel('Shin')">
      <img src="images/shin.png">
    </div>

  </div>

  <!-- 关系图 -->
  <div class="network-screen" id="network">

    <div class="network-container" id="container">
      <div class="network-inner" id="inner">

        <img src="images/network.png" class="network-bg" id="net">

        <!-- 示例节点 -->
        <div class="node" style="top:65%; left:28%;" onclick="openPanel('Yagami')"></div>
        <div class="node" style="top:65%; left:75%;" onclick="openPanel('Shin')"></div>

      </div>
    </div>

  </div>

</div>

<div class="panel" id="panel">
  <h2 id="name"></h2>
  <button onclick="closePanel()">Close</button>
</div>

<script>

/* ===== 状态切换 ===== */
function setNav(a,b,c){
  document.getElementById("nav-title").classList.toggle("active",a);
  document.getElementById("nav-char").classList.toggle("active",b);
  document.getElementById("nav-net").classList.toggle("active",c);
}

function enterCharacters(){
  document.querySelector(".title-screen").style.display="none";
  document.getElementById("chars").style.display="flex";
  setNav(0,1,0);
}

function enterNetwork(){
  document.getElementById("chars").style.display="none";
  document.getElementById("network").style.display="block";
  setNav(0,0,1);
}

/* ===== 面板 ===== */
function openPanel(name){
  document.getElementById("panel").classList.add("active");
  document.getElementById("name").innerText=name;
}

function closePanel(){
  document.getElementById("panel").classList.remove("active");
}

/* ===== 缩放 + 拖动 ===== */
let scale = 1;
let isDragging = false;
let startX, startY;
let translateX = 0;
let translateY = 0;

const inner = document.getElementById("inner");

/* 滚轮缩放 */
document.getElementById("container").addEventListener("wheel", e=>{
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(1, scale), 3);
  updateTransform();
});

/* 拖动 */
document.getElementById("container").addEventListener("mousedown", e=>{
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
});

document.addEventListener("mousemove", e=>{
  if(!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener("mouseup", ()=> isDragging=false);

function updateTransform(){
  inner.style.transform =
    `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

</script>

</body>
</html>
