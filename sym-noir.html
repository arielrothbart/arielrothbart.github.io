<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
  overflow:hidden;
}

/* ===== sidebar ===== */
.sidebar{
  position:fixed;
  width:220px;
  height:100vh;
  background:#0a0a0a;
  padding:30px;
  z-index:10;
}

.logo{
  width:80px;
  cursor:pointer;
  margin-bottom:20px;
}

.title{
  font-size:22px;
  margin-bottom:20px;
  cursor:pointer;
}

.nav-item{
  margin:10px 0;
  color:#666;
  cursor:pointer;
}

.nav-item.active{
  color:white;
}

/* ===== main ===== */
.main{
  margin-left:220px;
  height:100vh;
  position:relative;
}

/* ===== title ===== */
.title-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.title-screen img{
  width:700px;
  opacity:0;
  animation:fade 2s forwards;
}

@keyframes fade{
  to{opacity:1;}
}

/* ===== character ===== */
.character-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  gap:120px;
}

.char img{
  width:150px;
  border-radius:50%;
}

.enter-btn{
  font-size:12px;
  cursor:pointer;
  opacity:0.7;
}
.enter-btn:hover{
  opacity:1;
}

/* ===== network ===== */
.network-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
}

.network-inner{
  width:100%;
  height:100%;
  transform-origin:center;
  transition:0.1s;
}

.network-bg{
  width:120%;
  height:120%;
  object-fit:contain;
}

/* ===== mobile ===== */
@media (max-width:768px){
  .sidebar{display:none;}
  .main{margin-left:0;}
}

</style>
</head>

<body>

<div class="sidebar">
  <img src="logo.png" class="logo" onclick="goHome()">

  <div class="title" onclick="reloadPage()">Symphony Noir</div>

  <div class="nav-item active" id="nav-title" onclick="goTitle()">Title</div>
  <div class="nav-item" id="nav-char" onclick="goChar()">Characters</div>
  <div class="nav-item" id="nav-net" onclick="goNet()">Network</div>
</div>

<div class="main">

<!-- title -->
<div class="title-screen" id="title" onclick="enterCharacters()">
  <img src="images/title.png">
</div>

<!-- characters -->
<div class="character-screen" id="chars">
  <div class="char"><img src="images/yagami.png"></div>
  <div class="enter-btn" onclick="enterNetwork()">ENTER</div>
  <div class="char"><img src="images/shin.png"></div>
</div>

<!-- network -->
<div class="network-screen" id="network">
  <div class="network-inner" id="inner">
    <img src="images/network.png" class="network-bg" id="networkImg">
  </div>
</div>

</div>

<script>

/* ===== navigation ===== */
function setNav(a,b,c){
  navTitle.classList.toggle("active",a);
  navChar.classList.toggle("active",b);
  navNet.classList.toggle("active",c);
}

function goHome(){
  window.location.href="index.html";
}
function reloadPage(){location.reload();}
function goTitle(){location.reload();}
function goChar(){enterCharacters();}
function goNet(){enterNetwork();}

/* ===== pages ===== */
function enterCharacters(){
  title.style.display="none";
  chars.style.display="flex";
  setNav(0,1,0);
}

function enterNetwork(){
  chars.style.display="none";
  network.style.display="block";
  setNav(0,0,1);

  focusModern();
}

/* ===== camera ===== */
let scale=1.2, x=0, y=0;
let dragging=false;

function focusModern(){
  scale=1.3;
  x=-window.innerWidth*0.15;
  y=-window.innerHeight*0.25;
  update();
}

function resetView(){
  scale=1;
  x=0;
  y=0;
  update();
}

function update(){
  inner.style.transform=
    `translate(${x}px,${y}px) scale(${scale})`;
}

/* ===== ONLY network interaction ===== */

const net = document.getElementById("network");

/* zoom */
net.addEventListener("wheel",e=>{
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(0.8,scale),2.5);
  update();
});

/* drag */
net.addEventListener("mousedown",()=>dragging=true);
net.addEventListener("mouseup",()=>dragging=false);
net.addEventListener("mouseleave",()=>dragging=false);

net.addEventListener("mousemove",e=>{
  if(!dragging)return;
  x += e.movementX;
  y += e.movementY;
  update();
});

/* click reset ONLY when clicking image */
document.getElementById("networkImg").addEventListener("click",()=>{
  resetView();
});

</script>

</body>
</html>
