<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

/* ===== 基础 ===== */
body{
  margin:0;
  background:black;
  color:white;
  overflow:hidden;
  font-family: serif;
}

/* ===== 左侧导航 ===== */
.sidebar{
  position:fixed;
  width:220px;
  height:100vh;
  background:rgba(10,10,10,0.95);
  padding:30px;
  z-index:10;
}

.logo{
  width:80px;
  opacity:0.8;
  margin-bottom:20px;
}

.back{
  display:block;
  margin-bottom:20px;
  color:#aaa;
  text-decoration:none;
}

.nav-item{
  margin:10px 0;
  color:#666;
  cursor:pointer;
}

.nav-item.active{
  color:white;
}

/* ===== 主区域 ===== */
.main{
  margin-left:220px;
  height:100vh;
  position:relative;
  overflow:hidden;
}

/* ===== 转场（暗化） ===== */
.fade{
  animation:fadeBlack 0.6s;
}

@keyframes fadeBlack{
  from{opacity:0;}
  to{opacity:1;}
}

/* ===== 标题 ===== */
.title-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.title-screen img{
  width:420px;
  opacity:0;
  animation:titleFade 2s forwards;
}

@keyframes titleFade{
  to{opacity:1;}
}

/* ===== 主角 ===== */
.character-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  gap:120px;
}

.char{
  position:relative;
  transition:1.2s ease;
}

.char img{
  width:140px;
  border-radius:50%;
  cursor:pointer;
}

/* ===== 飞入动画 ===== */
.move-yagami{
  position:absolute;
  top:62%;
  left:32%;
  transform:scale(0.4);
}

.move-shin{
  position:absolute;
  top:62%;
  left:72%;
  transform:scale(0.4);
}

/* ===== Enter按钮（复古打字机） ===== */
.enter-btn{
  font-family:'Special Elite', cursive;
  font-size:14px;
  letter-spacing:2px;
  cursor:pointer;
  opacity:0.7;
  transition:0.3s;
}

.enter-btn:hover{
  opacity:1;
  letter-spacing:4px;
}

/* ===== 关系图 ===== */
.network-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  opacity:0;
  transition:1s;
}

.network-screen.show{
  opacity:1;
}

.network-container{
  width:100%;
  height:100%;
  cursor:grab;
}

.network-inner{
  transform-origin:center;
  transition:0.3s;
}

.network-bg{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ===== 面板（修复按钮问题） ===== */
.panel{
  position:fixed;
  right:-400px;
  top:0;
  width:400px;
  height:100vh;
  background:#111;
  padding:30px;
  transition:0.4s;
  z-index:50;
}

.panel.active{
  right:0;
}

.panel button{
  position:absolute;
  top:20px;
  right:20px;
}

/* ===== 点击点 ===== */
.node{
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="sidebar">
  <img src="logo.png" class="logo">

  <a href="index.html" class="back">← Back</a>

  <div class="nav-item active" onclick="goTitle()">Title</div>
  <div class="nav-item" onclick="goChar()">Characters</div>
  <div class="nav-item" onclick="goNet()">Network</div>
</div>

<div class="main">

<!-- 标题 -->
<div class="title-screen" onclick="enterCharacters()">
  <img src="images/title.png">
</div>

<!-- 主角 -->
<div class="character-screen" id="chars">

  <div class="char" id="yagami" onclick="openPanel('Yagami')">
    <img src="images/yagami.png">
  </div>

  <div class="enter-btn" onclick="enterNetwork()">ENTER</div>

  <div class="char" id="shin" onclick="openPanel('Shin')">
    <img src="images/shin.png">
  </div>

</div>

<!-- 关系图 -->
<div class="network-screen" id="network">

  <div class="network-container" id="container">
    <div class="network-inner" id="inner">

      <img src="images/network.png" class="network-bg">

      <div class="node" style="top:65%; left:28%;" onclick="openPanel('Yagami')"></div>
      <div class="node" style="top:65%; left:75%;" onclick="openPanel('Shin')"></div>

    </div>
  </div>

</div>

</div>

<div class="panel" id="panel">
  <h2 id="name"></h2>
  <button onclick="closePanel()">Close</button>
</div>

<script>

/* ===== 导航 ===== */
function setNav(a,b,c){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(a) document.querySelectorAll('.nav-item')[0].classList.add('active');
  if(b) document.querySelectorAll('.nav-item')[1].classList.add('active');
  if(c) document.querySelectorAll('.nav-item')[2].classList.add('active');
}

function goTitle(){
  location.reload();
}

function goChar(){
  enterCharacters();
}

function goNet(){
  enterNetwork();
}

/* ===== 页面 ===== */
function enterCharacters(){
  document.querySelector(".title-screen").style.display="none";
  document.getElementById("chars").style.display="flex";
  setNav(0,1,0);
}

function enterNetwork(){

  const y = document.getElementById("yagami");
  const s = document.getElementById("shin");

  y.classList.add("move-yagami");
  s.classList.add("move-shin");

  setTimeout(()=>{
    document.getElementById("network").style.display="block";
    setTimeout(()=>{
      document.getElementById("network").classList.add("show");
    },50);
  },800);

  document.querySelector(".enter-btn").style.opacity=0;

  setNav(0,0,1);
}

/* ===== 面板 ===== */
function openPanel(name){
  document.getElementById("panel").classList.add("active");
  document.getElementById("name").innerText=name;
}

function closePanel(){
  document.getElementById("panel").classList.remove("active");
}

/* ===== 缩放拖动 ===== */
let scale=1, x=0, y=0, dragging=false, startX, startY;
const inner=document.getElementById("inner");

container.onwheel=e=>{
  e.preventDefault();
  scale+=e.deltaY*-0.001;
  scale=Math.min(Math.max(1,scale),3);
  update();
};

container.onmousedown=e=>{
  dragging=true;
  startX=e.clientX-x;
  startY=e.clientY-y;
};

document.onmousemove=e=>{
  if(!dragging)return;
  x=e.clientX-startX;
  y=e.clientY-startY;
  update();
};

document.onmouseup=()=>dragging=false;

/* ⭐ 点击回归原位 */
container.onclick=()=>{
  scale=1;
  x=0;
  y=0;
  update();
};

function update(){
  inner.style.transform=`translate(${x}px,${y}px) scale(${scale})`;
}

</script>

</body>
</html>
