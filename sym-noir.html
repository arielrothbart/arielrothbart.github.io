<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<style>

/* ===== 基础 ===== */
body {
  margin: 0;
  background: #000;
  font-family: serif;
  overflow: hidden;
}

/* ===== 左侧 ===== */
.sidebar {
  position: fixed;
  width: 220px;
  height: 100vh;
  background: rgba(10,10,10,0.95);
  color: #aaa;
  padding: 30px;
}

.sidebar a {
  display: block;
  margin: 12px 0;
  color: #888;
  text-decoration: none;
}

.sidebar a:hover {
  color: #fff;
}

/* ===== 主区域 ===== */
.main {
  margin-left: 220px;
  height: 100vh;
  position: relative;
}

/* ===== 图层 ===== */
.network-container {
  position: relative;
  width: 100%;
  height: 100%;
}

/* ⭐ 背景图淡入 */
.network-bg {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  animation: bgFade 1.5s ease forwards;
}

@keyframes bgFade {
  to { opacity: 1; }
}

/* ⭐ 线条（基础） */
.lines {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0.12;
  pointer-events: none;
}

/* ⭐ 发光线条（延迟出现） */
.lines-glow {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  pointer-events: none;
  filter: blur(4px) brightness(1.8);
  transition: 0.4s;
  animation: glowAppear 1s ease forwards 2.8s;
}

@keyframes glowAppear {
  to { opacity: 0.7; }
}

/* ===== 人物 ===== */
.node {
  position: absolute;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  cursor: pointer;
  transition: 0.3s;

  opacity: 0;
}

/* ⭐ 主角 */
.node.main {
  animation: mainAppear 1.2s ease forwards 0.6s;
}

@keyframes mainAppear {
  from {
    opacity: 0;
    transform: scale(0.7);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* ⭐ 扩散人物 */
.node.spread1 { animation: spread 1s ease forwards 1.4s; }
.node.spread2 { animation: spread 1s ease forwards 1.8s; }
.node.spread3 { animation: spread 1s ease forwards 2.2s; }

@keyframes spread {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* hover */
.node:hover {
  transform: scale(1.12);
}

/* dim */
.dimmed {
  opacity: 0.15 !important;
}

/* ===== 右侧卡 ===== */
.panel {
  position: fixed;
  right: -400px;
  top: 0;
  width: 400px;
  height: 100vh;
  background: #111;
  color: #eee;
  padding: 30px;
  transition: 0.4s;
}

.panel.active {
  right: 0;
}

/* ===== 控制 ===== */
.controls {
  position: absolute;
  top: 20px;
  right: 20px;
}

.controls button {
  margin-left: 10px;
  background: rgba(0,0,0,0.6);
  color: white;
  border: none;
  padding: 6px 10px;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="sidebar">
  <h2>Symphony Noir</h2>
  <a href="index.html">← Back</a>
  <a href="#">Overview</a>
  <a href="#">Timeline</a>
  <a href="#">Character Network</a>
</div>

<div class="main">

  <div class="controls">
    <button onclick="toggleGlow()">Highlight Relations</button>
  </div>

  <div class="network-container">

    <!-- ⭐ 只保留这三个图（不会再破图） -->
    <img src="images/network.png" class="network-bg">
    <img src="images/lines.png" class="lines">
    <img src="images/lines.png" class="lines-glow" id="glowLayer">

    <!-- ⭐ 主角 -->
    <div class="node main" style="top:65%; left:28%;"
      data-name="Yagami"
      data-info="Consultant Detective"
      onmouseenter="highlight(this)"
      onmouseleave="resetHighlight()"
      onclick="openPanel(this)">
    </div>

    <div class="node main" style="top:65%; left:75%;"
      data-name="Shin"
      data-info="Occultism Professor"
      onmouseenter="highlight(this)"
      onmouseleave="resetHighlight()"
      onclick="openPanel(this)">
    </div>

    <!-- ⭐ 扩散人物（示例） -->
    <div class="node spread1" style="top:75%; left:38%;"></div>
    <div class="node spread2" style="top:75%; left:52%;"></div>
    <div class="node spread3" style="top:90%; left:60%;"></div>

  </div>
</div>

<div class="panel" id="panel">
  <h2 id="name"></h2>
  <p id="info"></p>
  <button onclick="closePanel()">Close</button>
</div>

<script>

/* hover */
function highlight(el) {
  document.querySelectorAll('.node').forEach(n=>{
    n.classList.add('dimmed');
  });
  el.classList.remove('dimmed');

  document.getElementById("glowLayer").classList.add("active");
}

/* reset */
function resetHighlight() {
  document.querySelectorAll('.node').forEach(n=>{
    n.classList.remove('dimmed');
  });

  document.getElementById("glowLayer").classList.remove("active");
}

/* panel */
function openPanel(el) {
  document.getElementById("panel").classList.add("active");
  document.getElementById("name").innerText = el.dataset.name;
  document.getElementById("info").innerText = el.dataset.info;
}

function closePanel() {
  document.getElementById("panel").classList.remove("active");
}

/* glow */
function toggleGlow() {
  document.getElementById("glowLayer").classList.toggle("active");
}

</script>

</body>
</html>
