<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
  overflow:hidden;
}

/* ===== sidebar ===== */
.sidebar{
  position:fixed;
  width:220px;
  height:100vh;
  background:#0a0a0a;
  padding:30px;
  z-index:10;
}

.logo{width:80px;cursor:pointer;}
.title{font-size:24px;margin:20px 0;cursor:pointer;}

.nav-item{margin:10px 0;color:#666;cursor:pointer;}
.nav-item.active{color:white;}

/* ===== main ===== */
.main{
  margin-left:220px;
  height:100vh;
  position:relative;
}

/* ===== title ===== */
.title-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.title-screen img{
  width:760px;
  opacity:0;
  animation:fadeIn 2s forwards;
}

@keyframes fadeIn{to{opacity:1;}}

.fade-out{
  animation:ghostOut 1.2s forwards;
}

@keyframes ghostOut{
  to{
    opacity:0;
    transform:translateY(-60px);
    filter:blur(6px);
  }
}

/* ===== story ===== */
.story-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  padding:80px;
}

.story-container{
  width:100%;
  max-width:720px;
  height:100%;
  overflow-y:auto;
}

.story-text{
  line-height:2;
  font-size:15px;
  color:#ddd;
  transition:0.3s;
}

.story-text p{
  margin:0 0 1.6em 0;
}

.flip{
  transform:rotateY(10deg);
  opacity:0.6;
}

/* ===== characters ===== */
.character-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  gap:120px;
}

.char img{
  width:150px;
  border-radius:50%;
}

.fade-char{
  animation:ghostOut 1s forwards;
}

/* ===== ENTER ===== */
.enter-btn{
  font-size:12px;
  cursor:pointer;
  opacity:0.7;
  letter-spacing:2px;
  transition:0.3s;
}

.enter-btn:hover{
  opacity:1;
  letter-spacing:6px;
  transform:scale(1.1);
}

.enter-btn.active{
  letter-spacing:18px;
  opacity:0;
  transform:scale(1.3);
  transition:0.5s;
}

/* ===== network ===== */
.network-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  overflow:hidden;
}

.viewer{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:grab;
}

.viewer img{
  max-width:90%;
  max-height:90%;
  transition:none;
}

/* ⭐ zoom 提示 */
.zoom-hint{
  position:absolute;
  right:20px;
  bottom:20px;
  font-size:12px;
  opacity:0.5;
  pointer-events:none;
}

/* ===== mobile ===== */
.mobile-nav{display:none;}

@media (max-width:768px){

  body{overflow:auto !important;}

  .sidebar{display:none;}
  .main{margin-left:0;}

  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:0;
    width:100%;
    height:90px;
    background:#0a0a0a;
    justify-content:space-around;
    align-items:center;
    font-size:16px;
    z-index:100;
  }

  .mobile-nav div{
    padding:18px 26px;
    color:#aaa;
    border-radius:10px;
  }

  .mobile-nav div:active{
    background:#222;
    color:white;
  }
}

</style>
</head>

<body>

<div class="mobile-nav">
  <div onclick="showTitle()">Title</div>
  <div onclick="navChar.onclick()">Chars</div>
  <div onclick="navNet.onclick()">Net</div>
</div>

<div class="sidebar">
  <img src="logo.png" class="logo" onclick="goHome()">
  <div class="title" onclick="showTitle()">Symphony Noir</div>

  <div class="nav-item active" id="nav-title">Title</div>
  <div class="nav-item" id="nav-char">Characters</div>
  <div class="nav-item" id="nav-net">Network</div>
  <div class="nav-item" onclick="goTimeline()">Timeline</div>
</div>

<div class="main">

<div class="title-screen" id="title">
  <img src="images/title.png">
</div>

<div class="story-screen" id="story">
  <div class="story-container">
    <div class="story-text" id="storyText"></div>
  </div>
</div>

<div class="character-screen" id="chars">
  <div class="char" id="yagami"><img src="images/yagami.png"></div>
  <div class="enter-btn" id="enterBtn">ENTER</div>
  <div class="char" id="shin"><img src="images/shin.png"></div>
</div>

<div class="network-screen" id="network">
  <div class="viewer" id="viewer">
    <img src="images/network.png" id="netImg">
  </div>

  <div class="zoom-hint">Scroll to zoom · 拖动滚轮放大</div>
</div>

</div>

<script>

/* ===== 原变量 ===== */
const title = document.getElementById("title");
const story = document.getElementById("story");
const storyText = document.getElementById("storyText");
const chars = document.getElementById("chars");
const network = document.getElementById("network");

const yagami = document.getElementById("yagami");
const shin = document.getElementById("shin");
const enterBtn = document.getElementById("enterBtn");

const navTitle = document.getElementById("nav-title");
const navChar = document.getElementById("nav-char");
const navNet = document.getElementById("nav-net");

function setNav(t,c,n){
  navTitle.classList.toggle("active",t);
  navChar.classList.toggle("active",c);
  navNet.classList.toggle("active",n);
}

function goHome(){window.location.href="index.html";}
function goTimeline(){window.location.href="timeline.html";}

/* ===== ⭐ network交互恢复 ===== */

const viewer = document.getElementById("viewer");
const img = document.getElementById("netImg");

let scale = 1;
let pos = { x:0, y:0 };
let isDragging = false;
let start = { x:0, y:0 };

viewer.addEventListener("wheel", (e)=>{
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale *= delta;
  scale = Math.max(0.6, Math.min(scale, 3));
  updateTransform();
});

viewer.addEventListener("mousedown", (e)=>{
  isDragging = true;
  start.x = e.clientX - pos.x;
  start.y = e.clientY - pos.y;
  viewer.style.cursor = "grabbing";
});

window.addEventListener("mouseup", ()=>{
  isDragging = false;
  viewer.style.cursor = "grab";
});

window.addEventListener("mousemove", (e)=>{
  if(!isDragging) return;
  pos.x = e.clientX - start.x;
  pos.y = e.clientY - start.y;
  updateTransform();
});

viewer.addEventListener("click", (e)=>{
  if(e.target !== img){
    resetView();
  }
});

function updateTransform(){
  img.style.transform =
    "translate(" + pos.x + "px," + pos.y + "px) scale(" + scale + ")";
}

function resetView(){
  scale = 1;
  pos = { x:0, y:0 };
  img.style.transition = "0.4s";
  updateTransform();
  setTimeout(()=>{ img.style.transition="none"; },400);
}

img.addEventListener("contextmenu", e=>e.preventDefault());

</script>

</body>
