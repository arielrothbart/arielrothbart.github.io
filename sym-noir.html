<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<style>

/* ===== 基础 ===== */
body {
  margin: 0;
  background: #000;
  font-family: serif;
  overflow: hidden;
}

/* ===== 左侧 ===== */
.sidebar {
  position: fixed;
  width: 220px;
  height: 100vh;
  background: rgba(10,10,10,0.95);
  color: #aaa;
  padding: 30px;
}

.sidebar a {
  display: block;
  margin: 12px 0;
  color: #888;
  text-decoration: none;
}

.sidebar a:hover {
  color: #fff;
}

/* ===== 主区域 ===== */
.main {
  margin-left: 220px;
  height: 100vh;
  position: relative;
}

/* ===== 图层系统 ===== */
.network-container {
  position: relative;
  width: 100%;
  height: 100%;
}

/* 背景人物图 */
.network-bg {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* 线条层（默认暗） */
.lines {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0.15;
  pointer-events: none;
}

/* 发光层 */
.lines-glow {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  pointer-events: none;

  filter: blur(4px) brightness(1.8);
  transition: 0.4s;
}

/* 激活发光 */
.lines-glow.active {
  opacity: 0.9;
}

/* ===== 人物点 ===== */
.node {
  position: absolute;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  cursor: pointer;
  transition: 0.3s;
}

/* hover 效果 */
.node:hover {
  transform: scale(1.12);
}

/* 其他变暗 */
.dimmed {
  opacity: 0.15;
}

/* ===== 右侧人物卡 ===== */
.panel {
  position: fixed;
  right: -400px;
  top: 0;
  width: 400px;
  height: 100vh;
  background: #111;
  color: #eee;
  padding: 30px;
  transition: 0.4s;
}

.panel.active {
  right: 0;
}

/* ===== 顶部控制 ===== */
.controls {
  position: absolute;
  top: 20px;
  right: 20px;
}

.controls button {
  margin-left: 10px;
  background: rgba(0,0,0,0.6);
  color: white;
  border: none;
  padding: 6px 10px;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="sidebar">
  <h2>Symphony Noir</h2>
  <a href="index.html">← Back</a>
  <a href="#">Overview</a>
  <a href="#">Timeline</a>
  <a href="#">Character Network</a>
</div>

<div class="main">

  <div class="controls">
    <button onclick="toggleGlow()">Highlight Relations</button>
  </div>

  <div class="network-container">

    <!-- 人物图 -->
    <img src="images/network.png" class="network-bg">

    <!-- 线条 -->
    <img src="images/lines.png" class="lines">
    <img src="images/lines.png" class="lines-glow" id="glowLayer">

    <!-- ===== 人物节点（示例几个，你继续补） ===== -->

    <div class="node" style="top:65%; left:28%;"
      data-name="Synon"
      data-info="Consultant Detective"
      onmouseenter="highlight(this)"
      onmouseleave="resetHighlight()"
      onclick="openPanel(this)">
    </div>

    <div class="node" style="top:65%; left:75%;"
      data-name="Sugahara"
      data-info="Occultism Professor"
      onmouseenter="highlight(this)"
      onmouseleave="resetHighlight()"
      onclick="openPanel(this)">
    </div>

  </div>
</div>

<div class="panel" id="panel">
  <h2 id="name"></h2>
  <p id="info"></p>
  <button onclick="closePanel()">Close</button>
</div>

<script>

/* ===== hover 人物 ===== */
function highlight(el) {
  document.querySelectorAll('.node').forEach(n=>{
    n.classList.add('dimmed');
  });
  el.classList.remove('dimmed');

  document.getElementById("glowLayer").classList.add("active");
}

/* reset */
function resetHighlight() {
  document.querySelectorAll('.node').forEach(n=>{
    n.classList.remove('dimmed');
  });

  document.getElementById("glowLayer").classList.remove("active");
}

/* ===== panel ===== */
function openPanel(el) {
  document.getElementById("panel").classList.add("active");
  document.getElementById("name").innerText = el.dataset.name;
  document.getElementById("info").innerText = el.dataset.info;
}

function closePanel() {
  document.getElementById("panel").classList.remove("active");
}

/* ===== 手动开关发光 ===== */
function toggleGlow() {
  document.getElementById("glowLayer").classList.toggle("active");
}

</script>

</body>
</html>
