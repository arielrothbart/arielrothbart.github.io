<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
  overflow:hidden;
}

/* ===== sidebar ===== */
.sidebar{
  position:fixed;
  width:220px;
  height:100vh;
  background:#0a0a0a;
  padding:30px;
  z-index:10;
}

.logo{
  width:80px;
  cursor:pointer;
  margin-bottom:20px;
}

.title{
  font-size:24px;
  margin-bottom:20px;
  cursor:pointer;
}

.nav-item{
  margin:10px 0;
  color:#666;
  cursor:pointer;
}

.nav-item.active{
  color:white;
}

/* ===== main ===== */
.main{
  margin-left:220px;
  height:100vh;
  position:relative;
}

/* ===== 标题 ===== */
.title-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.title-screen img{
  width:760px;
  opacity:0;
  transform:translateY(40px);
  animation:titleIn 2s forwards;
}

@keyframes titleIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ⭐ 向上消散 */
.fade-out{
  animation:ghostOut 1.4s forwards;
}

@keyframes ghostOut{
  to{
    opacity:0;
    filter:blur(8px);
    transform:translateY(-80px);
  }
}

/* ===== character ===== */
.character-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  gap:140px;
}

.char{
  transition:0.3s;
}

.char img{
  width:160px;
  border-radius:50%;
}

/* 同样的ghost动画 */
.fade-char{
  animation:ghostOut 1.2s forwards;
}

/* ENTER */
.enter-btn{
  font-size:12px;
  letter-spacing:2px;
  cursor:pointer;
  opacity:0.7;
  transition:0.3s;
}

.enter-btn:hover{
  opacity:1;
  transform:scale(1.1);
  letter-spacing:5px;
}

/* ===== network ===== */
.network-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  overflow:hidden;
}

.network-inner{
  position:absolute;
  transform-origin:center;
}

.network-bg{
  display:block;
}

/* ===== mobile ===== */
@media (max-width:768px){
  .sidebar{display:none;}
  .main{margin-left:0;}
}

</style>
</head>

<body>

<div class="sidebar">

  <img src="logo.png" class="logo" onclick="goHome()">

  <div class="title" onclick="reloadPage()">Symphony Noir</div>

  <div class="nav-item active" id="nav-title" onclick="goTitle()">Title</div>
  <div class="nav-item" id="nav-char" onclick="goChar()">Characters</div>
  <div class="nav-item" id="nav-net" onclick="goNet()">Network</div>

</div>

<div class="main">

<!-- title -->
<div class="title-screen" id="title" onclick="enterCharacters()">
  <img src="images/title.png">
</div>

<!-- character -->
<div class="character-screen" id="chars">
  <div class="char" id="yagami"><img src="images/yagami.png"></div>
  <div class="enter-btn" onclick="enterNetwork()">ENTER</div>
  <div class="char" id="shin"><img src="images/shin.png"></div>
</div>

<!-- network -->
<div class="network-screen" id="network">
  <div class="network-inner" id="inner">
    <img src="images/network.png" id="netImg" class="network-bg">
  </div>
</div>

</div>

<script>

/* ===== nav ===== */
function setNav(t,c,n){
  navTitle.classList.toggle("active",t);
  navChar.classList.toggle("active",c);
  navNet.classList.toggle("active",n);
}

function goHome(){window.location.href="index.html";}
function reloadPage(){location.reload();}
function goTitle(){location.reload();}
function goChar(){enterCharacters();}
function goNet(){enterNetwork();}

/* ===== flow ===== */
function enterCharacters(){

  title.classList.add("fade-out");

  setTimeout(()=>{
    title.style.display="none";
    chars.style.display="flex";
    setNav(0,1,0);
  },1200);
}

function enterNetwork(){

  yagami.classList.add("fade-char");
  shin.classList.add("fade-char");

  setTimeout(()=>{

    chars.style.display="none";  // ⭐ 彻底隐藏

    network.style.display="block";
    setNav(0,0,1);

    setTimeout(()=>{
      resetView();      // 先居中
      focusModern();    // 再轻微偏下
    },50);

  },1000);
}

/* ===== camera ===== */

let scale=1, x=0, y=0, dragging=false;

const inner=document.getElementById("inner");
const img=document.getElementById("netImg");

/* ⭐ 居中适配 */
function resetView(){

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const iw = img.naturalWidth;
  const ih = img.naturalHeight;

  const s = Math.min(vw/iw, vh/ih);

  scale = s;

  x = (vw - iw*s)/2;
  y = (vh - ih*s)/2;

  update();
}

/* ⭐ 向下聚焦主角区 */
function focusModern(){
  y -= window.innerHeight * 0.15;
  update();
}

/* zoom */
network.addEventListener("wheel",e=>{
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(0.5,scale),3);
  update();
});

/* drag */
network.addEventListener("mousedown",()=>dragging=true);
network.addEventListener("mouseup",()=>dragging=false);
network.addEventListener("mouseleave",()=>dragging=false);

network.addEventListener("mousemove",e=>{
  if(!dragging)return;
  x += e.movementX;
  y += e.movementY;
  update();
});

/* click reset */
img.addEventListener("click",resetView);

function update(){
  inner.style.transform =
    `translate(${x}px,${y}px) scale(${scale})`;
}

</script>

</body>
</html>
