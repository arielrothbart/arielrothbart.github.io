<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<style>

/* ===== 基础 ===== */
body {
  margin: 0;
  background: black;
  color: white;
  font-family: serif;
  overflow: hidden;
}

/* ===== 左侧 ===== */
.sidebar {
  position: fixed;
  width: 220px;
  height: 100vh;
  background: rgba(10,10,10,0.95);
  color: #aaa;
  padding: 30px;
  z-index: 10;
}

.sidebar a {
  display: block;
  margin: 12px 0;
  color: #888;
  text-decoration: none;
}

.sidebar a:hover {
  color: #fff;
}

/* ===== 主区域 ===== */
.main {
  margin-left: 220px;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ===== 标题页 ===== */
.title-screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: black;
  z-index: 5;
}

.title-screen img {
  width: 420px;
  opacity: 0;
  animation: titleFade 2s ease forwards;
}

@keyframes titleFade {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== 主角页 ===== */
.character-screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 120px;
}

.char {
  text-align: center;
  cursor: pointer;
  transition: 0.4s;
}

.char img {
  width: 140px;
  border-radius: 50%;
}

.char:hover {
  transform: scale(1.1);
}

/* ===== 关系图 ===== */
.network-screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: none;
}

.network-container {
  position: relative;
  width: 100%;
  height: 100%;
}

.network-bg {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform 0.4s;
}

/* 放大状态 */
.zoomed {
  transform: scale(1.8);
  cursor: grab;
}

/* 放大按钮 */
.zoom-btn {
  position: absolute;
  top: 20px;
  right: 40px;
  z-index: 2;
}

.zoom-btn button {
  padding: 6px 10px;
  background: rgba(0,0,0,0.6);
  color: white;
  border: none;
  cursor: pointer;
}

/* ===== 人物点击点 ===== */
.node {
  position: absolute;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  cursor: pointer;
}

/* ===== 面板 ===== */
.panel {
  position: fixed;
  right: -400px;
  top: 0;
  width: 400px;
  height: 100vh;
  background: #111;
  padding: 30px;
  transition: 0.4s;
}

.panel.active {
  right: 0;
}

</style>
</head>

<body>

<div class="sidebar">
  <h2>Symphony Noir</h2>
  <a href="index.html">← Back</a>
</div>

<div class="main">

  <!-- ⭐ 标题 -->
  <div class="title-screen" onclick="enterCharacters()">
    <img src="images/title.png">
  </div>

  <!-- ⭐ 主角入口 -->
  <div class="character-screen" id="chars">

    <div class="char" onclick="enterNetwork()">
      <img src="images/yagami.png">
      <p>Yagami</p>
    </div>

    <div class="char" onclick="enterNetwork()">
      <img src="images/shin.png">
      <p>Shin</p>
    </div>

  </div>

  <!-- ⭐ 关系图 -->
  <div class="network-screen" id="network">

    <div class="zoom-btn">
      <button onclick="toggleZoom()">Zoom</button>
    </div>

    <div class="network-container">

      <img src="images/network.png" class="network-bg" id="net">

      <!-- 示例点击点 -->
      <div class="node" style="top:65%; left:28%;" onclick="openPanel('Yagami')"></div>
      <div class="node" style="top:65%; left:75%;" onclick="openPanel('Shin')"></div>

    </div>
  </div>

</div>

<div class="panel" id="panel">
  <h2 id="name"></h2>
  <button onclick="closePanel()">Close</button>
</div>

<script>

function enterCharacters() {
  document.querySelector(".title-screen").style.display = "none";
  document.getElementById("chars").style.display = "flex";
}

function enterNetwork() {
  document.getElementById("chars").style.display = "none";
  document.getElementById("network").style.display = "block";
}

function toggleZoom() {
  document.getElementById("net").classList.toggle("zoomed");
}

function openPanel(name) {
  document.getElementById("panel").classList.add("active");
  document.getElementById("name").innerText = name;
}

function closePanel() {
  document.getElementById("panel").classList.remove("active");
}

</script>

</body>
</html>
