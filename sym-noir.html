<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
  overflow:hidden;
}

/* ===== sidebar ===== */
.sidebar{
  position:fixed;
  width:220px;
  height:100vh;
  background:#0a0a0a;
  padding:30px;
  z-index:10;
}

.logo{
  width:80px;
  cursor:pointer;
  margin-bottom:20px;
}

.title{
  font-size:24px;
  margin-bottom:20px;
  cursor:pointer;
}

.nav-item{
  margin:10px 0;
  color:#666;
  cursor:pointer;
}

.nav-item.active{
  color:white;
}

/* ===== main ===== */
.main{
  margin-left:220px;
  height:100vh;
  position:relative;
}

/* ===== title ===== */
.title-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.title-screen img{
  width:760px;
  opacity:0;
  animation:fadeIn 2s forwards;
}

@keyframes fadeIn{
  to{opacity:1;}
}

.fade-out{
  animation:ghostOut 1.2s forwards;
}

@keyframes ghostOut{
  to{
    opacity:0;
    transform:translateY(-60px);
    filter:blur(6px);
  }
}

/* ===== characters ===== */
.character-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  gap:120px;
}

.char img{
  width:150px;
  border-radius:50%;
}

.fade-char{
  animation:ghostOut 1s forwards;
}

/* ENTER */
.enter-btn{
  font-size:12px;
  cursor:pointer;
  opacity:0.7;
}

.enter-btn:hover{
  opacity:1;
  transform:scale(1.1);
}

/* ===== network ===== */
.network-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  overflow:hidden;
}

.network-inner{
  width:100%;
  height:100%;
  cursor:grab;
  display:flex;
  align-items:center;
  justify-content:center;
}

.network-inner img{
  max-width:90%;
  max-height:90%;
  transition:0.1s;
}

/* ===== mobile ===== */
.mobile-logo{
  display:none;
  position:fixed;
  top:20px;
  left:20px;
  width:60px;
  z-index:20;
}

@media (max-width:768px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  .mobile-logo{display:block;}
}

</style>
</head>

<body>

<img src="logo.png" class="mobile-logo" onclick="goHome()">

<div class="sidebar">
  <img src="logo.png" class="logo" onclick="goHome()">
  <div class="title" onclick="showTitle()">Symphony Noir</div>

  <div class="nav-item active" id="nav-title">Title</div>
  <div class="nav-item" id="nav-char">Characters</div>
  <div class="nav-item" id="nav-net">Network</div>
</div>

<div class="main">

<div class="title-screen" id="title">
  <img src="images/title.png">
</div>

<div class="character-screen" id="chars">
  <div class="char"><img src="images/yagami.png"></div>
  <div class="enter-btn" id="enterBtn">ENTER</div>
  <div class="char"><img src="images/shin.png"></div>
</div>

<div class="network-screen" id="network">
  <div class="network-inner" id="viewer">
    <img src="images/network.png" id="netImg">
  </div>
</div>

</div>

<script>

/* ===== elements ===== */
const title = document.getElementById("title");
const chars = document.getElementById("chars");
const network = document.getElementById("network");

const navTitle = document.getElementById("nav-title");
const navChar = document.getElementById("nav-char");
const navNet = document.getElementById("nav-net");

/* ===== nav state ===== */
function setNav(t,c,n){
  navTitle.classList.toggle("active",t);
  navChar.classList.toggle("active",c);
  navNet.classList.toggle("active",n);
}

/* ===== navigation ===== */
function goHome(){
  window.location.href="index.html";
}

function showTitle(){
  title.style.display="flex";
  chars.style.display="none";
  network.style.display="none";
  setNav(true,false,false);
}

/* sidebar click */
navTitle.onclick = showTitle;

navChar.onclick = ()=>{
  title.style.display="none";
  chars.style.display="flex";
  network.style.display="none";
  setNav(false,true,false);
};

navNet.onclick = ()=>{
  title.style.display="none";
  chars.style.display="none";
  network.style.display="block";
  setNav(false,false,true);
};

/* ===== flow ===== */
title.onclick = ()=>{
  title.classList.add("fade-out");

  setTimeout(()=>{
    title.style.display="none";
    chars.style.display="flex";
    setNav(false,true,false);
  },1000);
};

document.getElementById("enterBtn").onclick = ()=>{
  chars.style.display="none";
  network.style.display="block";
  setNav(false,false,true);
};

/* ===== zoom & drag ===== */
let scale = 1;
let isDragging = false;
let startX, startY;

const img = document.getElementById("netImg");

/* zoom */
img.addEventListener("wheel", e=>{
  e.preventDefault();
  scale += e.deltaY * -0.001;
  scale = Math.min(Math.max(0.5,scale),3);
  img.style.transform = `scale(${scale})`;
});

/* drag */
img.addEventListener("mousedown", e=>{
  isDragging = true;
  startX = e.clientX;
  startY = e.clientY;
  img.style.cursor = "grabbing";
});

window.addEventListener("mouseup", ()=>{
  isDragging = false;
  img.style.cursor = "grab";
});

window.addEventListener("mousemove", e=>{
  if(!isDragging) return;

  const dx = e.clientX - startX;
  const dy = e.clientY - startY;

  img.style.transform = `translate(${dx}px,${dy}px) scale(${scale})`;
});

</script>

</body>
</html>
