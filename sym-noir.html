<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
  overflow:hidden;
}

/* ===== sidebar ===== */
.sidebar{
  position:fixed;
  width:220px;
  height:100vh;
  background:#0a0a0a;
  padding:30px;
  z-index:10;
}

.logo{
  width:80px;
  cursor:pointer;
  margin-bottom:20px;
}

.title{
  font-size:24px;
  margin-bottom:20px;
  cursor:pointer;
}

.nav-item{
  margin:10px 0;
  color:#666;
  cursor:pointer;
}

.nav-item.active{
  color:white;
}

/* ===== main ===== */
.main{
  margin-left:220px;
  height:100vh;
  position:relative;
}

/* ===== title ===== */
.title-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.title-screen img{
  width:760px;
  opacity:0;
  transform:translateY(40px);
  animation:titleIn 2s forwards;
}

@keyframes titleIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.fade-out{
  animation:ghostOut 1.4s forwards;
}

@keyframes ghostOut{
  to{
    opacity:0;
    filter:blur(8px);
    transform:translateY(-80px);
  }
}

/* ===== character ===== */
.character-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  gap:140px;
}

.char img{
  width:160px;
  border-radius:50%;
}

.fade-char{
  animation:ghostOut 1.2s forwards;
}

/* ENTER */
.enter-btn{
  font-size:12px;
  letter-spacing:2px;
  cursor:pointer;
  opacity:0.7;
  transition:0.3s;
}

.enter-btn:hover{
  opacity:1;
  transform:scale(1.1);
}

/* ===== network ===== */
.network-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  overflow:hidden;
}

.network-inner{
  position:absolute;
  transform-origin:center;
}

.network-bg{
  display:block;
}

/* ===== mobile ===== */
.mobile-logo{
  display:none;
  position:fixed;
  top:20px;
  left:20px;
  width:60px;
  z-index:20;
}

@media (max-width:768px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  .mobile-logo{display:block;}
}

</style>
</head>

<body>

<!-- mobile logo -->
<img src="logo.png" class="mobile-logo" onclick="goHome()">

<div class="sidebar">
  <img src="logo.png" class="logo" onclick="goHome()">

  <div class="title" onclick="reloadPage()">Symphony Noir</div>

  <div class="nav-item active" id="nav-title">Title</div>
  <div class="nav-item" id="nav-char">Characters</div>
  <div class="nav-item" id="nav-net">Network</div>
</div>

<div class="main">

<div class="title-screen" id="title">
  <img src="images/title.png">
</div>

<div class="character-screen" id="chars">
  <div class="char" id="yagami"><img src="images/yagami.png"></div>
  <div class="enter-btn" id="enterBtn">ENTER</div>
  <div class="char" id="shin"><img src="images/shin.png"></div>
</div>

<div class="network-screen" id="network">
  <div class="network-inner" id="inner">
    <img src="images/network.png" id="netImg" class="network-bg">
  </div>
</div>

</div>

<script>

/* ===== elements ===== */
const title = document.getElementById("title");
const chars = document.getElementById("chars");
const network = document.getElementById("network");

const yagami = document.getElementById("yagami");
const shin = document.getElementById("shin");

const navTitle = document.getElementById("nav-title");
const navChar = document.getElementById("nav-char");
const navNet = document.getElementById("nav-net");

const img = document.getElementById("netImg");
const inner = document.getElementById("inner");

/* ===== nav ===== */
function setNav(t,c,n){
  navTitle.classList.toggle("active",t);
  navChar.classList.toggle("active",c);
  navNet.classList.toggle("active",n);
}

function goHome(){window.location.href="index.html";}
function reloadPage(){location.reload();}

/* ===== flow ===== */
title.onclick = ()=>{
  title.classList.add("fade-out");

  setTimeout(()=>{
    title.style.display="none";
    chars.style.display="flex";
    setNav(false,true,false);
  },1200);
};

document.getElementById("enterBtn").onclick = ()=>{
  yagami.classList.add("fade-char");
  shin.classList.add("fade-char");

  setTimeout(()=>{
    chars.style.display="none";
    network.style.display="block";
    setNav(false,false,true);
  },900);
};

/* ===== camera ===== */
let scale=1, x=0, y=0;

img.onload = ()=>{
  resetView();
};

function resetView(){

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const iw = img.naturalWidth;
  const ih = img.naturalHeight;

  const s = Math.min(vw/iw, vh/ih);

  scale = s;

  x = (vw - iw*s)/2;
  y = (vh - ih*s)/2;

  // ⭐ 向下偏移（主角区）
  y -= vh * 0.1;

  update();
}

function update(){
  inner.style.transform =
    `translate(${x}px,${y}px) scale(${scale})`;
}

</script>

</body>
</html>
