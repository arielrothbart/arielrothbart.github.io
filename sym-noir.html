<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
  overflow:hidden;
}

/* ===== 左侧 ===== */
.sidebar{
  position:fixed;
  width:220px;
  height:100vh;
  background:rgba(10,10,10,0.95);
  padding:30px;
}

.logo{
  width:90px;
  cursor:pointer;
  opacity:0.8;
  transition:0.3s;
}
.logo:hover{
  opacity:1;
  transform:scale(1.05);
}

.title{
  font-size:22px;
  margin:20px 0;
  cursor:pointer;
}

.nav-item{
  margin:12px 0;
  color:#555;
  cursor:pointer;
}

.nav-item.active{
  color:white;
}

/* ===== 主区域 ===== */
.main{
  margin-left:220px;
  height:100vh;
  position:relative;
}

/* ===== 标题 ===== */
.title-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

.title-screen img{
  width:760px;
  opacity:0;
  transform:translateY(-40px);
  animation:titleIn 2.5s forwards;
}

@keyframes titleIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.fade-out{
  animation:titleOut 1.5s forwards;
}

@keyframes titleOut{
  to{
    opacity:0;
    filter:blur(6px);
    transform:translateY(60px);
  }
}

/* ===== 主角 ===== */
.character-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  gap:140px;
}

.char img{
  width:160px;
  border-radius:50%;
}

/* 消散 */
.fade-char{
  animation:fadeChar 1s forwards;
}

@keyframes fadeChar{
  to{
    opacity:0;
    transform:scale(0.6);
    filter:blur(6px);
  }
}

/* ENTER */
.enter-btn{
  font-size:12px;
  letter-spacing:2px;
  cursor:pointer;
  opacity:0.7;
  transition:0.3s;
}
.enter-btn:hover{
  opacity:1;
  letter-spacing:5px;
}

/* ===== 关系图 ===== */
.network-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  opacity:0;
  transition:1s;
}

.network-screen.show{
  opacity:1;
}

.network-inner{
  transform-origin:center;
}

.network-bg{
  width:120%;
  height:120%;
  object-fit:contain;
}

/* ===== 移动端 ===== */
@media (max-width:768px){

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
  }

  .mobile-logo{
    position:fixed;
    top:20px;
    left:20px;
    width:60px;
    z-index:10;
  }
}

</style>
</head>

<body>

<!-- PC侧栏 -->
<div class="sidebar">

  <img src="logo.png" class="logo" onclick="goHome()">

  <div class="title" onclick="reloadPage()">Symphony Noir</div>

  <div class="nav-item active" id="nav-title" onclick="goTitle()">Title</div>
  <div class="nav-item" id="nav-char" onclick="goChar()">Characters</div>
  <div class="nav-item" id="nav-net" onclick="goNet()">Network</div>

</div>

<!-- 手机logo -->
<img src="logo.png" class="mobile-logo" onclick="goHome()">

<div class="main">

<!-- 标题 -->
<div class="title-screen" id="title" onclick="enterCharacters()">
  <img src="images/title.png">
</div>

<!-- 主角 -->
<div class="character-screen" id="chars">

  <div class="char" id="yagami">
    <img src="images/yagami.png">
  </div>

  <div class="enter-btn" onclick="enterNetwork()">ENTER</div>

  <div class="char" id="shin">
    <img src="images/shin.png">
  </div>

</div>

<!-- 关系图 -->
<div class="network-screen" id="network">
  <div class="network-inner" id="inner">
    <img src="images/network.png" class="network-bg">
  </div>
</div>

</div>

<script>

/* ===== 导航 ===== */
function setNav(a,b,c){
  document.getElementById("nav-title").classList.toggle("active",a);
  document.getElementById("nav-char").classList.toggle("active",b);
  document.getElementById("nav-net").classList.toggle("active",c);
}

function goHome(){
  window.location.href="index.html";
}

function reloadPage(){
  location.reload();
}

function goTitle(){
  location.reload();
}

function goChar(){
  enterCharacters();
}

function goNet(){
  enterNetwork();
}

/* ===== 页面 ===== */
function enterCharacters(){
  document.getElementById("title").classList.add("fade-out");

  setTimeout(()=>{
    document.getElementById("title").style.display="none";
    document.getElementById("chars").style.display="flex";
    setNav(0,1,0);
  },1200);
}

function enterNetwork(){

  document.getElementById("yagami").classList.add("fade-char");
  document.getElementById("shin").classList.add("fade-char");

  setTimeout(()=>{
    document.getElementById("chars").style.display="none";
    document.getElementById("network").style.display="block";

    setTimeout(()=>{
      document.getElementById("network").classList.add("show");

      focusModern();

    },50);

    setNav(0,0,1);

  },800);
}

/* ===== 镜头系统 ===== */
let scale=1.2, x=0, y=0, dragging=false;

const inner=document.getElementById("inner");

/* ⭐ 进入时对焦 Modern */
function focusModern(){

  scale=1.3;

  x = -window.innerWidth * 0.15;
  y = -window.innerHeight * 0.25;

  update();
}

/* ⭐ 总览 */
function resetView(){
  scale=1;
  x=0;
  y=0;
  update();
}

/* 滚轮 */
document.addEventListener("wheel",e=>{
  scale+=e.deltaY*-0.001;
  scale=Math.min(Math.max(0.8,scale),2.5);
  update();
});

/* 拖动 */
document.addEventListener("mousedown",()=>dragging=true);
document.addEventListener("mouseup",()=>dragging=false);

document.addEventListener("mousemove",e=>{
  if(!dragging)return;
  x+=e.movementX;
  y+=e.movementY;
  update();
});

/* 点击复位 */
document.addEventListener("click",e=>{
  if(e.target.classList.contains("network-bg")){
    resetView();
  }
});

function update(){
  inner.style.transform=`translate(${x}px,${y}px) scale(${scale})`;
}

</script>

</body>
</html>
