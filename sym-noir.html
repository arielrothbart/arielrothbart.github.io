<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
  overflow:hidden;
}

/* ===== sidebar ===== */
.sidebar{
  position:fixed;
  width:220px;
  height:100vh;
  background:#0a0a0a;
  padding:30px;
  z-index:10;
}

.logo{width:80px;cursor:pointer;}
.title{font-size:24px;margin:20px 0;cursor:pointer;}

.nav-item{margin:10px 0;color:#666;cursor:pointer;}
.nav-item.active{color:white;}

/* ===== main ===== */
.main{margin-left:220px;height:100vh;position:relative;}

/* ===== title ===== */
.title-screen{
  position:absolute;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}

.title-screen img{
  width:760px;
  opacity:0;
  animation:fadeIn 2s forwards;
}

@keyframes fadeIn{to{opacity:1;}}

.fade-out{animation:ghostOut 1.2s forwards;}

@keyframes ghostOut{
  to{opacity:0;transform:translateY(-60px);filter:blur(6px);}
}

/* ===== story ===== */
.story-screen{
  position:absolute;width:100%;height:100%;
  display:none;align-items:center;justify-content:center;
  padding:80px;
  perspective:1200px;
}

.story-text{
  max-width:720px;
  line-height:2;
  font-size:15px;
  color:#ddd;
}

.story-text p{margin:0 0 1.6em 0;}
.story-text h2{margin-bottom:1.2em;}

.page-flip{animation:flipOut 0.5s ease;}
@keyframes flipOut{
  to{transform:rotateY(90deg);opacity:0;}
}

.page-in{animation:flipIn 0.5s ease;}
@keyframes flipIn{
  from{transform:rotateY(-90deg);opacity:0;}
}

.cursor::after{
  content:"|";
  animation:blink 1s infinite;
  margin-left:4px;
}

@keyframes blink{
  0%,100%{opacity:0;}
  50%{opacity:1;}
}

/* ===== mobile ===== */
.mobile-nav{display:none;}
.mobile-logo{
  display:none;position:fixed;bottom:90px;left:50%;
  transform:translateX(-50%);width:60px;z-index:50;
}

@media (max-width:768px){

  body{overflow:auto !important;}
  .sidebar{display:none !important;}
  .main{margin-left:0 !important;}

  .mobile-logo{display:block;}

  .story-screen{
    padding:30px 22px 100px 22px;
    align-items:flex-start;
  }

  .story-text{
    font-size:17px;
    line-height:2.1;
  }

  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:0;width:100%;height:70px;
    background:#0a0a0a;
    justify-content:space-around;align-items:center;
    font-size:14px;z-index:100;
  }

  .mobile-nav div{
    padding:10px 16px;
    color:#888;
  }

  .mobile-nav div:active{color:white;}
}

</style>
</head>

<body>

<div class="main">

<div class="title-screen" id="title">
  <img src="images/title.png">
</div>

<div class="story-screen" id="story">
  <div class="story-text cursor" id="storyText"></div>
</div>

</div>

<script>

const title = document.getElementById("title");
const story = document.getElementById("story");
const storyText = document.getElementById("storyText");

/* ===== 文本 ===== */
const cnText = `黑色交响建立在两段半架空的历史之上。

1980年代至千禧年前后的美国佛蒙特州。  
八神重英与菅原真，作为第二代日本移民，在这片寂静而寒冷的土地上生活。  

从小能够感知到鬼魂的菅原真在大学里教授神秘学，警官八神的身上则有一个古老又性格乖张的幽灵。
他们组成了为他人排忧解难的驱魔搭档，在一次次案件中化险为夷。
两人也逐渐发现，附身于八神身上的“恶灵”安东尼奥生前并不简单。

更早的年代。  
西班牙王朝正值鼎盛时。  

国王奥斯瓦尔多和其胞弟安东尼奥关系亲密。
二人在政治与战争上强强联手，堪称一代枭雄。 
但二人都在感情上是难言的弱者。

他们的王朝究竟为何在一夜之间覆灭？
又是怎样强烈的感情，让安东尼奥愤怒至极，
即便在死后也不愿离去，甘愿成为飘荡于世间500年的幽灵？

菅原真和八神深入马德里，只为探寻身上恶灵的故事。`;

const enText = `Symphony Noir unfolds across two intertwined histories.

Vermont, United States. Late 20th century.  
Yagami Shigefua and Sugahara Shin, second-generation Japanese immigrants, live in a quiet and unforgiving landscape.

Shin, able to perceive spirits since childhood, becomes a lecturer in the occult.  
Yagami, now a police officer, carries within him an ancient and temperamental presence.

Together, they take on cases that defy explanation, resolving the unseen disturbances left behind.  
With each case, they are drawn closer to the truth behind the entity inhabiting Yagami.

Antonio.

Centuries earlier.  
At the height of a Spanish dynasty.

King Osvaldo and his brother Antonio stand side by side, bound by power and ambition.  
They dominate politics and warfare, shaping their era.

Yet in matters of the heart, both remain vulnerable.

What force could bring such a dynasty to collapse overnight?  
What kind of emotion could drive Antonio into such fury  
that even death could not sever his will to remain?

Five hundred years later, he still lingers.

And so, they travel to Madrid.`;

/* ===== 打字机（按段） ===== */
function typeParagraphs(text){

  const paragraphs = text.split(/\n\s*\n/);
  storyText.innerHTML = "";

  let pIndex = 0;

  function typeNext(){
    if(pIndex >= paragraphs.length) return;

    const p = document.createElement("p");
    storyText.appendChild(p);

    let i = 0;
    const str = paragraphs[pIndex];

    function typeChar(){
      if(i < str.length){
        p.textContent += str[i];
        i++;
        setTimeout(typeChar, 10);
      }else{
        pIndex++;
        setTimeout(typeNext, 120);
      }
    }

    typeChar();
  }

  typeNext();
}

/* ===== 翻页 ===== */
let isEnglish = false;

function switchText(){
  storyText.classList.add("page-flip");

  setTimeout(()=>{
    storyText.classList.remove("page-flip");
    storyText.classList.add("page-in");

    isEnglish = !isEnglish;
    typeParagraphs(isEnglish ? enText : cnText);

  },400);
}

storyText.onclick = switchText;

/* ===== flow ===== */
title.onclick = ()=>{
  title.classList.add("fade-out");

  setTimeout(()=>{
    title.style.display="none";
    story.style.display="flex";
    typeParagraphs(cnText);
  },1000);
};

</script>

</body>
</html>
