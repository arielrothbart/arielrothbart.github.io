<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<style>
/* ===== 基础 ===== */
body {
  margin: 0;
  font-family: "Times New Roman", serif;
  background: #e9e9e9;
  color: #222;
  overflow: hidden;
}

/* ===== 左侧导航 ===== */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 220px;
  height: 100vh;
  background: rgba(20,20,20,0.9);
  color: #ccc;
  padding: 30px 20px;
  box-sizing: border-box;
}

.sidebar h1 {
  font-size: 20px;
  margin-bottom: 30px;
  letter-spacing: 1px;
}

.sidebar a {
  display: block;
  margin: 10px 0;
  color: #aaa;
  text-decoration: none;
  transition: 0.3s;
}

.sidebar a:hover {
  color: #fff;
}

/* ===== 主区域 ===== */
.main {
  margin-left: 220px;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ===== 关系图容器 ===== */
.network-container {
  position: relative;
  width: 100%;
  height: 100%;
}

/* 背景图 */
.network-bg {
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0.9;
  filter: contrast(1.05);
}

/* ===== 人物点击区域 ===== */
.node {
  position: absolute;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  cursor: pointer;
  transition: 0.3s;
}

.node:hover {
  transform: scale(1.1);
  box-shadow: 0 0 15px rgba(255,255,255,0.6);
}

/* 非激活淡化 */
.dimmed {
  opacity: 0.2;
}

/* ===== 关系线（预留） ===== */
.line {
  position: absolute;
  height: 2px;
  background: rgba(0,0,0,0.3);
}

.line.love { background: rgba(200,80,80,0.6); }
.line.family { background: rgba(80,120,200,0.6); }
.line.power { background: rgba(0,0,0,0.5); }

/* 高亮 */
.line.active {
  box-shadow: 0 0 8px rgba(255,255,255,0.8);
}

/* ===== 右侧人物卡 ===== */
.character-panel {
  position: fixed;
  right: -400px;
  top: 0;
  width: 400px;
  height: 100vh;
  background: #111;
  color: #eee;
  padding: 30px;
  box-sizing: border-box;
  transition: 0.4s;
}

.character-panel.active {
  right: 0;
}

.character-panel h2 {
  margin-top: 0;
}

.close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  cursor: pointer;
}

/* ===== 顶部控制 ===== */
.top-bar {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 10;
}

.top-bar button {
  margin-left: 10px;
  padding: 6px 10px;
  border: none;
  background: rgba(0,0,0,0.6);
  color: #fff;
  cursor: pointer;
}

.top-bar button:hover {
  background: #444;
}
</style>
</head>

<body>

<!-- 左侧导航 -->
<div class="sidebar">
  <h1>Symphony Noir</h1>
  <a href="index.html">← Back</a>

  <a href="#">Overview</a>
  <a href="#">Timeline</a>
  <a href="#">Character Network</a>

  <br>

  <a href="#">Ghost in Vermont</a>
  <a href="#">Fuocoammare</a>
</div>

<!-- 主区域 -->
<div class="main">

  <!-- 关系筛选 -->
  <div class="top-bar">
    <button onclick="filterLines('all')">All</button>
    <button onclick="filterLines('love')">Love</button>
    <button onclick="filterLines('family')">Family</button>
  </div>

  <div class="network-container">

    <!-- 替换成你的关系图 -->
    <img src="images/network.png" class="network-bg">

    <!-- ===== 示例人物节点（你要根据图的位置调整） ===== -->
    <div class="node" style="top:55%; left:35%;" 
         data-name="Synon"
         data-info="Consultant Detective. Connected to multiple timelines."
         onmouseenter="highlight(this)"
         onmouseleave="resetHighlight()"
         onclick="openPanel(this)">
    </div>

    <div class="node" style="top:55%; left:70%;" 
         data-name="Sugahara"
         data-info="Occultism professor. Deep ties to past."
         onmouseenter="highlight(this)"
         onmouseleave="resetHighlight()"
         onclick="openPanel(this)">
    </div>

  </div>
</div>

<!-- 右侧人物面板 -->
<div class="character-panel" id="panel">
  <div class="close-btn" onclick="closePanel()">✕</div>
  <h2 id="charName">Name</h2>
  <p id="charInfo">Info</p>
</div>

<script>

/* ===== hover 高亮 ===== */
function highlight(el) {
  document.querySelectorAll('.node').forEach(n => {
    n.classList.add('dimmed');
  });
  el.classList.remove('dimmed');
}

/* reset */
function resetHighlight() {
  document.querySelectorAll('.node').forEach(n => {
    n.classList.remove('dimmed');
  });
}

/* ===== 打开人物卡 ===== */
function openPanel(el) {
  document.getElementById("panel").classList.add("active");
  document.getElementById("charName").innerText = el.dataset.name;
  document.getElementById("charInfo").innerText = el.dataset.info;
}

/* 关闭 */
function closePanel() {
  document.getElementById("panel").classList.remove("active");
}

/* ===== 关系筛选 ===== */
function filterLines(type) {
  document.querySelectorAll('.line').forEach(line => {
    if (type === 'all') {
      line.style.display = 'block';
    } else {
      line.style.display = line.classList.contains(type) ? 'block' : 'none';
    }
  });
}

</script>

</body>
</html>
