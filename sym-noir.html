<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony Noir</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

/* ===== 基础 ===== */
body{
  margin:0;
  background:black;
  color:white;
  overflow:hidden;
}

/* ===== 左侧 ===== */
.sidebar{
  position:fixed;
  width:220px;
  height:100vh;
  background:rgba(10,10,10,0.95);
  padding:30px;
}

.logo{
  width:90px;
  cursor:pointer;
  opacity:0.8;
}

.title{
  margin-top:20px;
  color:#aaa;
}

.nav-item{
  margin:10px 0;
  color:#555;
  cursor:pointer;
}

.nav-item.active{
  color:white;
}

/* ===== 主区域 ===== */
.main{
  margin-left:220px;
  height:100vh;
  position:relative;
  overflow:hidden;
}

/* ===== 标题（电影感） ===== */
.title-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

.title-screen img{
  width:700px;
  opacity:0;
  transform:translateY(-30px);
  animation:titleIn 2.5s ease forwards;
}

@keyframes titleIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* 消散 */
.title-screen.fade-out{
  animation:titleOut 1.5s forwards;
}

@keyframes titleOut{
  0%{opacity:1; filter:blur(0);}
  100%{
    opacity:0;
    filter:blur(6px);
    transform:translateY(40px);
  }
}

/* ===== 主角 ===== */
.character-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  gap:140px;
}

.char{
  transition:1.2s ease;
}

.char img{
  width:160px;
  border-radius:50%;
}

/* 飞入 */
.fly{
  transform:translate(-50vw,20vh) scale(0.35);
}

/* ===== ENTER ===== */
.enter-btn{
  font-family:'Special Elite',cursive;
  font-size:12px;
  letter-spacing:2px;
  opacity:0.7;
  cursor:pointer;
  transition:0.3s;
}

.enter-btn:hover{
  opacity:1;
  letter-spacing:5px;
}

/* ===== 关系图 ===== */
.network-screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  opacity:0;
  transition:1s;
}

.network-screen.show{
  opacity:1;
}

.network-inner{
  width:100%;
  height:100%;
  transform-origin:center;
  transition:0.1s;
}

.network-bg{
  width:120%;
  height:120%;
  object-fit:contain;
}

/* ===== 面板 ===== */
.panel{
  position:fixed;
  right:-400px;
  top:0;
  width:400px;
  height:100vh;
  background:#111;
  padding:30px;
  transition:0.4s;
  z-index:50;
}

.panel.active{
  right:0;
}

.panel button{
  position:absolute;
  top:20px;
  right:20px;
}

</style>
</head>

<body>

<div class="sidebar">

  <img src="logo.png" class="logo" onclick="location.reload()">

  <div class="title">Symphony Noir</div>

  <div class="nav-item active">Title</div>
  <div class="nav-item">Characters</div>
  <div class="nav-item">Network</div>

</div>

<div class="main">

<!-- 标题 -->
<div class="title-screen" onclick="enterCharacters()" id="title">
  <img src="images/title.png">
</div>

<!-- 主角 -->
<div class="character-screen" id="chars">

  <div class="char" id="yagami">
    <img src="images/yagami.png">
  </div>

  <div class="enter-btn" onclick="enterNetwork()">ENTER</div>

  <div class="char" id="shin">
    <img src="images/shin.png">
  </div>

</div>

<!-- 关系图 -->
<div class="network-screen" id="network">

  <div class="network-inner" id="inner">
    <img src="images/network.png" class="network-bg">
  </div>

</div>

</div>

<div class="panel" id="panel">
  <h2 id="name"></h2>
  <button onclick="closePanel()">Close</button>
</div>

<script>

/* ===== 标题 → 主角 ===== */
function enterCharacters(){
  const t=document.getElementById("title");
  t.classList.add("fade-out");

  setTimeout(()=>{
    t.style.display="none";
    document.getElementById("chars").style.display="flex";
  },1200);
}

/* ===== 主角 → 网络 ===== */
function enterNetwork(){

  document.getElementById("yagami").classList.add("fly");
  document.getElementById("shin").classList.add("fly");

  setTimeout(()=>{
    document.getElementById("network").style.display="block";
    setTimeout(()=>{
      document.getElementById("network").classList.add("show");
    },50);
  },800);
}

/* ===== 面板 ===== */
function closePanel(){
  document.getElementById("panel").classList.remove("active");
}

/* ===== 缩放拖动（重写稳定版） ===== */
let scale=1, x=0, y=0, dragging=false;
const inner=document.getElementById("inner");

document.addEventListener("wheel",e=>{
  scale+=e.deltaY*-0.001;
  scale=Math.min(Math.max(0.8,scale),2.5);
  update();
});

document.addEventListener("mousedown",e=>{
  dragging=true;
});

document.addEventListener("mousemove",e=>{
  if(!dragging)return;
  x+=e.movementX;
  y+=e.movementY;
  update();
});

document.addEventListener("mouseup",()=>dragging=false);

/* 点击回位 */
document.addEventListener("dblclick",()=>{
  scale=1;
  x=0;
  y=0;
  update();
});

function update(){
  inner.style.transform=
    `translate(${x}px,${y}px) scale(${scale})`;
}

</script>

</body>
</html>
