<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Comics</title>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  background:#1a1a1a;
  font-family:Arial, sans-serif;
  color:white;
}

  /*home logo*/
  .home-logo {
  position: fixed;
  top: 80px;
  right: 60px;
  z-index: 1000;
}

.home-logo img {
  width: 80px;
  opacity: 0.8;
  transition: 0.3s;
}

.home-logo img:hover {
  opacity: 1;
  transform: scale(1.08);
}
  
/* 页面标题 */
.title{
  text-align:center;
  padding:40px 0 10px;
  font-size:18px;
  letter-spacing:3px;
  opacity:0.6;
}

/* 书架背景 */
.bookshelf{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:60px;
  padding:60px;
  position:relative;
}

/* 木板（视觉层） */
.bookshelf::after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:20px;
  background:linear-gradient(#3a2a1f, #2a1e16);
  box-shadow:0 -5px 15px rgba(0,0,0,0.5);
}

/* 每本书 */
.book{
  width:160px;
  text-decoration:none;
  color:white;
  text-align:center;
  perspective:800px;
}

/* 封面 */
.book img{
  width:100%;
  border-radius:4px;
  box-shadow:0 15px 30px rgba(0,0,0,0.6);
  transform:rotateY(-15deg);
  transition:0.3s;
}

/* hover效果 */
.book:hover img{
  transform:rotateY(0deg) translateY(-10px) scale(1.05);
}

/* 标题 */
/* 默认（备用） */
.book-title{
  margin-top:12px;
  font-size:14px;
  letter-spacing:1px;
  opacity:0.7;
}

/* 第一部：阴郁手写感 */
.book-gloom .book-title{
  font-family: 'Amatic SC', cursive;
  font-size:26px;
  letter-spacing:2px;
}

/* 第二部：科幻感 */
.book-sci .book-title{
  font-family: 'Orbitron', sans-serif;
  font-size:14px;
  letter-spacing:2px;
  text-transform:uppercase;
}
</style>

</head>

<body>
  
<a href="index.html" class="home-logo">
  <img src="logo.png">
</a>
<div class="title">COMICS</div>

<div class="bookshelf">

  <!-- 漫画 01 -->
 <a href="comic-01.html" class="book book-gloom">
  <img src="images/comic01-cover.jpg">
  <div class="book-title">Valley of Gloom</div>
</a>

  <!-- 漫画 02（可以删掉或替换） -->
 <a href="comic-02.html" class="book book-sci">
  <img src="images/comic02-cover.jpg">
  <div class="book-title">Rhapsody in Neon</div>
</a>

</div>

</body>
</html>
