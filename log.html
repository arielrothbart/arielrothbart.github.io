<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain's Log</title>
    <link rel="stylesheet" href="global.css">

    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #58a6ff;
            /* 回归经典的赛博蓝 */
            --text-color: #ffffff;
            --secondary-text: rgba(255, 255, 255, 0.6);
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            scroll-behavior: smooth;
        }

        /* 扫描线 */
        body::before {
            content: " ";
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.4;
        }

        /* --- 侧边栏 --- */
        #nav-container {
            width: 280px;
            height: 100vh;
            position: sticky;
            top: 0;
            border-right: 1px solid rgba(88, 166, 255, 0.2);
            padding: 60px 30px;
            box-sizing: border-box;
            overflow-y: auto;
            background: black;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .nav-title {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--accent-color);
            opacity: 0.6;
            margin-bottom: 30px;
        }

        #nav-links a {
            display: block;
            color: var(--secondary-text);
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        #nav-links a:hover {
            color: var(--accent-color);
            transform: translateX(5px);
        }

        /* --- 主内容 --- */
        main {
            flex: 1;
            padding: 60px 40px;
            max-width: 800px;
        }

        .post {
            margin-bottom: 100px;
            animation: fadeIn 1s ease-out;
        }

        .post.pinned {
            border-left: 2px solid var(--accent-color);
            padding-left: 30px;
            background: rgba(88, 166, 255, 0.03);
            padding-top: 20px;
            padding-bottom: 20px;
        }

        .date {
            font-size: 11px;
            color: var(--accent-color);
            letter-spacing: 2px;
            opacity: 0.8;
        }

        h2 {
            font-size: 18px;
            letter-spacing: 3px;
            margin: 15px 0;
        }

        p {
            line-height: 1.8;
            opacity: 0.8;
            font-size: 15px;
        }

        .sketch-box {
            display: flex;
            flex-direction: column;
            /* 图片垂直排列 */
            gap: 20px;
            /* 图片之间的间距 */
            margin-top: 25px;
        }

        .sketch-box img {
            width: 100%;
            max-width: 100%;
            /* 确保不超出容器 */
            height: auto;
            border: 1px solid #222;
            transition: transform 0.3s ease;
        }

        .sketch-box img:hover {
            transform: scale(1.01);
            /* 鼠标悬停微调，增加互动感 */
        }

        /* 查看器背景 */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        /* 查看器里的图片 */
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        /* 让列表中的缩略图看起来像可以点击的样子 */
        .sketch-box img {
            cursor: zoom-in;
        }

        /* --- 手机端组件 --- */
        #menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: var(--accent-color);
            color: black;
            border: none;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
        }

        /* --- 统一按钮 --- */
        .home-logo {
            position: fixed;
            top: 60px;
            right: 60px;
            z-index: 1000;
        }

        .home-logo img {
            width: 80px;
            opacity: 0.7;
            transition: 0.3s;
        }

        .scroll-top {
            position: fixed;
            right: 60px;
            bottom: 60px;
            width: 48px;
            height: 48px;
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            cursor: pointer;
            opacity: 0;
            transition: 0.4s;
            z-index: 1000;
            text-shadow: 0 0 8px var(--accent-color);
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.2);
        }

        .scroll-top.show {
            opacity: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            #menu-toggle {
                display: block;
            }

            #nav-container {
                position: fixed;
                transform: translateX(-100%);
                width: 240px;
            }

            #nav-container.active {
                transform: translateX(0);
            }

            main {
                padding: 80px 25px;
            }

            .home-logo {
                top: 20px;
                right: 20px;
            }

            .home-logo img {
                width: 48px;
            }

            .scroll-top {
                right: 20px;
                bottom: 20px;
            }
        }
    </style>
</head>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="close-btn">&times;</span>
    <img id="lightbox-img" src="" alt="">
</div>

<body>

    <button id="menu-toggle" onclick="toggleMenu()">MENU</button>

    <nav id="nav-container">
        <div class="nav-title">LOG_DATABASE</div>
        <div id="nav-links"></div>
    </nav>

    <main id="log-content"></main>

    <a href="index.html" class="home-logo"><img src="logo.png"></a>
    <div class="scroll-top" id="scrollTop">↑</div>

    <script>
    // --- 1. 全局状态（新增：用于支持图片放大功能） ---
    let allImages = []; 

    // --- 2. 自动加载 JSON 数据（保留自你的原代码） ---
    async function loadLogs() {
        try {
            const response = await fetch('logs.json');
            const data = await response.json();
            renderLogs(data);
        } catch (err) {
            console.error("加载日志失败，请检查 logs.json 是否在同一目录下", err);
        }
    }

    // --- 3. 渲染日志（在你的原逻辑基础上，升级了图片点击功能） ---
    function renderLogs(logs) {
        const contentArea = document.getElementById('log-content');
        const navArea = document.getElementById('nav-links');

        logs.forEach(log => {
            // 生成导航链接 (完全保留)
            const link = document.createElement('a');
            link.href = `#${log.id}`;
            link.innerText = `# ${log.title}`;
            link.onclick = () => { if (window.innerWidth <= 768) toggleMenu(); };
            navArea.appendChild(link);

            // 处理图片逻辑 (升级：加入点击放大指令)
            let imagesHtml = '';
            if (log.images && Array.isArray(log.images)) {
                log.images.forEach(imgSrc => {
                    allImages.push(imgSrc); // 存入图库
                    const currentIdx = allImages.length - 1;
                    imagesHtml += `<img src="${imgSrc}" style="margin-bottom: 15px; cursor:zoom-in;" onclick="openLightbox(${currentIdx})">`;
                });
            } else if (log.image) { 
                allImages.push(log.image);
                const currentIdx = allImages.length - 1;
                imagesHtml = `<img src="${log.image}" style="cursor:zoom-in;" onclick="openLightbox(${currentIdx})">`;
            }

            // 生成日志内容 (完全保留你的 HTML 结构)
            const section = document.createElement('section');
            section.id = log.id;
            section.className = `post ${log.type === 'pinned' ? 'pinned' : ''}`;

            section.innerHTML = `
                <span class="date">${log.date}</span>
                <h2>${log.title}</h2>
                <p>${log.content}</p>
                ${imagesHtml ? `<div class="sketch-box">${imagesHtml}</div>` : ''}
            `;
            contentArea.appendChild(section);
        });
    }

    // --- 4. Lightbox 逻辑（新增：控制图片放大和关闭） ---
    function openLightbox(index) {
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');
        lb.style.display = 'flex';
        lbImg.src = allImages[index];
        document.body.style.overflow = 'hidden'; // 放大时禁止背景网页滚动
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
        document.body.style.overflow = 'auto'; // 关闭时恢复滚动
    }

    // --- 5. 手机端菜单切换（完全保留自你的原代码） ---
    function toggleMenu() {
        document.getElementById('nav-container').classList.toggle('active');
    }

    // --- 6. 回顶部逻辑（完全保留自你的原代码） ---
    const scrollBtn = document.getElementById('scrollTop');
    window.onscroll = () => {
        if (window.scrollY > 300) scrollBtn.classList.add('show');
        else scrollBtn.classList.remove('show');
    };
    scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    // --- 7. 初始化启动 ---
    loadLogs();
</script>

</body>

</html>
