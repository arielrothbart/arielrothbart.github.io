<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Captain's Log</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            scroll-behavior: smooth;
        }

        /* 扫描线效果 */
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* 进入动画 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 左侧导航 */
        nav {
            width: 250px;
            height: 100vh;
            position: sticky;
            top: 0;
            border-right: 1px solid #30363d;
            padding: 20px;
            overflow-y: auto;
        }

        nav a {
            display: block;
            color: var(--text-color);
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 0.9em;
            transition: color 0.3s;
        }

        nav a:hover { color: var(--accent-color); }

        /* 右侧内容 */
        main {
            flex: 1;
            padding: 40px;
            animation: fadeInUp 1s ease-out;
        }

        section {
            margin-bottom: 100px;
            border-bottom: 1px dashed #30363d;
            padding-bottom: 50px;
        }

        .sketch-placeholder {
            background: #161b22;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 600px;
            height: 300px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 悬浮按钮组 */
        .controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
        }
    </style>
</head>
<body>

</body>
</html>
