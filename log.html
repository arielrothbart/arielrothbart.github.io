<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain's Log</title>
    <link rel="stylesheet" href="global.css">

    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #58a6ff;
            /* 回归经典的赛博蓝 */
            --text-color: #ffffff;
            --secondary-text: rgba(255, 255, 255, 0.6);
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            scroll-behavior: smooth;
        }

        /* 扫描线 */
        body::before {
            content: " ";
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.4;
        }

        /* --- 侧边栏 --- */
        #nav-container {
            width: 280px;
            height: 100vh;
            position: sticky;
            top: 0;
            border-right: 1px solid rgba(88, 166, 255, 0.2);
            padding: 60px 30px;
            box-sizing: border-box;
            overflow-y: auto;
            background: black;
            z-index: 100;
            transition: transform 0.3s ease;

            display: flex;
            flex-direction: column;
        }

        .nav-title {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--accent-color);
            opacity: 0.6;
            margin-bottom: 30px;
        }

        #nav-links a {
            display: block;
            color: var(--secondary-text);
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        #nav-links a:hover {
            color: var(--accent-color);
            transform: translateX(5px);
        }

        /* --- 1. 头像样式 --- */
        /* --- 1. 头像+气泡容器样式 --- */
        .avatar-wrapper {
            position: relative;
            /* 关键：作为气泡定位的基准 */
            display: inline-block;
            /* 保持左对齐 */
            width: 90px;
            height: 90px;
            margin: 0 0 25px 0;
            /* 与下方标题留出间距 */
            cursor: default;
            /* 既然不是功能按钮，鼠标默认即可 */
        }

        /* 头像本身 */
        .user-avatar {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: none;
            /* 严厉禁止灰色滤镜，默认原彩 */
            transition: transform 0.2s ease;
        }

        /* 当鼠标悬停在容器上时，头像极轻微放大反馈 */
        .avatar-wrapper:hover .user-avatar {
            transform: scale(1.02);
        }

        /* --- 2. 漫画气泡样式 (默认隐藏) --- */
        .chat-bubble {
            position: absolute;
            /* 定位到头像的右上方 */
            top: -10px;
            left: 80px;

            /* 赛博感气泡：黑底蓝字，带点透明度 */
            background: rgba(0, 0, 0, 0.9);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 12px;
            font-size: 11px;
            font-family: monospace;
            /* 模拟终端字体 */
            letter-spacing: 1px;
            white-space: nowrap;
            /* 防止文字换行 */
            z-index: 10;

            /* 核心过渡：默认隐藏，设置透明度和位移 */
            opacity: 0;
            visibility: hidden;
            /* 彻底隐藏 */
            transform: translateY(10px);
            /* 默认往下偏移一点，准备滑入 */
            transition: opacity 0.3s ease, transform 0.3s ease;

            /* 赛博感小装饰：呼吸灯发光 */
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.3);
        }

        /* 气泡的小三角 (赛博风格) */
        .chat-bubble::after {
            content: "";
            position: absolute;
            bottom: -6px;
            /* 贴在底部 */
            left: 10px;
            /* 靠左一点 */
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid var(--accent-color);
            /* 用硬边描边做三角 */
        }

        /* --- 3. 悬停互动逻辑 --- */
        /* 当鼠标悬停在容器上时，气泡淡入并滑入归位 */
        .avatar-wrapper:hover .chat-bubble {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            /* 滑回原位 */
        }

        .user-avatar-btn:hover {
            transform: scale(1.02);
            /* 极轻微的缩放，不浮夸 */

            /* 按照要求：8px 无扩散外发光描边 (模拟描边效果) */
            /* 使用 box-shadow 的第四个参数（扩张半径）来实现无扩散的硬边感 */
            box-shadow: 0 0 0 2px var(--accent-color);
            /* 或者如果你喜欢柔和一点的 8px 硬边： */
            /* filter: drop-shadow(0 0 4px var(--accent-color)); */
        }

        /* --- 2. 标题 --- */
        .nav-title {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--accent-color);
            opacity: 0.6;
            margin-bottom: 20px;
        }

        /* --- 3. 链接区域（这是负责滚动的地方） --- */
        #nav-links {
            flex: 1;
            /* 占用剩余的所有空间 */
            overflow-y: auto;
            /* 数量多时自动出现滚动条 */
            padding-right: 10px;
            /* 给滚动条留点空隙 */
        }

        /* 链接区域的滚动条美化（变得细细的，不晃眼） */
        #nav-links::-webkit-scrollbar {
            width: 4px;
        }

        #nav-links::-webkit-scrollbar-thumb {
            background: var(--accent-color);
        }

        #nav-links::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        /* --- 4. 底部装饰 --- */
        .nav-footer {
            margin-top: 20px;
            font-family: monospace;
            font-size: 10px;
            color: var(--accent-color);
            opacity: 0.3;
            line-height: 1.5;
        }

        /* --- 主内容 --- */
        main {
            flex: 1;
            padding: 60px 40px;
            max-width: 800px;
        }

        .post {
            margin-bottom: 100px;
            animation: fadeIn 1s ease-out;
        }

        .post.pinned {
            border-left: 2px solid var(--accent-color);
            padding-left: 30px;
            background: rgba(88, 166, 255, 0.03);
            padding-top: 20px;
            padding-bottom: 20px;
        }

        .date {
            font-size: 11px;
            color: var(--accent-color);
            letter-spacing: 2px;
            opacity: 0.8;
        }

        h2 {
            font-size: 18px;
            letter-spacing: 3px;
            margin: 15px 0;
        }

        p {
            line-height: 1.8;
            opacity: 0.8;
            font-size: 15px;
        }

        /* 图片容器：改为网格模式 */
        .sketch-box {
            display: grid;
            gap: 8px;
            /* 图片间距 */
            margin-top: 25px;
            /* 默认两列，如果是4张图效果最好 */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            max-width: 600px;
            /* 限制缩略图总宽度，不让它铺满全屏 */
        }

        /* 缩略图统一规格 */
        .sketch-box img {
            width: 100%;
            height: 200px;
            /* 固定高度，确保对齐 */
            object-fit: cover;
            /* 核心：图片自动裁剪填充，不拉伸变形 */
            border: 1px solid rgba(88, 166, 255, 0.2);
            cursor: zoom-in;
            transition: 0.3s;
        }

        .sketch-box img:hover {
            filter: brightness(1.2);
            border-color: var(--accent-color);
        }

        /* 如果只有一张图，让它显示得稍大一些 */
        .sketch-box img:only-child {
            height: auto;
            max-height: 400px;
            object-fit: contain;
        }

        /* 查看器背景 */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }


        /* 查看器里的图片：基础样式 */
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            /* 缩短一点时间，0.3s 显得更干脆不拖沓 */
            transition: all 0.3s ease-in-out;
            opacity: 1;
            transform: translateX(0);
        }

        /* 状态 A：离开时的状态（向左滑出并消失） */
        .img-leave {
            opacity: 0 !important;
            transform: translateX(-30px) !important;
        }

        /* 状态 B：进入前的瞬间状态（先瞬移到右边，准备滑入） */
        .img-enter {
            transition: none !important;
            /* 瞬移时不需要动画 */
            opacity: 0 !important;
            transform: translateX(30px) !important;
        }

        /* 切换时的低调状态：只有轻微的淡出和平移 */
        .img-switching {
            opacity: 0;
            transform: translateX(-20px);
            /* 轻轻向左滑出 */
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        /* 让列表中的缩略图看起来像可以点击的样子 */
        .sketch-box img {
            cursor: zoom-in;
        }

        /* --- 手机端组件 --- */
        #menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: var(--accent-color);
            color: black;
            border: none;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
        }

        /* --- 统一按钮 --- */
        .home-logo {
            position: fixed;
            top: 60px;
            right: 60px;
            z-index: 1000;
        }

        .home-logo img {
            width: 80px;
            opacity: 0.7;
            transition: 0.3s;
        }

        .scroll-top {
            position: fixed;
            right: 60px;
            bottom: 60px;
            width: 48px;
            height: 48px;
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            cursor: pointer;
            opacity: 0;
            transition: 0.4s;
            z-index: 1000;
            text-shadow: 0 0 8px var(--accent-color);
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.2);
        }

        .scroll-top.show {
            opacity: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
            }
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-color);
            font-size: 40px;
            padding: 20px;
            cursor: pointer;
            user-select: none;
            transition: 0.3s;
            z-index: 2100;
        }

        .nav-btn:hover {
            color: #ffffff;
            text-shadow: 0 0 10px var(--accent-color);
        }

        .prev {
            left: 20px;
        }

        .next {
            right: 20px;
        }

        @media (max-width: 768px) {
            #menu-toggle {
                display: block;
            }

            #nav-container {
                position: fixed;
                transform: translateX(-100%);
                width: 240px;
            }

            #nav-container.active {
                transform: translateX(0);
            }

            main {
                padding: 80px 25px;
            }

            .home-logo {
                top: 20px;
                right: 20px;
            }

            .home-logo img {
                width: 48px;
            }

            .scroll-top {
                right: 20px;
                bottom: 20px;
            }
        }
    </style>
</head>

<div id="lightbox" class="lightbox">
    <span class="close-btn" onclick="closeLightbox()">&times;</span>

    <div class="nav-btn prev" onclick="changeImage(-1); event.stopPropagation();">&#10094;</div>

    <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation();">

    <div class="nav-btn next" onclick="changeImage(1); event.stopPropagation();">&#10095;</div>
</div>

<body>

    <button id="menu-toggle" onclick="toggleMenu()">MENU</button>

    <nav id="nav-container">
        <div class="avatar-wrapper">
            <img src="images/log/avatar.png" alt="Avatar" class="user-avatar">

            <div class="chat-bubble">Hi!</div>
        </div>
        <div class="nav-title">LOG_DATABASE</div>
        <div id="nav-links"></div>

        <div class="nav-footer">
            STATUS: SYSTEM_ACTIVE<br>
            LOC: ORBITAL_STATION_04
        </div>
    </nav>

    <main id="log-content"></main>

    <a href="index.html" class="home-logo"><img src="logo.png"></a>
    <div class="scroll-top" id="scrollTop">↑</div>

    <script>
        // --- 1. 全局状态 ---
        let allImages = [];
        let currentImgIndex = 0;

        // --- 2. 自动加载 JSON 数据 ---
        async function loadLogs() {
            try {
                const response = await fetch('logs.json');
                const data = await response.json();
                renderLogs(data);
            } catch (err) {
                console.error("加载日志失败", err);
            }
        }

        // --- 3. 渲染日志 ---
        function renderLogs(logs) {
            const contentArea = document.getElementById('log-content');
            const navArea = document.getElementById('nav-links');

            logs.forEach(log => {
                const link = document.createElement('a');
                link.href = `#${log.id}`;
                link.innerText = `# ${log.title}`;
                link.onclick = () => { if (window.innerWidth <= 768) toggleMenu(); };
                navArea.appendChild(link);

                let imagesHtml = '';
                // 提取图片逻辑
                const logImgs = log.images || (log.image ? [log.image] : []);

                logImgs.forEach(imgSrc => {
                    allImages.push(imgSrc);
                    const currentIdx = allImages.length - 1;
                    imagesHtml += `<img src="${imgSrc}" onclick="openLightbox(${currentIdx})">`;
                });

                const section = document.createElement('section');
                section.id = log.id;
                section.className = `post ${log.type === 'pinned' ? 'pinned' : ''}`;
                section.innerHTML = `
                <span class="date">${log.date}</span>
                <h2>${log.title}</h2>
                <p>${log.content}</p>
                ${imagesHtml ? `<div class="sketch-box">${imagesHtml}</div>` : ''}
            `;
                contentArea.appendChild(section);
            });
        }

        // --- 4. Lightbox 核心逻辑 (修复点击无反应看这里) ---
        function changeImage(step) {
            const lbImg = document.getElementById('lightbox-img');

            // 1. 先触发“离开”动画
            lbImg.classList.add('img-leave');

            // 2. 等离开动画做完 (300ms)
            setTimeout(() => {
                // 换图
                currentImgIndex = (currentImgIndex + step + allImages.length) % allImages.length;
                lbImg.src = allImages[currentImgIndex];

                // 3. 换图后，立刻切换到“进入前”的状态 (瞬移到右侧 30px 处)
                lbImg.classList.remove('img-leave');
                lbImg.classList.add('img-enter');

                // 4. 强行让浏览器刷新一下状态 (Reflow)
                lbImg.offsetWidth;

                // 5. 移除“进入”类，图片会自动根据 transition 效果平滑回到 translateX(0)
                lbImg.classList.remove('img-enter');
            }, 300);
        }

        function openLightbox(index) {
            currentImgIndex = index;
            const lb = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = allImages[currentImgIndex];
            lb.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            window.addEventListener('keydown', handleKeyPress);
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = 'auto';
            window.removeEventListener('keydown', handleKeyPress);
        }

        function handleKeyPress(e) {
            if (e.key === "ArrowRight") changeImage(1);
            else if (e.key === "ArrowLeft") changeImage(-1);
            else if (e.key === "Escape") closeLightbox();
        }

        // --- 5. 其他功能 (保留) ---
        function toggleMenu() {
            document.getElementById('nav-container').classList.toggle('active');
        }

        const scrollBtn = document.getElementById('scrollTop');
        window.onscroll = () => {
            if (window.scrollY > 300) scrollBtn.classList.add('show');
            else scrollBtn.classList.remove('show');
        };
        scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

        loadLogs();
    </script>

</body>

</html>
