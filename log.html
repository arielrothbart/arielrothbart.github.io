<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain's Log</title>
    <link rel="stylesheet" href="global.css">

    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #58a6ff;
            /* 回归经典的赛博蓝 */
            --text-color: #ffffff;
            --secondary-text: rgba(255, 255, 255, 0.6);
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            scroll-behavior: smooth;
        }

        /* 扫描线 */
        body::before {
            content: " ";
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.4;
        }

        /* --- 侧边栏 --- */
        #nav-container {
            width: 280px;
            height: 100vh;
            position: sticky;
            top: 0;
            border-right: 1px solid rgba(88, 166, 255, 0.2);
            padding: 60px 30px;
            box-sizing: border-box;
            overflow-y: auto;
            background: black;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .nav-title {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--accent-color);
            opacity: 0.6;
            margin-bottom: 30px;
        }

        #nav-links a {
            display: block;
            color: var(--secondary-text);
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        #nav-links a:hover {
            color: var(--accent-color);
            transform: translateX(5px);
        }

        /* --- 主内容 --- */
        main {
            flex: 1;
            padding: 60px 40px;
            max-width: 800px;
        }

        .post {
            margin-bottom: 100px;
            animation: fadeIn 1s ease-out;
        }

        .post.pinned {
            border-left: 2px solid var(--accent-color);
            padding-left: 30px;
            background: rgba(88, 166, 255, 0.03);
            padding-top: 20px;
            padding-bottom: 20px;
        }

        .date {
            font-size: 11px;
            color: var(--accent-color);
            letter-spacing: 2px;
            opacity: 0.8;
        }

        h2 {
            font-size: 18px;
            letter-spacing: 3px;
            margin: 15px 0;
        }

        p {
            line-height: 1.8;
            opacity: 0.8;
            font-size: 15px;
        }

        /* 图片容器：改为网格模式 */
        .sketch-box {
            display: grid;
            gap: 8px;
            /* 图片间距 */
            margin-top: 25px;
            /* 默认两列，如果是4张图效果最好 */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            max-width: 600px;
            /* 限制缩略图总宽度，不让它铺满全屏 */
        }

        /* 缩略图统一规格 */
        .sketch-box img {
            width: 100%;
            height: 200px;
            /* 固定高度，确保对齐 */
            object-fit: cover;
            /* 核心：图片自动裁剪填充，不拉伸变形 */
            border: 1px solid rgba(88, 166, 255, 0.2);
            cursor: zoom-in;
            transition: 0.3s;
        }

        .sketch-box img:hover {
            filter: brightness(1.2);
            border-color: var(--accent-color);
        }

        /* 如果只有一张图，让它显示得稍大一些 */
        .sketch-box img:only-child {
            height: auto;
            max-height: 400px;
            object-fit: contain;
        }

        /* 查看器背景 */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

    
        /* 查看器里的图片：基础样式 */
.lightbox img {
    max-width: 90%;
    max-height: 90%;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    /* 缩短一点时间，0.3s 显得更干脆不拖沓 */
    transition: all 0.3s ease-in-out; 
    opacity: 1;
    transform: translateX(0);
}

/* 状态 A：离开时的状态（向左滑出并消失） */
.img-leave {
    opacity: 0 !important;
    transform: translateX(-30px) !important;
}

/* 状态 B：进入前的瞬间状态（先瞬移到右边，准备滑入） */
.img-enter {
    transition: none !important; /* 瞬移时不需要动画 */
    opacity: 0 !important;
    transform: translateX(30px) !important;
}

        /* 切换时的低调状态：只有轻微的淡出和平移 */
        .img-switching {
            opacity: 0;
            transform: translateX(-20px);
            /* 轻轻向左滑出 */
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        /* 让列表中的缩略图看起来像可以点击的样子 */
        .sketch-box img {
            cursor: zoom-in;
        }

        /* --- 手机端组件 --- */
        #menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: var(--accent-color);
            color: black;
            border: none;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
        }

        /* --- 统一按钮 --- */
        .home-logo {
            position: fixed;
            top: 60px;
            right: 60px;
            z-index: 1000;
        }

        .home-logo img {
            width: 80px;
            opacity: 0.7;
            transition: 0.3s;
        }

        .scroll-top {
            position: fixed;
            right: 60px;
            bottom: 60px;
            width: 48px;
            height: 48px;
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            cursor: pointer;
            opacity: 0;
            transition: 0.4s;
            z-index: 1000;
            text-shadow: 0 0 8px var(--accent-color);
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.2);
        }

        .scroll-top.show {
            opacity: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
            }
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-color);
            font-size: 40px;
            padding: 20px;
            cursor: pointer;
            user-select: none;
            transition: 0.3s;
            z-index: 2100;
        }

        .nav-btn:hover {
            color: #ffffff;
            text-shadow: 0 0 10px var(--accent-color);
        }

        .prev {
            left: 20px;
        }

        .next {
            right: 20px;
        }

        @media (max-width: 768px) {
            #menu-toggle {
                display: block;
            }

            #nav-container {
                position: fixed;
                transform: translateX(-100%);
                width: 240px;
            }

            #nav-container.active {
                transform: translateX(0);
            }

            main {
                padding: 80px 25px;
            }

            .home-logo {
                top: 20px;
                right: 20px;
            }

            .home-logo img {
                width: 48px;
            }

            .scroll-top {
                right: 20px;
                bottom: 20px;
            }
        }
    </style>
</head>

<div id="lightbox" class="lightbox">
    <span class="close-btn" onclick="closeLightbox()">&times;</span>

    <div class="nav-btn prev" onclick="changeImage(-1); event.stopPropagation();">&#10094;</div>

    <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation();">

    <div class="nav-btn next" onclick="changeImage(1); event.stopPropagation();">&#10095;</div>
</div>

<body>

    <button id="menu-toggle" onclick="toggleMenu()">MENU</button>

    <nav id="nav-container">
        <div class="nav-title">LOG_DATABASE</div>
        <div id="nav-links"></div>
    </nav>

    <main id="log-content"></main>

    <a href="index.html" class="home-logo"><img src="logo.png"></a>
    <div class="scroll-top" id="scrollTop">↑</div>

    <script>
        // --- 1. 全局状态 ---
        let allImages = [];
        let currentImgIndex = 0;

        // --- 2. 自动加载 JSON 数据 ---
        async function loadLogs() {
            try {
                const response = await fetch('logs.json');
                const data = await response.json();
                renderLogs(data);
            } catch (err) {
                console.error("加载日志失败", err);
            }
        }

        // --- 3. 渲染日志 ---
        function renderLogs(logs) {
            const contentArea = document.getElementById('log-content');
            const navArea = document.getElementById('nav-links');

            logs.forEach(log => {
                const link = document.createElement('a');
                link.href = `#${log.id}`;
                link.innerText = `# ${log.title}`;
                link.onclick = () => { if (window.innerWidth <= 768) toggleMenu(); };
                navArea.appendChild(link);

                let imagesHtml = '';
                // 提取图片逻辑
                const logImgs = log.images || (log.image ? [log.image] : []);

                logImgs.forEach(imgSrc => {
                    allImages.push(imgSrc);
                    const currentIdx = allImages.length - 1;
                    imagesHtml += `<img src="${imgSrc}" onclick="openLightbox(${currentIdx})">`;
                });

                const section = document.createElement('section');
                section.id = log.id;
                section.className = `post ${log.type === 'pinned' ? 'pinned' : ''}`;
                section.innerHTML = `
                <span class="date">${log.date}</span>
                <h2>${log.title}</h2>
                <p>${log.content}</p>
                ${imagesHtml ? `<div class="sketch-box">${imagesHtml}</div>` : ''}
            `;
                contentArea.appendChild(section);
            });
        }

        // --- 4. Lightbox 核心逻辑 (修复点击无反应看这里) ---
        function changeImage(step) {
    const lbImg = document.getElementById('lightbox-img');
    
    // 1. 先触发“离开”动画
    lbImg.classList.add('img-leave');

    // 2. 等离开动画做完 (300ms)
    setTimeout(() => {
        // 换图
        currentImgIndex = (currentImgIndex + step + allImages.length) % allImages.length;
        lbImg.src = allImages[currentImgIndex];

        // 3. 换图后，立刻切换到“进入前”的状态 (瞬移到右侧 30px 处)
        lbImg.classList.remove('img-leave');
        lbImg.classList.add('img-enter');

        // 4. 强行让浏览器刷新一下状态 (Reflow)
        lbImg.offsetWidth; 

        // 5. 移除“进入”类，图片会自动根据 transition 效果平滑回到 translateX(0)
        lbImg.classList.remove('img-enter');
    }, 300); 
}

        function openLightbox(index) {
            currentImgIndex = index;
            const lb = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = allImages[currentImgIndex];
            lb.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            window.addEventListener('keydown', handleKeyPress);
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = 'auto';
            window.removeEventListener('keydown', handleKeyPress);
        }

        function handleKeyPress(e) {
            if (e.key === "ArrowRight") changeImage(1);
            else if (e.key === "ArrowLeft") changeImage(-1);
            else if (e.key === "Escape") closeLightbox();
        }

        // --- 5. 其他功能 (保留) ---
        function toggleMenu() {
            document.getElementById('nav-container').classList.toggle('active');
        }

        const scrollBtn = document.getElementById('scrollTop');
        window.onscroll = () => {
            if (window.scrollY > 300) scrollBtn.classList.add('show');
            else scrollBtn.classList.remove('show');
        };
        scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

        loadLogs();
    </script>

</body>

</html>
