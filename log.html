<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain's Log</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #58a6ff;
            /* 回归经典的赛博蓝 */
            --text-color: #ffffff;
            --secondary-text: rgba(255, 255, 255, 0.6);
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            scroll-behavior: smooth;
        }

        /* 扫描线 */
        body::before {
            content: " ";
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* --- 侧边栏 --- */
        #nav-container {
            width: 280px;
            height: 100vh;
            position: sticky;
            top: 0;
            border-right: 1px solid rgba(88, 166, 255, 0.2);
            padding: 60px 30px;
            box-sizing: border-box;
            overflow-y: auto;
            background: black;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .nav-title {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--accent-color);
            opacity: 0.6;
            margin-bottom: 30px;
        }

        #nav-links a {
            display: block;
            color: var(--secondary-text);
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        #nav-links a:hover {
            color: var(--accent-color);
            transform: translateX(5px);
        }

        /* --- 主内容 --- */
        main {
            flex: 1;
            padding: 60px 40px;
            max-width: 800px;
        }

        .post {
            margin-bottom: 100px;
            animation: fadeIn 1s ease-out;
        }

        .post.pinned {
            border-left: 2px solid var(--accent-color);
            padding-left: 30px;
            background: rgba(88, 166, 255, 0.03);
            padding-top: 20px;
            padding-bottom: 20px;
        }

        .date {
            font-size: 11px;
            color: var(--accent-color);
            letter-spacing: 2px;
            opacity: 0.8;
        }

        h2 {
            font-size: 18px;
            letter-spacing: 3px;
            margin: 15px 0;
        }

        p {
            line-height: 1.8;
            opacity: 0.8;
            font-size: 15px;
        }

        .sketch-box {
            display: flex;
            flex-direction: column;
            /* 图片垂直排列 */
            gap: 20px;
            /* 图片之间的间距 */
            margin-top: 25px;
        }

        .sketch-box img {
            width: 100%;
            max-width: 100%;
            /* 确保不超出容器 */
            height: auto;
            border: 1px solid #222;
            transition: transform 0.3s ease;
        }

        .sketch-box img:hover {
            transform: scale(1.01);
            /* 鼠标悬停微调，增加互动感 */
        }

        /* --- 手机端组件 --- */
        #menu-toggle {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: var(--accent-color);
            color: black;
            border: none;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
        }

        /* --- 统一按钮 --- */
        .home-logo {
            position: fixed;
            top: 60px;
            right: 60px;
            z-index: 1000;
        }

        .home-logo img {
            width: 80px;
            opacity: 0.7;
            transition: 0.3s;
        }

        .scroll-top {
            position: fixed;
            right: 60px;
            bottom: 60px;
            width: 48px;
            height: 48px;
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            cursor: pointer;
            opacity: 0;
            transition: 0.4s;
            z-index: 1000;
            text-shadow: 0 0 8px var(--accent-color);
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.2);
        }

        .scroll-top.show {
            opacity: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            #menu-toggle {
                display: block;
            }

            #nav-container {
                position: fixed;
                transform: translateX(-100%);
                width: 240px;
            }

            #nav-container.active {
                transform: translateX(0);
            }

            main {
                padding: 80px 25px;
            }

            .home-logo {
                top: 20px;
                right: 20px;
            }

            .home-logo img {
                width: 48px;
            }

            .scroll-top {
                right: 20px;
                bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <button id="menu-toggle" onclick="toggleMenu()">MENU</button>

    <nav id="nav-container">
        <div class="nav-title">LOG_DATABASE</div>
        <div id="nav-links"></div>
    </nav>

    <main id="log-content"></main>

    <a href="index.html" class="home-logo"><img src="logo.png"></a>
    <div class="scroll-top" id="scrollTop">↑</div>

    <script>
        // 1. 自动加载 JSON 数据
        async function loadLogs() {
            try {
                const response = await fetch('logs.json');
                const data = await response.json();
                renderLogs(data);
            } catch (err) {
                console.error("加载日志失败，请检查 logs.json 是否在同一目录下", err);
            }
        }

        function renderLogs(logs) {
            const contentArea = document.getElementById('log-content');
            const navArea = document.getElementById('nav-links');

            logs.forEach(log => {
                // 生成导航链接
                const link = document.createElement('a');
                link.href = `#${log.id}`;
                link.innerText = `# ${log.title}`;
                link.onclick = () => { if (window.innerWidth <= 768) toggleMenu(); };
                navArea.appendChild(link);

                // 处理图片列表：如果是单张图字符串，转为数组；如果是数组，直接使用
                let imagesHtml = '';
                if (log.images && Array.isArray(log.images)) {
                    log.images.forEach(imgSrc => {
                        imagesHtml += `<img src="${imgSrc}" style="margin-bottom: 15px;">`;
                    });
                } else if (log.image) { // 兼容旧的单图格式
                    imagesHtml = `<img src="${log.image}">`;
                }

                // 生成日志内容
                const section = document.createElement('section');
                section.id = log.id;
                section.className = `post ${log.type === 'pinned' ? 'pinned' : ''}`;

                section.innerHTML = `
                <span class="date">${log.date}</span>
                <h2>${log.title}</h2>
                <p>${log.content}</p>
                ${imagesHtml ? `<div class="sketch-box">${imagesHtml}</div>` : ''}
            `;
                contentArea.appendChild(section);
            });
        }

        // 2. 手机端菜单切换
        function toggleMenu() {
            document.getElementById('nav-container').classList.toggle('active');
        }

        // 3. 回顶部逻辑
        const scrollBtn = document.getElementById('scrollTop');
        window.onscroll = () => {
            if (window.scrollY > 300) scrollBtn.classList.add('show');
            else scrollBtn.classList.remove('show');
        };
        scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

        // 初始化加载
        loadLogs();
    </script>

</body>

</html>
