<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: sans-serif;
}
img {
  user-select: none;
  -webkit-user-drag: none;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 60px 30px;
}

h1 {
  letter-spacing: 4px;
  margin-bottom: 40px;
}

.section-title {
  margin: 60px 0 20px;
  opacity: 0.5;
  font-size: 14px;
  letter-spacing: 2px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 50px;
}

.gallery img {
  width: 100%;
  cursor: pointer;
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.03);
}

/* viewer */
.viewer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#viewer-img {
  max-width: 90%;
  max-height: 90%;
  transition: transform 0.6s cubic-bezier(0.22,1,0.36,1),
              opacity 0.6s ease;
}

/* 箭头 */
.arrow {
  position: absolute;
  top: 50%;
  font-size: 30px;
  color: white;
  cursor: pointer;
  padding: 20px;
  z-index: 1000;
}

.left { left: 20px; }
.right { right: 20px; }

/* 价目表 */
.price {
  margin-top: 100px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
}

.price img {
  width: 100%;
  cursor: pointer;
}

/* logo */
.home-logo {
  position: fixed;
  top: 80px;
  right: 60px;
  z-index: 1000;
}

.home-logo img {
  width: 80px; /* ⭐放大 */
  opacity: 0.8;
  transition: 0.3s;
}

.home-logo img:hover {
  opacity: 1;
  transform: scale(1.08);
}

@media (max-width: 768px) {
  .gallery { grid-template-columns: 1fr; }
  .price { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="container">

<h1>Commission</h1>

<div class="section-title">Half Body</div>
<div class="gallery">
  <img src="half1.png">
  <img src="half2.png">
  <img src="half3.png">
</div>

<div class="section-title">Portrait</div>
<div class="gallery">
  <img src="head1.png">
  <img src="head2.png">
  <img src="head3.png">
</div>

<div class="section-title">Illustration / Comics</div>
<div class="gallery">
  <img src="ill1.png">
  <img src="ill2.png">
  <img src="ill4.png">
  <img src="ill3.png">
</div>

<div class="price">
  <img src="price-cn.png">
  <img src="price-en.png">
</div>

</div>

<div class="viewer" id="viewer">
  <span class="arrow left" id="prev">&#10094;</span>
  <img id="viewer-img">
  <span class="arrow right" id="next">&#10095;</span>
</div>

<a href="index.html" class="home-logo">
  <img src="logo.png">
</a>

<script>
const images = document.querySelectorAll('img');
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewer-img');

let currentIndex = 0;
let list = [];
let scrollLock = false;

/* 收集图片 */
images.forEach(img => {
  if (!img.closest('.home-logo')) {
    list.push(img);
    img.onclick = () => {
      currentIndex = list.indexOf(img);
      openViewer();
    };
  }
});

function openViewer() {
  viewer.style.display = 'flex';
  viewerImg.src = list[currentIndex].src;
  viewerImg.style.opacity = 1;
  viewerImg.style.transform = 'translateX(0)';
}

function closeViewer() {
  viewer.style.display = 'none';
}

/* ⭐最终稳定动画（无闪 / 无回弹） */
function change(direction) {
  const offset = 160;

  // 当前图滑走
  viewerImg.style.transform =
    direction === 'next'
      ? `translateX(-${offset}px)`
      : `translateX(${offset}px)`;

  viewerImg.style.opacity = 0;

  setTimeout(() => {

    currentIndex =
      direction === 'next'
        ? (currentIndex + 1) % list.length
        : (currentIndex - 1 + list.length) % list.length;

    // ⭐关键：先关闭动画，防止“闪回”
    viewerImg.style.transition = 'none';

    viewerImg.src = list[currentIndex].src;

    viewerImg.style.transform =
      direction === 'next'
        ? `translateX(${offset}px)`
        : `translateX(-${offset}px)`;

    viewerImg.style.opacity = 0;

    // 强制刷新
    viewerImg.offsetHeight;

    // ⭐重新打开动画，只执行一次滑入
    viewerImg.style.transition = 'transform 0.6s cubic-bezier(0.22,1,0.36,1), opacity 0.6s ease';

    viewerImg.style.transform = 'translateX(0)';
    viewerImg.style.opacity = 1;

  }, 300);
}

/* 控制 */
document.getElementById('next').onclick = () => change('next');
document.getElementById('prev').onclick = () => change('prev');

viewer.onclick = (e) => {
  if (e.target === viewer) closeViewer();
};

document.addEventListener('keydown', e => {
  if (viewer.style.display === 'flex') {
    if (e.key === 'ArrowRight') change('next');
    if (e.key === 'ArrowLeft') change('prev');
    if (e.key === 'Escape') closeViewer();
  }
});

/* 滚轮 */
viewer.addEventListener('wheel', e => {
  if (viewer.style.display !== 'flex') return;
  e.preventDefault();

  if (scrollLock) return;
  scrollLock = true;

  if (e.deltaY > 0) change('next');
  else change('prev');

  setTimeout(() => scrollLock = false, 600);
}, { passive:false });

</script>

</body>
</html>
