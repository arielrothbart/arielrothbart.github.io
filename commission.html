<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: sans-serif;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 60px 30px;
}

h1 {
  letter-spacing: 4px;
  margin-bottom: 40px;
}

.section-title {
  margin: 60px 0 20px;
  opacity: 0.5;
  font-size: 14px;
  letter-spacing: 2px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 50px;
}

.gallery img {
  width: 100%;
  cursor: pointer;
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.03);
}

.viewer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.viewer img {
  max-width: 90%;
  max-height: 90%;
}

.price {
  margin-top: 100px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
}

.price img {
  width: 100%;
}

@media (max-width: 768px) {

  .gallery {
    grid-template-columns: 1fr;
    gap: 25px;
  }

  .price {
    grid-template-columns: 1fr;
  }

}
</style>

</head>

<body>

<div class="container">

<h1>Commission</h1>

<!-- 插图 / 漫画 -->
<div class="section-title">Illustration / Comics</div>
<div class="gallery">
  <img src="ill1.png">
  <img src="ill2.png">
  <img src="ill3.png">
  <img src="ill4.png">
</div>

<!-- 半身 -->
<div class="section-title">Half Body</div>
<div class="gallery">
  <img src="half1.png">
  <img src="half2.png">
  <img src="half3.png">
</div>

<!-- 头像 -->
<div class="section-title">Portrait</div>
<div class="gallery">
  <img src="head1.png">
  <img src="head2.png">
  <img src="head3.png">
</div>

<!-- 价目表 -->
<div class="price">
  <img src="price-cn.png">
  <img src="price-en.png">
</div>

</div>

<!-- 放大查看 -->
<div class="viewer" id="viewer">
  <img id="viewer-img">
</div>

<script>
const images = document.querySelectorAll('.gallery img');
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewer-img');

images.forEach(img => {
  img.addEventListener('click', () => {
    viewer.style.display = 'flex';
    viewerImg.src = img.src;
  });
});

viewer.addEventListener('click', () => {
  viewer.style.display = 'none';
});
</script>

</body>

</html>
