<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: sans-serif;
}
img {
  user-select: none;
  -webkit-user-drag: none;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 60px 30px;
}

h1 {
  letter-spacing: 4px;
  margin-bottom: 10px;
}

/* ⭐标题下入口 */
.quick-contact {
  margin-bottom: 30px;
  font-size: 13px;
  letter-spacing: 2px;
  opacity: 0.6;
}

.quick-contact a {
  color: white;
  text-decoration: none;
  transition: 0.3s;
}

.quick-contact a:hover {
  opacity: 1;
}

/* 原有内容 */
.section-title {
  margin: 60px 0 20px;
  opacity: 0.5;
  font-size: 14px;
  letter-spacing: 2px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 50px;
}

.gallery img {
  width: 100%;
  cursor: pointer;
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.03);
}

/* viewer */
.viewer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#viewer-img {
  max-width: 90%;
  max-height: 90%;
  transition: transform 0.6s cubic-bezier(0.22,1,0.36,1),
              opacity 0.6s ease;
}

/* 箭头 */
.arrow {
  position: absolute;
  top: 50%;
  font-size: 30px;
  color: white;
  cursor: pointer;
  padding: 20px;
  z-index: 1000;
}

.left { left: 20px; }
.right { right: 20px; }

/* ⭐价目表（修复尺寸） */
.price {
  margin: 100px auto 0 auto;
  max-width: 900px;          /* ⭐限制整体宽度 */
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
}

.price img {
  width: 100%;
  height: auto;
  object-fit: contain;
  display: block;
}

/* logo */
.home-logo {
  position: fixed;
  top: 80px;
  right: 60px;
  z-index: 1000;
}

.home-logo img {
  width: 80px;
  opacity: 0.8;
  transition: 0.3s;
}

.home-logo img:hover {
  opacity: 1;
  transform: scale(1.08);
}

/* ⭐回到顶部 */
.back-top {
  position: fixed;
  bottom: 40px;
  right: 60px;
  font-size: 18px;
  opacity: 0.5;
  cursor: pointer;
  transition: 0.3s;
}

.back-top:hover {
  opacity: 1;
}

/* 📱 手机 */
@media (max-width: 768px) {
  .home-logo {
    top: 85px;
    right: 16px;
  }

  .home-logo img {
    width: 48px;
  }

  .back-top {
    right: 16px;
  }

  .gallery { grid-template-columns: 1fr; }
  .price { grid-template-columns: 1fr; }
}

/* ⭐底部入口 */
.commission-block {
  margin-top: 80px;
  text-align: center;
}

.commission-main a {
  color: white;
  text-decoration: none;
  font-size: 16px;
  letter-spacing: 3px;
  opacity: 0.95;
  transition: 0.3s;
}

.commission-main a:hover {
  opacity: 1;
  letter-spacing: 4px;
}

.commission-sub {
  margin-top: 14px;
  font-size: 13px;
  letter-spacing: 2px;
  opacity: 0.7;
}

</style>
</head>

<body>

<div class="container">

<h1>Commission</h1>

<!-- ⭐新加：顶部入口 -->
<div class="quick-contact">
  <a href="https://www.mihuashi.com/profiles/490991" target="_blank">Commission Portal</a>
  <span> / </span>
  <a href="mailto:arielrothbart@gmail.com">E-mail</a>
</div>

<div class="section-title">Half Body</div>
<div class="gallery">
  <img src="half1.png">
  <img src="half2.png">
  <img src="half3.png">
</div>

<div class="section-title">Portrait</div>
<div class="gallery">
  <img src="head1.png">
  <img src="head2.png">
  <img src="head3.png">
</div>

<div class="section-title">Illustration / Comics</div>
<div class="gallery">
  <img src="ill1.png">
  <img src="ill2.png">
  <img src="ill4.png">
  <img src="ill3.png">
</div>

<div class="price">
  <img src="price-cn.png">
  <img src="price-en.png">
</div>

<div class="commission-block">
  <div class="commission-main">
    <a href="https://www.mihuashi.com/profiles/490991" target="_blank">
      Commission Portal via Mihuashi
    </a>
  </div>

  <div class="commission-sub">
    <a href="mailto:arielrothbart@gmail.com">
      E-mail: arielrothbart@gmail.com
    </a>
  </div>
</div>

</div>

<div class="viewer" id="viewer">
  <span class="arrow left" id="prev">&#10094;</span>
  <img id="viewer-img">
  <span class="arrow right" id="next">&#10095;</span>
</div>

<a href="index.html" class="home-logo">
  <img src="logo.png">
</a>

<!-- ⭐回到顶部 -->
<div class="back-top" id="backTop">↑</div>

<script>
const images = document.querySelectorAll('img');
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewer-img');

let currentIndex = 0;
let list = [];
let scrollLock = false;

images.forEach(img => {
  if (!img.closest('.home-logo')) {
    list.push(img);
    img.onclick = () => {
      currentIndex = list.indexOf(img);
      openViewer();
    };
  }
});

function openViewer() {
  viewer.style.display = 'flex';
  viewerImg.src = list[currentIndex].src;
  viewerImg.style.opacity = 1;
  viewerImg.style.transform = 'translateX(0)';
}

function closeViewer() {
  viewer.style.display = 'none';
}

function change(direction) {
  const offset = 160;

  viewerImg.style.transform =
    direction === 'next'
      ? `translateX(-${offset}px)`
      : `translateX(${offset}px)`;

  viewerImg.style.opacity = 0;

  setTimeout(() => {

    currentIndex =
      direction === 'next'
        ? (currentIndex + 1) % list.length
        : (currentIndex - 1 + list.length) % list.length;

    viewerImg.style.transition = 'none';

    viewerImg.src = list[currentIndex].src;

    viewerImg.style.transform =
      direction === 'next'
        ? `translateX(${offset}px)`
        : `translateX(-${offset}px)`;

    viewerImg.offsetHeight;

    viewerImg.style.transition = 'transform 0.6s cubic-bezier(0.22,1,0.36,1), opacity 0.6s ease';

    viewerImg.style.transform = 'translateX(0)';
    viewerImg.style.opacity = 1;

  }, 300);
}

document.getElementById('next').onclick = () => change('next');
document.getElementById('prev').onclick = () => change('prev');

viewer.onclick = (e) => {
  if (e.target === viewer) closeViewer();
};

document.addEventListener('keydown', e => {
  if (viewer.style.display === 'flex') {
    if (e.key === 'ArrowRight') change('next');
    if (e.key === 'ArrowLeft') change('prev');
    if (e.key === 'Escape') closeViewer();
  }
});

/* 滚轮 */
viewer.addEventListener('wheel', e => {
  if (viewer.style.display !== 'flex') return;
  e.preventDefault();

  if (scrollLock) return;
  scrollLock = true;

  if (e.deltaY > 0) change('next');
  else change('prev');

  setTimeout(() => scrollLock = false, 600);
}, { passive:false });

/* ⭐回到顶部 */
document.getElementById('backTop').onclick = () => {
  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
};
</script>

</body>
</html>
