<!DOCTYPE html>

<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: sans-serif;
}
img {
  user-select: none;
  -webkit-user-drag: none;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 60px 30px;
}

h1 {
  letter-spacing: 4px;
  margin-bottom: 10px;
}

/* ⭐标题下入口 */
.quick-contact {
  margin-bottom: 30px;
  font-size: 13px;
  letter-spacing: 2px;
  opacity: 0.6;
}

.quick-contact a {
  color: white;
  text-decoration: none;
  transition: 0.3s;
}

.quick-contact a:hover {
  opacity: 1;
}

/* 原有内容 */
.section-title {
  margin: 60px 0 20px;
  opacity: 0.5;
  font-size: 14px;
  letter-spacing: 2px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 50px;
}

.gallery img {
  width: 100%;
  cursor: pointer;
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.03);
}

/* viewer */
.viewer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#viewer-img {
  max-width: 90%;
  max-height: 90%;
  transition: transform 0.6s cubic-bezier(0.22,1,0.36,1),
              opacity 0.6s ease;
}

/* 箭头 */
.arrow {
  position: absolute;
  top: 50%;
  font-size: 30px;
  color: white;
  cursor: pointer;
  padding: 20px;
  z-index: 1000;
}

.left { left: 20px; }
.right { right: 20px; }

/* ⭐价目表 */
.price {
  margin: 100px auto 0 auto;
  max-width: 900px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
}

.price img {
  width: 100%;
  height: auto;
  object-fit: contain;
  display: block;
}

/* logo */
.home-logo {
  position: fixed;
  top: 80px;
  right: 60px;
  z-index: 1000;
}

.home-logo img {
  width: 80px;
  opacity: 0.8;
  transition: 0.3s;
}

.home-logo img:hover {
  opacity: 1;
  transform: scale(1.08);
}

/* ⭐统一风格回顶部 */
.scroll-top {
  position: fixed;
  right: 60px;
  bottom: 60px;

  width: 48px;
  height: 48px;

  border: 1px solid rgba(255,60,60,0.4);
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 18px;
  color: #ff3b3b;

  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);

  cursor: pointer;

  opacity: 0;
  transform: translateY(20px);

  transition: 0.4s;

  z-index: 1000;

  text-shadow:
    0 0 6px rgba(255,60,60,0.8),
    0 0 12px rgba(255,60,60,0.4);
}

.scroll-top.show {
  opacity: 1;
  transform: translateY(0);
}

.scroll-top:hover {
  transform: scale(1.1);
  box-shadow:
    0 0 10px rgba(255,60,60,0.6),
    0 0 20px rgba(255,60,60,0.3);
}

/* 📱 手机 */
@media (max-width: 768px) {
  .home-logo {
    top: 85px;
    right: 16px;
  }

  .home-logo img {
    width: 48px;
  }

  .gallery { grid-template-columns: 1fr; }
  .price { grid-template-columns: 1fr; }

  .scroll-top {
    right: 20px;
    bottom: 20px;
  }
}

/* ⭐底部入口 */
.commission-block {
  margin-top: 80px;
  text-align: center;
}

.commission-main a {
  color: white;
  text-decoration: none;
  font-size: 16px;
  letter-spacing: 3px;
  opacity: 0.95;
  transition: 0.3s;
}

.commission-main a:hover {
  opacity: 1;
  letter-spacing: 4px;
}

.commission-sub {
  margin-top: 14px;
  font-size: 13px;
  letter-spacing: 2px;
  opacity: 0.7;
}

</style>

</head>

<body>

<div class="container">

<h1>Commission</h1>

<div class="quick-contact">
  <a href="https://www.mihuashi.com/profiles/490991" target="_blank">Commission Portal</a>
  <span> / </span>
  <a href="mailto:arielrothbart@gmail.com">E-mail</a>
</div>

<div class="section-title">Half Body</div>
<div class="gallery">
  <img src="images/commission/half1.png">
  <img src="images/commission/half2.png">
  <img src="images/commission/half3.png">
</div>

<div class="section-title">Portrait</div>
<div class="gallery">
  <img src="images/commission/head1.png">
  <img src="images/commission/head2.png">
  <img src="images/commission/head3.png">
</div>

<div class="section-title">Illustration / Comics</div>
<div class="gallery">
  <img src="images/commission/ill1.png">
  <img src="images/commission/ill2.png">
  <img src="images/commission/ill4.png">
  <img src="images/commission/ill3.png">
</div>

<div class="price">
  <img src="images/commission/price-cn.png">
  <img src="images/commission/price-en.png">
</div>

<div class="commission-block">
  <div class="commission-main">
    <a href="https://www.mihuashi.com/profiles/490991" target="_blank">
      Commission Portal via Mihuashi
    </a>
  </div>

  <div class="commission-sub">
    <a href="mailto:arielrothbart@gmail.com">
      E-mail: arielrothbart@gmail.com
    </a>
  </div>
</div>

</div>

<div class="viewer" id="viewer">
  <span class="arrow left" id="prev">&#10094;</span>
  <img id="viewer-img">
  <span class="arrow right" id="next">&#10095;</span>
</div>

<a href="index.html" class="home-logo">
  <img src="logo.png">
</a>

<div class="scroll-top" id="scrollTop">↑</div>

<script>
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewer-img');

let currentIndex = 0;
let list = [];
let scrollLock = false;

const images = document.querySelectorAll('.gallery img, .price img');

images.forEach(img => {

  // ⭐保存原图路径
  const fullSrc = img.src;

  // ⭐先不加载（类似 lazy）
  img.dataset.full = fullSrc;
  img.src = fullSrc;

  list.push(img);

  img.onclick = () => {
    currentIndex = list.indexOf(img);
    openViewer();
  };

});

function openViewer() {
  viewer.style.display = 'flex';
 viewerImg.src = list[currentIndex].dataset.full;
  viewerImg.style.opacity = 1;
  viewerImg.style.transform = 'translateX(0)';
}

function closeViewer() {
  viewer.style.display = 'none';
}

function change(direction) {
  const offset = 160;

  viewerImg.style.transform =
    direction === 'next'
      ? `translateX(-${offset}px)`
      : `translateX(${offset}px)`;

  viewerImg.style.opacity = 0;

  setTimeout(() => {

    currentIndex =
      direction === 'next'
        ? (currentIndex + 1) % list.length
        : (currentIndex - 1 + list.length) % list.length;

    viewerImg.style.transition = 'none';

    viewerImg.src = list[currentIndex].src;

    viewerImg.style.transform =
      direction === 'next'
        ? `translateX(${offset}px)`
        : `translateX(-${offset}px)`;

    viewerImg.offsetHeight;

    viewerImg.style.transition = 'transform 0.6s cubic-bezier(0.22,1,0.36,1), opacity 0.6s ease';

    viewerImg.style.transform = 'translateX(0)';
    viewerImg.style.opacity = 1;

  }, 300);
}

document.getElementById('next').onclick = () => change('next');
document.getElementById('prev').onclick = () => change('prev');

viewer.onclick = (e) => {
  if (e.target === viewer) closeViewer();
};

document.addEventListener('keydown', e => {
  if (viewer.style.display === 'flex') {
    if (e.key === 'ArrowRight') change('next');
    if (e.key === 'ArrowLeft') change('prev');
    if (e.key === 'Escape') closeViewer();
  }
});

/* 滚轮 */
viewer.addEventListener('wheel', e => {
  if (viewer.style.display !== 'flex') return;
  e.preventDefault();

  if (scrollLock) return;
  scrollLock = true;

  if (e.deltaY > 0) change('next');
  else change('prev');

  setTimeout(() => scrollLock = false, 600);
}, { passive:false });

/* ⭐统一回顶部逻辑 */
const scrollBtn = document.getElementById('scrollTop');

window.addEventListener('scroll', () => {
  if (window.scrollY > 300) {
    scrollBtn.classList.add('show');
  } else {
    scrollBtn.classList.remove('show');
  }
});

scrollBtn.onclick = () => {
  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
};
</script>

</body>
</html>
