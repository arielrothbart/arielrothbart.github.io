<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <link rel="preconnect" href="images/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnel Files | Rhapsody in Neon</title>
    <link rel="stylesheet" href="global.css">

    <style>
        .scroll-top {
            border-color: var(--accent-color);
            color: var(--accent-color);
            text-shadow: 0 0 6px var(--accent-color);
        }

        /* 1. 引入自定义字体 */
        @font-face {
            font-family: 'Vladivostok';
            src: url('fonts/Vladivostiok-Bold.woff2') format('woff2'),
                url('fonts/Vladivostiok-Bold.woff') format('woff');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #050505;
            --accent-color: #00f2ff;
            --border-color: rgba(0, 242, 255, 0.2);
            --text-main: #ffffff;
            --glass-bg: linear-gradient(90deg, rgba(0, 242, 255, 0.05) 0%, transparent 100%);
            --nav-width: 300px;
        }

        body {
            animation: fadeInPage 0.8s ease-in-out;
            margin: 0;
            background:
                url('images/pfiles/x.png') center/cover no-repeat fixed,
                url('images/pfiles/Dots.png') center/cover no-repeat fixed,
                url('images/pfiles/Circles.png') center/cover no-repeat fixed,
                url('images/pfiles/Rectangles.png') center/cover no-repeat fixed,
                url('images/pfiles/Pattern.png') center/cover no-repeat fixed,
                #050505;
            /* 底色 */
            background-blend-mode: screen;
            /* 使用滤色模式让黑色背景透明 */

            /* 2. 更新字体调用：优先使用 Vladivostok */
            font-family: 'Vladivostok', 'Emberly', sans-serif;

            /* 维持你要求的紧凑、方正感 */
            letter-spacing: 0.02em;

            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes fadeInPage {
            from {
                opacity: 0;
                filter: brightness(0.5);
            }

            to {
                opacity: 1;
                filter: brightness(1);
            }
        }

        /* 档案卡片容器 */
        .profile-card {
            max-width: 900px;
            margin: 0 auto 120px auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
            padding: 35px;
            position: relative;
            scroll-margin-top: 100px;

            /* --- 核心修改：不透明毛玻璃 --- */
            background: rgba(5, 5, 5, 0.9);
            /* 极高不透明度，确保文字不被背景吞噬 */
            backdrop-filter: blur(20px) saturate(180%);
            /* 强力模糊，营造博物馆玻璃展柜感 */
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(0, 242, 255, 0.05);
            /* 增加内发光 */
            will-change: transform, opacity; /* 告知浏览器提前准备 */
    transform: translateZ(0);       /* 强制触发 GPU 加速 */
    backface-visibility: hidden;
        }

        /* 在卡片右上角放置一个“x”图层作为UI细节 */
        .profile-card::after {
            content: "";
            position: absolute;
            top: -15px;
            right: -15px;
            width: 60px;
            height: 60px;
            background: url('images/pfiles/x.png') no-repeat center/contain;
            pointer-events: none;
            /* 防止遮挡点击操作 */
            opacity: 0.8;
            z-index: 100;
            /* 确保在最上方 */
        }

        /* 在卡片左下角放一个矩形组装饰 */
        .profile-card::before {
            content: "FILE_DECRYPTED // ARCHIVE";
            position: absolute;
            /* 关键定位：向上偏移一半的高度，刚好压在顶边框正中 */
            top: -10px;
            left: 30px;

            background: #050505;
            /* 必须使用纯色背景来遮断下方的边框线 */
            color: var(--accent-color);
            font-family: 'Vladivostok', sans-serif;
            font-size: 10px;
            padding: 2px 12px;
            border: 1px solid var(--border-color);

            text-shadow: 0 0 8px var(--accent-color);
            letter-spacing: 1px;
            z-index: 10;
        }

        .bg-decor-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: url('images/pfiles/Circles.png') center;
            background-size: 110%;
            /* 稍微放大一点，方便移动 */
            transition: transform 0.1s ease-out;
        }

        /* 确保档案标题也继承该字体 */
        .char-info h2 {
            font-family: 'Vladivostok', sans-serif;
            font-size: 1.8rem;
            color: #fff;
            /* 强制数据文字为白色 */
            margin: 0 0 20px 0;
            letter-spacing: 1px;
            /* 标题可以稍微拉开一点点间距增加仪式感 */
        }

        .char-info {
            /* 核心：确保 grid 容器内的子元素可以收缩到比内容更小 */
            min-width: 0;
            /* 允许在单词内换行，防止长英文名溢出 */
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .char-info h2 {
            /* 针对 Leopold Servantes 这种大标题 */
            word-break: break-word;
            hyphens: auto;
        }

        /* 增加一个全局的暗调噪点层，增加“档案纸张”或“电子噪点”的质感 */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            opacity: 0.08;
            /* 极低透明度，若隐若现 */
            pointer-events: none;
            z-index: 1;
        }

        /* 侧边栏：强化纵向线条感 */
        #directory {
            background: rgba(0, 0, 0, 0.4);
            /* 降低透明度，透出背景的幽光 */
            backdrop-filter: blur(5px);
            border-right: 1px solid var(--border-color);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
        }

        /* 档案卡片：移除杂色，强化蓝色的发光感 */
        .profile-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-color);
            /* 模拟屏幕边缘的微弱反光 */
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.05);
        }

        /* 强化“极夜城”的冷峻风格 */
        .profile-card::before {
            content: "FILE_DECRYPTED // ARCHIVE";
            position: absolute;
            top: -1px;
            /* 压在边框线上 */
            left: 25px;
            background: #050505;
            /* 遮挡下方的框线 */
            padding: 0 10px;
            color: var(--accent-color);
            font-size: 9px;
            letter-spacing: 2px;
            border: 1px solid var(--border-color);
            border-top: none;
            /* 底部与大框融合 */
            z-index: 10;
        }

        /* 附加图片网格 */
        .char-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
        }

        .gallery-item {
            aspect-ratio: 1 / 1;
            /* 强制正方形 */
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 255, 0.2);
            cursor: pointer;
            transition: 0.3s;
        }

        .gallery-item:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Lightbox 增强：加入左右切换 */
        .lightbox-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 20px 15px;
            cursor: pointer;
            font-family: serif;
            font-size: 24px;
            z-index: 2100;
        }

        .lightbox-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        #prevBtn {
            left: 20px;
        }

        #nextBtn {
            right: 20px;
        }

        /* --- 移动端菜单按钮 --- */
        .menu-toggle {
            display: none;
            position: fixed;
            left: 20px;
            top: 20px;
            z-index: 1200;
            cursor: pointer;
            color: var(--accent-color);
            font-size: 24px;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 10px;
            border: 1px solid var(--border-color);
        }

        /* --- 侧边栏 --- */
        #directory {
            width: var(--nav-width);
            height: 100vh;
            border-right: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.95);
            padding: 60px 20px;
            box-sizing: border-box;
            overflow-y: auto;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1150;
        }

        /* 移动端侧边栏适配 */
        @media (max-width: 768px) {
            .home-logo {
                /* 原尺寸的 75%-80% 左右 */
                width: 63px !important;
                height: 63px !important;
                z-index: 1500;
                display: block !important;
            }

            .home-logo img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .menu-toggle {
                display: block;
            }

            #directory {
                position: fixed;
                left: 0;
                top: 0;
                transform: translateX(-100%);
                width: 85%;
                /* 移动端宽度稍宽点好操作 */
            }

            #directory.active {
                transform: translateX(0);
            }
        }

        .faction-group {
            margin-bottom: 10px;
        }

        .faction-title {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .faction-title:hover {
            background: rgba(255, 180, 100, 0.1);
        }

        .faction-title::after {
            content: '→';
            font-size: 10px;
            opacity: 0.3;
            transition: 0.3s;
        }

        .faction-group:not(.collapsed) .faction-title {
            color: #fff;
            border-bottom: 1px solid var(--accent-color);
        }

        .faction-group:not(.collapsed) .faction-title::after {
            transform: rotate(90deg);
            opacity: 1;
        }

        .name-links {
            max-height: 800px;
            overflow: hidden;
            transition: 0.4s ease-in-out;
        }

        .faction-group.collapsed .name-links {
            max-height: 0;
        }

        .name-link {
            display: block;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            padding: 8px 20px;
            font-size: 13px;
            transition: 0.3s;
        }

        .name-link:hover {
            color: var(--accent-color);
            padding-left: 25px;
            background: rgba(255, 180, 100, 0.05);
        }

        /* --- 主内容区 --- */
        main {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 60px;
        }

        @media (max-width: 768px) {
            main {
                padding: 80px 20px 40px 20px;
            }
        }

        .faction-intro-block {
            max-width: 900px;
            margin: 40px auto 60px auto;
            border-left: 2px solid var(--accent-color);
            padding-left: 25px;
            scroll-margin-top: 100px;
        }

        .faction-intro-block h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .faction-intro-text {
            font-size: 14px;
            line-height: 1.8;
            color: #aaa;
        }

        /* 档案卡片 */
        .profile-card {
            max-width: 900px;
            margin: 0 auto 120px auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
            border: 1px solid var(--border-color);
            padding: 35px;
            background: var(--glass-bg);
            position: relative;
            scroll-margin-top: 100px;
        }

        @media (max-width: 900px) {
            .profile-card {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
        }

        .profile-card::before {
            content: "FILE_DECRYPTED";
            /* 修改文案更符合档案感 */
            position: absolute;
            top: -10px;
            left: 25px;
            background: var(--bg-color);
            padding: 0 10px;
            color: var(--accent-color);
            font-size: 9px;
            letter-spacing: 2px;
            border: 1px solid var(--border-color);
            /* 增加一个小边框 */
        }

        .char-thumb-box {
            width: 100%;
            height: 480px;
            background: #000;
            overflow: hidden;
            cursor: zoom-in;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .char-thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .char-info h2 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin: 0 0 20px 0;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .label {
            color: var(--accent-color);
            margin-right: 10px;
        }

        /* --- 找到这部分并替换 --- */
        .data-item {
            display: flex;
            align-items: flex-start;
            font-size: 11px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 0;
            /* 稍微增加上下间距，更有档案感 */
            color: #ffffff;
        }

        .data-value {
            letter-spacing: 0.01em;
            /* 英文稍宽一点点更易读 */
        }

        .label {
            color: var(--accent-color);
            margin-right: 15px;
            flex-shrink: 0;
            width: 90px;
            /* 固定宽度让右侧对齐 */
            text-transform: uppercase;
        }

        /* 右侧内容包装盒 */
        .data-value {
            display: flex;
            flex-direction: column;
            /* 纵向排列中英文 */
            gap: 4px;
            /* 精确控制中英文之间的间距 */
        }

        /* 英文部分专属样式 */
        .en-subtext {
            font-size: 10px;
            /* 英文稍小一点 */
            opacity: 0.5;
            /* 透明度减半，营造辅助资料感 */
            letter-spacing: 0.02em;
            line-height: 1.2;
        }

        /* 中文部分专属样式 */
        .cn-subtext {
            opacity: 1;
            line-height: 1.4;
        }

        .char-desc {
            line-height: 1.8;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9) !important;
            /* 这里必须显式指定高亮色 */
        }

        /* 正文容器 */
        .char-desc {
            display: flex;
            flex-direction: column;
            gap: 1.5em;
            /* 段落之间的间距 */
        }

        /* 正文中的中文 */
        .desc-cn {
    color: rgba(255, 255, 255, 0.95);
    line-height: 1.8;
    font-size: 14px;
    margin-bottom: 10px;
}
        

        /* 正文中的英文 */
        .desc-en {
            color: var(--accent-color);
            /* 或者维持白色但降低透明度 */
            opacity: 0.7;
            font-size: 12px;
            line-height: 1.6;
            border-left: 1px solid rgba(0, 242, 255, 0.2);
            /* 淡淡的左边框装饰线 */
            padding-left: 15px;
          margin-top: 18px;
            /* 让英文紧贴上方的中文段落 */
        }

        /* 专有名词高亮样式 */
.term-highlight {
   color: #88e2e7;
    font-weight: bold;
    text-shadow:none;
    font-weight: 500; /* 不要太粗 */
    padding: 0 1px;
    border-bottom: 1px dashed rgba(0, 242, 255, 0.4);
}

.char-desc {
    margin-top: 20px;
    border-top: 1px solid rgba(0, 242, 255, 0.15);
    padding-top: 12px;
}

/* 折叠按钮 */
.char-desc summary {
    cursor: pointer;
    list-style: none;
    color: var(--accent-color);
    font-size: 11px;
    letter-spacing: 2px;
    opacity: 0.7;
    transition: 0.3s;
    user-select: none;
}

/* 去掉默认三角 */
.char-desc summary::-webkit-details-marker {
    display: none;
}

/* hover */
.char-desc summary:hover {
    opacity: 1;
    text-shadow: 0 0 8px var(--accent-color);
}

/* 展开后的状态 */
.char-desc[open] summary {
    margin-bottom: 10px;
    opacity: 1;
}

/* 自定义箭头 */
.char-desc summary::before {
    content: "▶ ";
    font-size: 10px;
}

.char-desc[open] summary::before {
    content: "▼ ";
}

        /* 悬浮按钮 */
        .nav-controls {
            position: fixed;
            right: 60px;
            /* 与 global.css 保持一致 */
            bottom: 60px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* 两个按钮之间的间距 */
            z-index: 1000;
        }

        /* --- 重新定义 Return 按钮样式 --- */
        .ctrl-btn {
            width: 48px;
            height: 48px;

            /* 基础造型：继承 global.css 的圆环感 */
            border: 1px solid var(--border-color);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);

            /* 内部文字：使用 Vladivostok 字体 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vladivostok', sans-serif;
            font-size: 11px;
            /* 简称使用小号字体更显精致 */
            color: var(--accent-color);
            text-decoration: none;
            letter-spacing: 0;

            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.05);
            text-shadow: 0 0 5px var(--accent-color);
        }

        /* --- 交互反馈 --- */
        .ctrl-btn:hover {
            transform: scale(1.1);
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
            background: rgba(0, 242, 255, 0.1);
        }

        .ctrl-btn:active {
            transform: scale(0.92);
            /* 保持全站统一的点击手感 */
        }

        /* 修正：如果 global.css 里的 scroll-top 默认位置会冲突，
   我们在这里强制重置它的 position 逻辑，让它乖乖待在 flex 容器里 */
        .scroll-top {
            position: static !important;
            /* 撤销 fixed，交给父级 nav-controls 控制 */
            margin: 0;
        }

        #scrollTop {
            opacity: 0;
            visibility: hidden;
        }

        #scrollTop.show {
            opacity: 1;
            visibility: visible;
        }

        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
        }

        /* 背景容器基础样式 */
        .bg-layers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            /* 确保在所有内容和噪点层之下 */
            overflow: hidden;
            background-color: #050505;
        }

        .layer {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            /* 稍微溢出，防止移动时露边 */
            height: 110%;
            background-repeat: repeat;
            background-position: center;
            pointer-events: none;
        }


        /* 1. Dots：深层稳定呼吸 */
        .layer-dots {
            background-image: url('images/pfiles/Dots.png');
            opacity: 1;
            background-size: 1020px;
            /* 稍微拉长周期，让它像背景环境音一样平稳 */
            animation: pulseDots 12s ease-in-out infinite;
        }

        @keyframes pulseDots {

            0%,
            100% {
                opacity: 1.5;
                transform: scale(1);
            }

            50% {
                opacity: 0.9;
                transform: scale(1.01);
                /* 缩放幅度减小，避免晕奶 */
            }
        }

        /* 2. Pattern：星星点点随机亮起 */
        .layer-pattern {
            background-image: url('images/pfiles/Pattern.png');
            opacity: 1;
            /* 基础亮度 */

            /* 使用径向渐变作为遮罩，模拟局部亮起的“聚光灯” */
            -webkit-mask-image: radial-gradient(circle, white 0%, transparent 50%);
            mask-image: radial-gradient(circle, white 0%, transparent 50%);
            mask-size: 300% 300%;
            /* 扩大遮罩尺寸，增加随机感 */

            animation: sparklePattern 12s ease-in-out infinite;
        }

        @keyframes sparklePattern {

            0%,
            100% {
                mask-position: 0% 0%;
                opacity: 0.7;
            }

            25% {
                mask-position: 100% 50%;
                opacity: 1.5;
                /* 随机变亮 */
            }

            50% {
                mask-position: 50% 100%;
                opacity: 0.9;
            }

            75% {
                mask-position: 0% 50%;
                opacity: 1;
                /* 再次变亮 */
            }
        }

        /* 3. x：视差层（仅通过 JS 位移） */
        .layer-x {
            background-image: url('images/pfiles/x.png');
            opacity: 1;
            background-size: 1000px;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            /* 更有质感的平滑过渡 */
            will-change: transform;
            /* 优化性能 */
        }


        /* --- 移动端档案文字溢出修复 --- */
@media (max-width: 768px) {
    /* 1. 让档案项从并排改为上下排列 */
    .data-item {
        flex-direction: column; 
        align-items: flex-start;
        gap: 4px;
        padding: 10px 0;
    }

    /* 2. 取消固定宽度，防止把内容推出去 */
    .label {
        width: auto !important; 
        margin-right: 0;
        font-size: 10px;
        opacity: 0.8;
        top: 0; /* 将它移回边框内一点，或者微调负值 */
        transform: scale(0.8); /* 缩小标签以适应窄屏 */
        left: 5px;
    }

    /* 3. 确保数值区域占满宽度并自动换行 */
    .data-value {
        width: 100%;
        word-break: break-all; /* 强制长单词换行 */
    }

    /* 4. 针对卡片内边距微调，给文字留空间 */
    .profile-card {
        padding: 15px !important;
        overflow:visible !important; 
        margin-top: 20px;
    }

    .char-info h2 {
        font-size: 1.4rem; /* 稍微缩小标题，防止长名字溢出 */
    }
}
/* ==========================================================
   赛博缝合术：精准修复分隔符卡片的居中与宽度问题
   ========================================================== */

/* 1. 抓取空卡片，完全打碎外壳，并且强行铺满整行、内容水平居中 */
.profile-card:has(.data-grid:empty),
.profile-card:not(:has(.data-item)) {
    min-height: auto !important;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;              /* 清空内边距 */
    margin: 70px auto !important;       /* 上下腾出完美的隔离带，水平自动居中 */
    width: 100% !important;             /* 强行撑满父级容器宽度 */
    max-width: 100% !important;
    display: flex !important;           /* 启用 Flex 布局 */
    justify-content: center !important; /* 强制子元素在屏幕水平正中央排列 */
    align-items: center !important;
    box-sizing: border-box !important;
}

/* 2. 彻底抹杀空卡片里连带吐出来的破碎头像、空属性框、多余装饰和各种伪元素线 */
.profile-card:has(.data-grid:empty) .char-thumb-box,
.profile-card:has(.data-grid:empty) .data-grid,
.profile-card:has(.data-grid:empty) .char-desc,
.profile-card:has(.data-grid:empty)::before,
.profile-card:has(.data-grid:empty)::after,
.profile-card:not(:has(.data-item)) .char-thumb-box,
.profile-card:not(:has(.data-item)) .data-grid,
.profile-card:not(:has(.data-item)) .char-desc,
.profile-card:not(:has(.data-item))::before,
.profile-card:not(:has(.data-item))::after {
    display: none !important;
}



/* 4. 格式化第一行：中文标题 */
.profile-card:has(.data-grid:empty) .char-info h2,
.profile-card:not(:has(.data-item)) .char-info h2 {
    display: block !important;
    text-align: center !important;
    margin: 0 !important;
    padding: 0 !important;
    
    /* 严格维持你要求的紧凑方正霓虹感 */
    color: var(--accent-color) !important;
    font-size: 13px !important;
    letter-spacing: 4px !important; 
    font-family: 'Vladivostok', 'Emberly', sans-serif !important;
    text-shadow: 0 0 8px var(--accent-color) !important;
    opacity: 0.9 !important;
}

/* 5. 第二行英文：让空卡片去抓它上方紧挨着的那个 intro-block 的 id */
.profile-card:has(.data-grid:empty) .char-info h2::after,
.profile-card:not(:has(.data-item)) .char-info h2::after {
    /* 核心魔法：直接读取 JS 传给 h2 的 data-en 属性 */
    content: attr(data-en) !important;
    display: block !important;
    text-align: center !important;
    margin-top: 6px !important;         /* 中英文贴合间距 */
    
    /* 辅助英文样式 */
    font-size: 9px !important;
    letter-spacing: 6px !important;     /* 霓虹冷峻拉伸字距 */
    opacity: 0.9 !important;
    color: var(--accent-color) !important;
    text-transform: uppercase !important; /* 强制大写 */
}

/* 6. 装饰线：在文字左侧拉出一条向左淡出的霓虹光束线 */
.profile-card:has(.data-grid:empty) .char-info::before,
.profile-card:not(:has(.data-item)) .char-info::before {
    content: "" !important;
    position: absolute !important;
    top: 50% !important;
    right: 100% !important;             /* 从文字左侧边缘开始 */
    margin-right: 40px !important;      /* 装饰线距离文字的精致留白 */
    transform: translateY(-50%) !important;
    width: 120px !important;            /* 线条长度 */
    height: 1px !important;
    background: linear-gradient(90deg, transparent, var(--accent-color)) !important; /* 向左淡出 */
    opacity: 0.6 !important;
}

/* 7. 装饰线：在文字右侧拉出一条向右淡出的霓虹光束线 */
.profile-card:has(.data-grid:empty) .char-info::after,
.profile-card:not(:has(.data-item)) .char-info::after {
    content: "" !important;
    position: absolute !important;
    top: 50% !important;
    left: 100% !important;              /* 从文字右侧边缘开始 */
    margin-left: 40px !important;       /* 装饰线距离文字的精致留白 */
    transform: translateY(-50%) !important;
    width: 120px !important;            /* 线条长度 */
    height: 1px !important;
    background: linear-gradient(90deg, var(--accent-color), transparent) !important; /* 向右淡出 */
    opacity: 0.6 !important;
}
    </style>
</head>

<body>
    <!-- 在 <body> 最上方添加 -->
    <div class="bg-layers">
        <div class="layer layer-dots"></div>
        <div class="layer layer-pattern"></div>
        <div class="layer layer-x"></div>
    </div>
    <!-- 移动端开关 -->
    <div class="menu-toggle" id="toggleBtn">☰</div>

    <a href="index.html" class="home-logo"><img src="logo.png" alt="Home"></a>

    <nav id="directory"></nav>
    <main id="main-scroll"></main>

    <div class="nav-controls">
        <!-- 使用简称 Rh-P，title 提供悬浮完整文字提示 -->
        <a href="rhapsody.html" class="ctrl-btn" title="Return to Project: Rhapsody in Neon">Rh-P</a>
        <div id="scrollTop" class="scroll-top" onclick="scrollToTop()">↑</div>
    </div>

    <div id="lightbox">
        <div id="prevBtn" class="lightbox-btn" onclick="changeImg(-1); event.stopPropagation();">❮</div>
        <img id="lightbox-img" src="" onclick="event.stopPropagation();">
        <div id="nextBtn" class="lightbox-btn" onclick="changeImg(1); event.stopPropagation();">❯</div>
    </div>

    <script>

        window.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.015;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.015;

            // 只让 x 图层产生较大的位移
            const layerX = document.querySelector('.layer-x');
            if (layerX) {
                layerX.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            // 让 Pattern 图层产生极小的反向位移，增强拉伸感
            const layerPattern = document.querySelector('.layer-pattern');
            if (layerPattern) {
                layerPattern.style.transform = `translate(${-moveX * 0.5}px, ${-moveY * 0.5}px)`;
            }
        });
        const directory = document.getElementById('directory');
        const toggleBtn = document.getElementById('toggleBtn');

        let currentGallery = [];
        let currentIndex = 0;

        toggleBtn.onclick = () => directory.classList.toggle('active');
// 定义需要高亮的专有名词列表
const highlightTerms = [
    "银色毒液", "Silver Venom", 
   
    // 你可以在这里持续添加你想高亮的词汇
];

function applyHighlights(text) {
    if (!text) return text;
    let highlightedText = text;
    
    highlightTerms.forEach(term => {
       const regex = new RegExp(`(${term})`, 'g');
        highlightedText = highlightedText.replace(regex, `<span class="term-highlight">$1</span>`);
    });

    // 2. 手动高亮：识别 JSON 中被星号包裹的词，如 *中立城市*
    highlightedText = highlightedText.replace(/\*(.*?)\*/g, `<span class="term-highlight">$1</span>`);

    return highlightedText;
}

       async function loadPersonnel() {
            try {
                const response = await fetch('personnel.json');
                const data = await response.json();
                const main = document.getElementById('main-scroll');
                const directory = document.getElementById('directory'); // 确保能获取到目录容器

                // --- 优化 1：创建两个“虚拟容器”，避免频繁刷新页面渲染 ---
                const mainFragment = document.createDocumentFragment();
                const dirFragment = document.createDocumentFragment();

                for (const [factionName, factionContent] of Object.entries(data)) {
                    const fId = factionContent.id;

                    const group = document.createElement('div');
                    group.className = 'faction-group collapsed';

                    const title = document.createElement('div');
                    title.className = 'faction-title';
                    title.innerHTML = `<span>${factionName}</span>`;
                    title.onclick = () => {
                        document.getElementById(fId).scrollIntoView({ behavior: 'smooth' });
                        group.classList.toggle('collapsed');
                        if (window.innerWidth <= 768) directory.classList.remove('active');
                    };

                    const linksContainer = document.createElement('div');
                    linksContainer.className = 'name-links';

                    const introSection = document.createElement('div');
                    introSection.className = 'faction-intro-block';
                    introSection.id = fId;

                    let introHtml = '';
                    if (factionContent.intro && factionContent.intro.includes('|')) {
                        const parts = factionContent.intro.split('|');
                        introHtml = `
                            <div class="desc-cn">${applyHighlights(parts[0].trim())}</div>
                            <div class="desc-en">${applyHighlights(parts[1].trim())}</div>
                        `;
                    } else {
                        introHtml = `<div class="faction-intro-text">${applyHighlights(factionContent.intro || '')}</div>`;
                    }

                    introSection.innerHTML = `<h1>${applyHighlights(factionName)}</h1>${introHtml}`;
                    
                    // --- 优化 2：把原本给 main 的内容先塞进虚拟容器 ---
                    mainFragment.appendChild(introSection);

                    if (factionContent.members && factionContent.members.length > 0) {
                        factionContent.members.forEach(member => {
                            if (!member.id) return;

                            const link = document.createElement('a');
                            link.href = `#${member.id}`;
                            link.className = 'name-link';
                            link.innerText = member.id;
                            link.onclick = () => {
                                if (window.innerWidth <= 768) directory.classList.remove('active');
                            };
                            linksContainer.appendChild(link);

                            const card = document.createElement('section');
                            card.className = 'profile-card';
                            card.id = member.id;

                            const allImgs = [member.img];
                            if (member.more_imgs) allImgs.push(...member.more_imgs);
                            const imgsJson = JSON.stringify(allImgs).replace(/"/g, '&quot;');

                            let dataGrid = '';
                            for (const [key, val] of Object.entries(member.data)) {
                                if (val.includes('|')) {
                                    const parts = val.split('|');
                                    dataGrid += `
                                        <div class="data-item">
                                            <span class="label">${key}</span>
                                            <div class="data-value">
                                                <span class="cn-subtext">${applyHighlights(parts[0].trim())}</span>
                                                <span class="en-subtext">${applyHighlights(parts[1].trim())}</span>
                                            </div>
                                        </div>`;
                                } else {
                                    dataGrid += `
                                        <div class="data-item">
                                            <span class="label">${key}</span>
                                            <div class="data-value">
                                                <span class="cn-subtext">${val}</span>
                                            </div>
                                        </div>`;
                                }
                            }

                            card.innerHTML = `
                                <div class="char-thumb-box" onclick="openFull(${imgsJson}, 0)">
                                    <img src="${member.img}" loading="lazy">
                                </div>
                               <div class="char-info">
    <h2 data-en="${member.id}">${member.name}</h2>
    <div class="data-grid">${dataGrid}</div>
                                 <details class="char-desc">
    <summary>ARCHIVE DESCRIPTION</summary>

    ${(() => {
        if (member.desc.includes('|')) {
            const descParts = member.desc.split('|');
            return `
                <div class="desc-cn">${applyHighlights(descParts[0].trim())}</div>
                <div class="desc-en">${applyHighlights(descParts[1].trim())}</div>
            `;
        }
        return member.desc;
    })()}
</details>
                                    <div class="gallery-container"></div>
                                </div>
                            `;

                            if (member.more_imgs && member.more_imgs.length > 0) {
                                const gallery = document.createElement('div');
                                gallery.className = 'char-gallery';
                                member.more_imgs.forEach((imgSrc, index) => {
                                    const item = document.createElement('div');
                                    item.className = 'gallery-item';
                                    item.innerHTML = `<img src="${imgSrc}" loading="lazy">`;
                                    item.onclick = () => openFull(allImgs, index + 1);
                                    gallery.appendChild(item);
                                });
                                card.querySelector('.gallery-container').appendChild(gallery);
                            }
                            // --- 优化 3：把卡片也先塞进虚拟容器 ---
                            mainFragment.appendChild(card);
                        });
                    }

                    group.appendChild(title);
                    group.appendChild(linksContainer);
                    // --- 优化 4：把目录组也先塞进虚拟容器 ---
                    dirFragment.appendChild(group);
                }

                // --- 优化总结：在这里最后一步，才真正操作网页，一次性渲染 ---
                main.appendChild(mainFragment);
                directory.appendChild(dirFragment);

            } catch (e) { console.error("Data error:", e); }
        }

        function openFull(imgs, index) {
            currentGallery = imgs;
            currentIndex = index;
            document.getElementById('lightbox').style.display = 'flex';
            updateLightbox();
        }

        function updateLightbox() {
            const lbImg = document.getElementById('lightbox-img');
            lbImg.src = currentGallery[currentIndex];
            const showBtns = currentGallery.length > 1 ? 'block' : 'none';
            document.getElementById('prevBtn').style.display = showBtns;
            document.getElementById('nextBtn').style.display = showBtns;
        }

        function changeImg(step) {
            currentIndex = (currentIndex + step + currentGallery.length) % currentGallery.length;
            updateLightbox();
        }

        document.getElementById('lightbox').onclick = function () {
            this.style.display = 'none';
        };

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('lightbox').style.display === 'flex') {
                if (e.key === "ArrowLeft") changeImg(-1);
                if (e.key === "ArrowRight") changeImg(1);
                if (e.key === "Escape") document.getElementById('lightbox').style.display = 'none';
            }
        });

        function scrollToTop() { document.getElementById('main-scroll').scrollTo({ top: 0, behavior: 'smooth' }); }
        document.getElementById('main-scroll').onscroll = function () {
            const btn = document.getElementById('scrollTop');
            if (btn) btn.classList.toggle('show', this.scrollTop > 400);
        };

        loadPersonnel();
        // 识别 JSON 中被星号包裹的词：*高亮内容*
highlightedText = highlightedText.replace(/\*(.*?)\*/g, `<span class="term-highlight">$1</span>`);
  
document.addEventListener('DOMContentLoaded', () => {
    loadPersonnel(); // 确保 DOM 骨架一旦就绪就开始读取数据
});
   </script>
</body>

</html>
