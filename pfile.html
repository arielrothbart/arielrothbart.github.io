<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <link rel="preconnect" href="images/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnel Files | Rhapsody in Neon</title>
    <!-- 假设 global.css 在同一目录 -->
    <link rel="stylesheet" href="global.css">

    <style>
        .scroll-top {
            border-color: var(--accent-color);
            color: var(--accent-color);
            text-shadow: 0 0 6px var(--accent-color);
        }

        /* 1. 引入自定义字体 */
        @font-face {
            font-family: 'Vladivostok';
            src: url('fonts/Vladivostiok-Bold.woff2') format('woff2'),
                url('fonts/Vladivostiok-Bold.woff') format('woff');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #050505;
            --accent-color: #00f2ff;
            --border-color: rgba(0, 242, 255, 0.2);
            --text-main: #ffffff;
            --glass-bg: linear-gradient(90deg, rgba(0, 242, 255, 0.05) 0%, transparent 100%);
            --nav-width: 300px;
        }

        body {
            animation: fadeInPage 0.8s ease-in-out;
            margin: 0;
            background:
                url('images/pfiles/x.png') center/cover no-repeat fixed,
                url('images/pfiles/Dots.png') center/cover no-repeat fixed,
                url('images/pfiles/Circles.png') center/cover no-repeat fixed,
                url('images/pfiles/Rectangles.png') center/cover no-repeat fixed,
                url('images/pfiles/Pattern.png') center/cover no-repeat fixed,
                #050505;
            background-blend-mode: screen;
            font-family: 'Vladivostok', 'Emberly', sans-serif;
            letter-spacing: 0.02em;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes fadeInPage {
            from { opacity: 0; filter: brightness(0.5); }
            to { opacity: 1; filter: brightness(1); }
        }

        /* 档案卡片容器 */
        .profile-card {
            max-width: 900px;
            margin: 0 auto 120px auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
            padding: 35px;
            position: relative;
            scroll-margin-top: 100px;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 242, 255, 0.05);
            will-change: transform, opacity; 
            transform: translateZ(0);       
            backface-visibility: hidden;
            z-index: 1; 
        }

        /* 在卡片右上角放置一个“x”图层作为UI细节 */
        .profile-card::after {
            content: "";
            position: absolute;
            top: -15px;
            right: -15px;
            width: 60px;
            height: 60px;
            background: url('images/pfiles/x.png') no-repeat center/contain;
            pointer-events: none;
            opacity: 0.8;
            z-index: 100;
        }

        /* 在卡片左上角放一个矩形组装饰标签（还原凸起样式） */
        .profile-card::before {
            content: "FILE_DECRYPTED // ARCHIVE";
            position: absolute;
            top: -11px; /* 向上移动，骑在边框线上 */
            left: 30px;
            background: #050505; /* 纯色背景用来遮挡压住的边框线 */
            color: var(--accent-color);
            font-family: 'Vladivostok', sans-serif;
            font-size: 9px;
            padding: 2px 10px;
            border: 1px solid var(--border-color); /* 还原完整边框 */
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--accent-color);
            z-index: 10;
        }

        /* 确保文字内容层级高于水印，避免被水印遮挡 */
        .char-info, .char-thumb-box {
            position: relative;
            z-index: 2;
        }

        .bg-decor-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: url('images/pfiles/Circles.png') center;
            background-size: 110%;
            transition: transform 0.1s ease-out;
        }

        .char-info {
            min-width: 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
            position: relative; 
            z-index: 2;         
        }

        .char-info h2 {
            font-family: 'Vladivostok', sans-serif;
            font-size: 1.8rem;
            color: var(--accent-color);
            margin: 0 0 20px 0;
            letter-spacing: 1px;
            word-break: break-word;
            hyphens: auto;
        }

        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            opacity: 0.08; pointer-events: none; z-index: 1;
        }

        #directory {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border-right: 1px solid var(--border-color);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            width: var(--nav-width);
            height: 100vh;
            padding: 60px 20px;
            box-sizing: border-box;
            overflow-y: auto;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1150;
        }

        .char-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
        }

        .gallery-item {
            aspect-ratio: 1 / 1;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 255, 0.2);
            cursor: pointer;
            transition: 0.3s;
        }

        .gallery-item:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .lightbox-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5); color: var(--accent-color);
            border: 1px solid var(--border-color); padding: 20px 15px;
            cursor: pointer; font-family: serif; font-size: 24px; z-index: 2100;
        }

        .lightbox-btn:hover { background: var(--accent-color); color: #000; }
        #prevBtn { left: 20px; }
        #nextBtn { right: 20px; }

        .menu-toggle {
            display: none; position: fixed; left: 20px; top: 20px; z-index: 1200;
            cursor: pointer; color: var(--accent-color); font-size: 24px;
            background: rgba(0, 0, 0, 0.8); padding: 5px 10px; border: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .home-logo { width: 63px !important; height: 63px !important; z-index: 1500; display: block !important; }
            .home-logo img { width: 100%; height: 100%; object-fit: contain; }
            .menu-toggle { display: block; }
            #directory { position: fixed; left: 0; top: 0; transform: translateX(-100%); width: 85%; }
            #directory.active { transform: translateX(0); }
        }

        .faction-group { margin-bottom: 10px; }
        .faction-title {
            font-size: 11px; letter-spacing: 1px; color: var(--accent-color);
            border-bottom: 1px solid var(--border-color); padding: 12px 10px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
            user-select: none;
        }
        .faction-title:hover { background: rgba(255, 180, 100, 0.1); }
        .faction-title::after { content: '→'; font-size: 10px; opacity: 0.3; transition: 0.3s; }
        .faction-group:not(.collapsed) .faction-title { color: #fff; border-bottom: 1px solid var(--accent-color); }
        .faction-group:not(.collapsed) .faction-title::after { transform: rotate(90deg); opacity: 1; }
        .name-links { max-height: 800px; overflow: hidden; transition: 0.4s ease-in-out; }
        .faction-group.collapsed .name-links { max-height: 0; }
        .name-link { display: block; color: rgba(255, 255, 255, 0.4); text-decoration: none; padding: 8px 20px; font-size: 13px; transition: 0.3s; }
        .name-link:hover { color: var(--accent-color); padding-left: 25px; background: rgba(255, 180, 100, 0.05); }

        /* 还原侧边栏分隔栏（如 BLACK MARKET STRAYS）样式 */
        .name-link[href^="#——"] {
            font-size: 10px !important;
            color: rgba(255, 255, 255, 0.2) !important;
            letter-spacing: 1px;
            padding-top: 16px !important; 
            padding-bottom: 4px !important;
            background: transparent !important;
            /* 这里去掉了 pointer-events: none; 以恢复点击跳转功能 */
        }

        /* 新增：阻止分隔栏在悬浮时像普通链接那样向右缩进，但微微提亮以作为点击反馈 */
        .name-link[href^="#——"]:hover {
            color: rgba(255, 255, 255, 0.4) !important;
            padding-left: 20px !important; /* 强制维持原缩进，不向右偏移 */
        }

        /* 新增：如果某个阵营的第一个项目是普通人物（如LOS船长），增加一点顶部间距，不要紧挨着标题线 */
        .name-links > .name-link:first-child:not([href^="#——"]) {
            margin-top: 12px;
        }

        main { flex: 1; overflow-y: auto; scroll-behavior: smooth; padding: 60px; }
        @media (max-width: 768px) { main { padding: 80px 20px 40px 20px; } }

        .faction-intro-block {
            max-width: 900px; margin: 40px auto 60px auto; border-left: 2px solid var(--accent-color);
            padding-left: 25px; scroll-margin-top: 100px;
        }
        .faction-intro-block h1 { font-size: 1.5rem; color: var(--accent-color); margin-bottom: 15px; }
        .faction-intro-text { font-size: 14px; line-height: 1.8; color: #aaa; }

        @media (max-width: 900px) {
            .profile-card { grid-template-columns: 1fr; gap: 20px; padding: 20px; }
        }

        .char-thumb-box {
            width: 100%; height: 480px; background: #000; overflow: hidden;
            cursor: zoom-in; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .char-thumb-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }

        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        
        .data-item {
            display: flex; align-items: flex-start; font-size: 11px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 0; color: #ffffff;
        }
        .label {
            color: var(--accent-color); margin-right: 15px; flex-shrink: 0;
            width: 90px; text-transform: uppercase;
        }
        .data-value { display: flex; flex-direction: column; gap: 4px; letter-spacing: 0.01em; }
        .en-subtext { font-size: 10px; opacity: 0.5; letter-spacing: 0.02em; line-height: 1.2; }
        .cn-subtext { opacity: 1; line-height: 1.4; }

        .char-desc {
            display: flex; flex-direction: column; gap: 1.5em;
            margin-top: 20px; border-top: 1px solid rgba(0, 242, 255, 0.15); padding-top: 12px;
        }
        .desc-cn { color: rgba(255, 255, 255, 0.95); line-height: 1.8; font-size: 14px; margin-bottom: 10px; }
        .desc-en {
            color: var(--accent-color); opacity: 0.7; font-size: 12px; line-height: 1.6;
            border-left: 1px solid rgba(0, 242, 255, 0.2); padding-left: 15px; margin-top: 18px;
        }
        .term-highlight {
            color: #88e2e7; font-weight: 500; padding: 0 1px;
            border-bottom: 1px dashed rgba(0, 242, 255, 0.4); text-shadow: none;
        }

        .char-desc summary {
            cursor: pointer; list-style: none; color: var(--accent-color);
            font-size: 11px; letter-spacing: 2px; opacity: 0.7; transition: 0.3s; user-select: none;
        }
        .char-desc summary::-webkit-details-marker { display: none; }
        .char-desc summary:hover { opacity: 1; text-shadow: 0 0 8px var(--accent-color); }
        .char-desc[open] summary { margin-bottom: 10px; opacity: 1; }
        .char-desc summary::before { content: "▶ "; font-size: 10px; }
        .char-desc[open] summary::before { content: "▼ "; }

        .nav-controls {
            position: fixed; right: 60px; bottom: 60px;
            display: flex; flex-direction: column; gap: 15px; z-index: 1000;
        }

        .ctrl-btn {
            width: 48px; height: 48px; border: 1px solid var(--border-color); border-radius: 50%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Vladivostok', sans-serif; font-size: 11px; color: var(--accent-color);
            text-decoration: none; letter-spacing: 0; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.05); text-shadow: 0 0 5px var(--accent-color);
        }
        .ctrl-btn:hover {
            transform: scale(1.1); border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); background: rgba(0, 242, 255, 0.1);
        }
        .ctrl-btn:active { transform: scale(0.92); }

        .scroll-top { position: static !important; margin: 0; }
        #scrollTop { opacity: 0; visibility: hidden; }
        #scrollTop.show { opacity: 1; visibility: visible; }

        #lightbox {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
            z-index: 2000; justify-content: center; align-items: center; cursor: zoom-out;
        }
        #lightbox img { max-width: 90%; max-height: 90%; }

        .bg-layers { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; background-color: #050505; }
        .layer { position: absolute; top: -5%; left: -5%; width: 110%; height: 110%; background-repeat: repeat; background-position: center; pointer-events: none; }
        .layer-dots { background-image: url('images/pfiles/Dots.png'); opacity: 1; background-size: 1020px; animation: pulseDots 12s ease-in-out infinite; }
        @keyframes pulseDots { 0%, 100% { opacity: 1.5; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.01); } }
        .layer-pattern {
            background-image: url('images/pfiles/Pattern.png'); opacity: 1;
            mask-image: radial-gradient(circle, white 0%, transparent 50%);
            -webkit-mask-image: radial-gradient(circle, white 0%, transparent 50%);
            mask-size: 300% 300%; animation: sparklePattern 12s ease-in-out infinite;
        }
        @keyframes sparklePattern {
            0%, 100% { mask-position: 0% 0%; opacity: 0.7; }
            25% { mask-position: 100% 50%; opacity: 1.5; }
            50% { mask-position: 50% 100%; opacity: 0.9; }
            75% { mask-position: 0% 50%; opacity: 1; }
        } /* 【重要修复】之前这里漏了一个大括号，导致下面所有CSS全毁了 */

        /* ==========================================================
           恢复的 CSS：精准修复分隔符卡片的居中与宽度问题
           ========================================================== */
        .profile-card:has(.data-grid:empty),
        .profile-card:not(:has(.data-item)) {
            min-height: auto !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 70px auto !important;
            width: 100% !important;
            max-width: 100% !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            box-sizing: border-box !important;
        }

        .profile-card:has(.data-grid:empty) .char-thumb-box,
        .profile-card:has(.data-grid:empty) .data-grid,
        .profile-card:has(.data-grid:empty) .char-desc,
        .profile-card:has(.data-grid:empty)::before,
        .profile-card:has(.data-grid:empty)::after,
        .profile-card:not(:has(.data-item)) .char-thumb-box,
        .profile-card:not(:has(.data-item)) .data-grid,
        .profile-card:not(:has(.data-item)) .char-desc,
        .profile-card:not(:has(.data-item))::before,
        .profile-card:not(:has(.data-item))::after {
            display: none !important;
        }

        .profile-card:has(.data-grid:empty) .char-info h2,
        .profile-card:not(:has(.data-item)) .char-info h2 {
            display: block !important;
            text-align: center !important;
            margin: 0 !important;
            padding: 0 !important;
            color: var(--accent-color) !important;
            font-size: 13px !important;
            letter-spacing: 4px !important; 
            font-family: 'Vladivostok', 'Emberly', sans-serif !important;
            text-shadow: 0 0 8px var(--accent-color) !important;
            opacity: 0.9 !important;
        }

        .profile-card:has(.data-grid:empty) .char-info h2::after,
        .profile-card:not(:has(.data-item)) .char-info h2::after {
            content: attr(data-en) !important;
            display: block !important;
            text-align: center !important;
            margin-top: 6px !important;
            font-size: 9px !important;
            letter-spacing: 6px !important;
            opacity: 0.9 !important;
            color: var(--accent-color) !important;
            text-transform: uppercase !important;
        }

        /* ============== 阵营徽章 / 印章水印样式 (右上角) ============== */
        .faction-watermark {
            position: absolute;
            top: 25px;             
            right: 35px;
            width: 180px;          
            height: 180px;
            opacity: 0.25;         /* 【修复】透明度上调，防止被毛玻璃背景隐藏 */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: top right;
            pointer-events: none;  
            z-index: 10;           /* 【修复】提到了比背景高的层级 */
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 10px var(--accent-color)); 
            transition: all 0.5s ease;
        }

        .profile-card:hover .faction-watermark {
            opacity: 0.4;          /* 悬停时也会变更亮 */
            transform: scale(1.05);
        }

        /* 空卡片(如分隔栏)时不显示水印 */
        .profile-card:has(.data-grid:empty) .faction-watermark,
        .profile-card:not(:has(.data-item)) .faction-watermark {
            display: none !important;
        }
        /* ======================================================== */
/* =========================================
           移动端文字溢出终极修复 (直接加在最底部即可)
           ========================================= */
        @media (max-width: 768px) {
            .data-grid { gap: 10px; }
            .data-item { 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 4px; 
                padding: 10px 0; 
                min-width: 0; 
            }
            .label { 
                width: auto !important; 
                margin-right: 0; 
                font-size: 10px; 
                opacity: 0.8; 
                transform: scale(0.9); 
                transform-origin: left; 
            }
            .data-value { 
                width: 100%; 
                min-width: 0; 
                word-break: normal; 
                overflow-wrap: break-word; 
            }
            .profile-card { 
                padding: 15px !important; 
                overflow: visible !important; 
                margin-top: 20px; 
                box-sizing: border-box; 
            }
            .char-info h2 { font-size: 1.4rem; }
        }
    </style>
</head>

<body>
    <div class="bg-layers">
        <div class="layer layer-dots"></div>
        <div class="layer layer-pattern"></div>
        <div class="layer layer-x"></div>
    </div>
    <div class="menu-toggle" id="toggleBtn">☰</div>
    <a href="index.html" class="home-logo"><img src="logo.png" alt="Home" onerror="this.style.display='none'"></a>

    <nav id="directory"></nav>
    <main id="main-scroll"></main>

    <div class="nav-controls">
        <a href="rhapsody.html" class="ctrl-btn" title="Return to Project: Rhapsody in Neon">Rh-P</a>
        <div id="scrollTop" class="scroll-top" onclick="scrollToTop()">↑</div>
    </div>

    <div id="lightbox">
        <div id="prevBtn" class="lightbox-btn" onclick="changeImg(-1); event.stopPropagation();">❮</div>
        <img id="lightbox-img" src="" onclick="event.stopPropagation();">
        <div id="nextBtn" class="lightbox-btn" onclick="changeImg(1); event.stopPropagation();">❯</div>
    </div>

    <script>
        window.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.015;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.015;
            const layerX = document.querySelector('.layer-x');
            if (layerX) layerX.style.transform = `translate(${moveX}px, ${moveY}px)`;
            const layerPattern = document.querySelector('.layer-pattern');
            if (layerPattern) layerPattern.style.transform = `translate(${-moveX * 0.5}px, ${-moveY * 0.5}px)`;
        });

        const directory = document.getElementById('directory');
        const toggleBtn = document.getElementById('toggleBtn');
        let currentGallery = [];
        let currentIndex = 0;

        toggleBtn.onclick = () => directory.classList.toggle('active');

        const highlightTerms = ["银色毒液", "Silver Venom"];

        function applyHighlights(text) {
            if (!text) return text;
            let highlightedText = text;
            highlightTerms.forEach(term => {
                const regex = new RegExp(`(${term})`, 'g');
                highlightedText = highlightedText.replace(regex, `<span class="term-highlight">$1</span>`);
            });
            highlightedText = highlightedText.replace(/\*(.*?)\*/g, `<span class="term-highlight">$1</span>`);
            return highlightedText;
        }

        async function loadPersonnel() {
            try {
                const response = await fetch('personnel.json');
                const data = await response.json();
                const main = document.getElementById('main-scroll');
                const directory = document.getElementById('directory');

                const mainFragment = document.createDocumentFragment();
                const dirFragment = document.createDocumentFragment();

                for (const [factionName, factionContent] of Object.entries(data)) {
                    const fId = factionContent.id;
                    const factionBadge = factionContent.badge; // 提取阵营徽章

                    const group = document.createElement('div');
                    group.className = 'faction-group collapsed';

                    const title = document.createElement('div');
                    title.className = 'faction-title';
                    title.innerHTML = `<span>${factionName}</span>`;
                    title.onclick = () => {
                        // 【修复】：彻底移除了 scrollIntoView 页面跳转功能
                        group.classList.toggle('collapsed');
                    };

                    const linksContainer = document.createElement('div');
                    linksContainer.className = 'name-links';

                    const introSection = document.createElement('div');
                    introSection.className = 'faction-intro-block';
                    introSection.id = fId;

                    let introHtml = '';
                    if (factionContent.intro && factionContent.intro.includes('|')) {
                        const parts = factionContent.intro.split('|');
                        introHtml = `<div class="desc-cn">${applyHighlights(parts[0].trim())}</div>
                                     <div class="desc-en">${applyHighlights(parts[1].trim())}</div>`;
                    } else {
                        introHtml = `<div class="faction-intro-text">${applyHighlights(factionContent.intro || '')}</div>`;
                    }

                    introSection.innerHTML = `<h1>${applyHighlights(factionName)}</h1>${introHtml}`;
                    mainFragment.appendChild(introSection);

                    if (factionContent.members && factionContent.members.length > 0) {
                        factionContent.members.forEach(member => {
                            if (!member.id) return;

                            const link = document.createElement('a');
                            link.href = `#${member.id}`;
                            link.className = 'name-link';
                            link.innerText = member.id;
                            link.onclick = () => { if (window.innerWidth <= 768) directory.classList.remove('active'); };
                            linksContainer.appendChild(link);

                            const card = document.createElement('section');
                            card.className = 'profile-card';
                            card.id = member.id;

                            const allImgs = [member.img];
                            if (member.more_imgs) allImgs.push(...member.more_imgs);
                            const imgsJson = JSON.stringify(allImgs).replace(/"/g, '&quot;');

                            let dataGrid = '';
                            for (const [key, val] of Object.entries(member.data)) {
                                if (val.includes('|')) {
                                    const parts = val.split('|');
                                    dataGrid += `<div class="data-item"><span class="label">${key}</span>
                                        <div class="data-value"><span class="cn-subtext">${applyHighlights(parts[0].trim())}</span>
                                        <span class="en-subtext">${applyHighlights(parts[1].trim())}</span></div></div>`;
                                } else {
                                    dataGrid += `
                                        <div class="data-item">
                                            <span class="label">${key}</span>
                                            <div class="data-value">
                                                <span class="cn-subtext">${val}</span>
                                            </div>
                                        </div>`;
                                }
                            }

                            // ============== 核心注入逻辑：生成徽章代码 ==============
                            const targetBadge = member.badge || factionBadge;
                            let watermarkHtml = '';
                            if (targetBadge) {
                                watermarkHtml = `<div class="faction-watermark" style="background-image: url('${targetBadge}')"></div>`;
                            }

                            card.innerHTML = `
                                ${watermarkHtml} <!-- 注入水印图层 -->
                                <div class="char-thumb-box" onclick="openFull(${imgsJson}, 0)">
                                    <img src="${member.img}" loading="lazy">
                                </div>
                               <div class="char-info">
    <h2 data-en="${member.id}">${member.name}</h2>
                                    <div class="data-grid">${dataGrid}</div>
                                    <details class="char-desc">
                                        <summary>ARCHIVE DESCRIPTION</summary>
                                        ${(() => {
                                            if (member.desc && member.desc.includes('|')) {
                                                const descParts = member.desc.split('|');
                                                return `<div class="desc-cn">${applyHighlights(descParts[0].trim())}</div>
                                                        <div class="desc-en">${applyHighlights(descParts[1].trim())}</div>`;
                                            }
                                            return member.desc || '';
                                        })()}
                                    </details>
                                    <div class="gallery-container"></div>
                                </div>
                            `;

                            if (member.more_imgs && member.more_imgs.length > 0) {
                                const gallery = document.createElement('div');
                                gallery.className = 'char-gallery';
                                member.more_imgs.forEach((imgSrc, index) => {
                                    const item = document.createElement('div');
                                    item.className = 'gallery-item';
                                    item.innerHTML = `<img src="${imgSrc}" loading="lazy" onerror="this.style.display='none'">`;
                                    item.onclick = () => openFull(allImgs, index + 1);
                                    gallery.appendChild(item);
                                });
                                card.querySelector('.gallery-container').appendChild(gallery);
                            }
                            mainFragment.appendChild(card);
                        });
                    }
                    group.appendChild(title);
                    group.appendChild(linksContainer);
                    dirFragment.appendChild(group);
                }

                main.appendChild(mainFragment);
                directory.appendChild(dirFragment);

            } catch (e) { console.error("Data error:", e); }
        }

        function openFull(imgs, index) {
            currentGallery = imgs;
            currentIndex = index;
            document.getElementById('lightbox').style.display = 'flex';
            updateLightbox();
        }

        function updateLightbox() {
            const lbImg = document.getElementById('lightbox-img');
            lbImg.src = currentGallery[currentIndex];
            const showBtns = currentGallery.length > 1 ? 'block' : 'none';
            document.getElementById('prevBtn').style.display = showBtns;
            document.getElementById('nextBtn').style.display = showBtns;
        }

        function changeImg(step) {
            currentIndex = (currentIndex + step + currentGallery.length) % currentGallery.length;
            updateLightbox();
        }

        document.getElementById('lightbox').onclick = function () { this.style.display = 'none'; };

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('lightbox').style.display === 'flex') {
                if (e.key === "ArrowLeft") changeImg(-1);
                if (e.key === "ArrowRight") changeImg(1);
                if (e.key === "Escape") document.getElementById('lightbox').style.display = 'none';
            }
        });

        function scrollToTop() { document.getElementById('main-scroll').scrollTo({ top: 0, behavior: 'smooth' }); }
        document.getElementById('main-scroll').onscroll = function () {
            const btn = document.getElementById('scrollTop');
            if (btn) btn.classList.toggle('show', this.scrollTop > 400);
        };

document.addEventListener('DOMContentLoaded', () => {
    loadPersonnel(); // 确保 DOM 骨架一旦就绪就开始读取数据
});
   </script>
</body>

</html>
