<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transmission</title>

<style>
body{
  margin:0;
  background:black;
  color:#eaeaea;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  overflow:hidden;
  transition:opacity 0.6s ease;
}

/* 容器 */
.lines{
  position:relative;
  width:80%;
  max-width:700px;
  text-align:center;
}

/* 每一句 */
.line{
  position:absolute;
  width:100%;
  left:0;
  top:50%;
  transform:translateY(-50%);
  
  opacity:0;
  line-height:1.8;
  font-size:20px;
  letter-spacing:1px;

  transition:opacity 1.2s ease;

  /* 轻微质感 */
  text-shadow:0 0 8px rgba(255,255,255,0.15);
}

/* 当前显示 */
.line.active{
  opacity:1;
  animation:fadeIn 1.6s ease;
}

/* 出现动画（电影感） */
@keyframes fadeIn{
  from{
    opacity:0;
    filter:brightness(0.6);
    transform:translateY(10px);
  }
  to{
    opacity:1;
    filter:brightness(1);
    transform:translateY(-50%);
  }
}

/* Skip */
.skip{
  position:absolute;
  top:20px;
  right:30px;
  font-size:12px;
  opacity:0.4;
  cursor:pointer;
}
.skip:hover{
  opacity:0.8;
}

/* 非破坏性“机械扰动” */
body::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(
    transparent 96%,
    rgba(255,255,255,0.04) 100%
  );
  animation:scan 6s linear infinite;
  pointer-events:none;
}

@keyframes scan{
  0%{transform:translateY(-100%);}
  100%{transform:translateY(100%);}
}
</style>
</head>

<body>

<div class="skip" onclick="skip()">Skip Transmission</div>

<div class="lines">

  <p class="line">
    2020. This is the age of the Aetherial Tide.<br>
    AT 0年，世界进入洋流纪元
  </p>

  <p class="line">
    Magnetofluid currents above. Signals fracture.<br>
    磁海组成天空洋流，令通讯碎裂。
  </p>

  <p class="line">
    AT 66. Synthetic failures emerge in Kaamos City.<br>
    AT 66年 义体失控的悲剧在极夜城中悄然酝酿。
  </p>

</div>

<script>
let index = 0;
const lines = document.querySelectorAll(".line");

/* 初始第一句 */
window.onload = () => {
  setTimeout(()=>{
    lines[0].classList.add("active");
  }, 300);
};

/* 点击推进（电影节奏） */
function nextLine(){

  // 当前句淡出
  lines[index].classList.remove("active");

  setTimeout(()=>{

    if(index < lines.length - 1){
      index++;

      // 下一句出现
      lines[index].classList.add("active");

    }else{
      enterWorld();
    }

  }, 1200);
}

document.body.addEventListener("click", nextLine);

/* 跳过 */
function skip(){
  enterWorld();
}

/* 进入世界 */
function enterWorld(){
  document.body.style.opacity = 0;
  setTimeout(()=>{
    window.location.href = "rhapsody.html";
  }, 500);
}
</script>

</body>
</html>
