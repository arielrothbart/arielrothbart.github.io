<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rhapsody in Neon</title>

<style>
body{
  margin:0;
  background:#050505;
  color:#eaeaea;
  font-family:sans-serif;
  overflow:hidden;
}

/* ===== Home 按钮 ===== */
.home-logo{
  position:fixed;
  top:30px;
  left:30px;
  z-index:10;
  opacity:0.6;
  transition:0.3s;
}
.home-logo img{
  width:50px;
}
.home-logo:hover{
  opacity:1;
  transform:scale(1.1);
}

/* ===== 标题（你可以换成图片）===== */
.title{
  position:absolute;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  opacity:0.8;
  letter-spacing:3px;
}

/* ===== 世界地图容器 ===== */
.world-map{
  position:relative;
  width:100%;
  height:100vh;
}

/* ===== 节点 ===== */
.node{
  position:absolute;
  width:260px;
  text-align:center;
  cursor:pointer;
}

/* 海报 */
.node img{
  width:100%;
  display:block;
  opacity:0.5;
  transition:0.4s ease;
  filter:brightness(0.6);
}

/* hover */
.node:hover img{
  opacity:1;
  transform:scale(1.05);
  filter:brightness(1.1);
}

/* 标题 */
.node-title{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:none;
}

.node-title h3{
  margin:0;
  font-size:18px;
  letter-spacing:1px;
}

.node-title p{
  margin-top:6px;
  font-size:13px;
  opacity:0.7;
}

/* ===== 中心 ===== */
.rin{
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

/* 左 */
.chronicle{
  left:15%;
  top:45%;
}

/* 右 */
.files{
  right:15%;
  top:45%;
}

/* 下 */
.polyphony{
  left:50%;
  bottom:10%;
  transform:translateX(-50%);
  opacity:0.6;
}

/* ===== 连接线 ===== */
.line{
  position:absolute;
  background:rgba(255,255,255,0.1);
}

/* 横线 */
.line-h{
  height:1px;
}

/* 竖线 */
.line-v{
  width:1px;
}

/* 中心十字 */
.line.center-h{
  top:50%;
  left:20%;
  width:60%;
}

.line.center-v{
  left:50%;
  top:30%;
  height:50%;
}

/* glow（很轻） */
.line::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,200,255,0.15);
  filter:blur(4px);
  opacity:0.5;
}
</style>
</head>

<body>

<!-- Home -->
<a href="index.html" class="home-logo">
  <img src="logo.png">
</a>

<!-- 标题（你可以换成图片） -->
<div class="title">
  <h2>Rhapsody in Neon</h2>
</div>

<div class="world-map">

  <!-- 连接线 -->
  <div class="line line-h center-h"></div>
  <div class="line line-v center-v"></div>

  <!-- 中心 -->
  <a href="#" class="node rin">
    <img src="images/rin.jpg">
    <div class="node-title">
      <h3>Rhapsody in Neon</h3>
      <p>霓虹狂想曲</p>
    </div>
  </a>

  <!-- 左 -->
  <a href="#" class="node chronicle">
    <img src="images/tcc.jpg">
    <div class="node-title">
      <h3>The Celestial Chronicle</h3>
      <p>苍穹列记</p>
    </div>
  </a>

  <!-- 右 -->
  <a href="#" class="node files">
    <img src="images/files.jpg">
    <div class="node-title">
      <h3>Personnel Files</h3>
      <p>人物档案</p>
    </div>
  </a>

  <!-- 下 -->
  <a href="construction.html" class="node polyphony">
    <img src="images/poly.jpg">
    <div class="node-title">
      <h3>Polifonía: Enroque</h3>
      <p>复调：王车易位</p>
    </div>
  </a>

</div>

</body>
</html>
