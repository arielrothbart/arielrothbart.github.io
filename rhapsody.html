<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* --- 1. 基础环境 --- */
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Emberly', 'Microsoft YaHei', sans-serif;
            overflow: hidden; 
        }

        /* --- 2. 电脑端 16:9 场景 --- */
        .ui-scene {
            position: absolute;
            aspect-ratio: 16 / 9;
            width: 100vw; height: 56.25vw;
            max-height: 100vh; max-width: 177.78vh;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            scale: 1.05;
            z-index: 1;
        }
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 2; pointer-events: none; }
        .video-target-box { position: absolute; left: 71.22%; top: 61.66%; width: 10.1%; height: 11.75%; z-index: 1; overflow: hidden; background: #000; }
        #mini-video { width: 100%; height: 100%; object-fit: cover; }
        .ship-main { position: absolute; z-index: 3; width: 45%; left: 50%; top: 45%; transform: translate(-50%, -50%); filter: drop-shadow(0 0 30px rgba(0, 238, 255, 0.2)); animation: shipHover 5s ease-in-out infinite; }
        @keyframes shipHover { 0%, 100% { transform: translate(-50%, -50%) translateY(0); } 50% { transform: translate(-50%, -50%) translateY(-2%); } }

        .bottom-nav { position: absolute; left: 15%; top: 78%; width: 70%; z-index: 10; display: flex; gap: 20px; justify-content: flex-start; }
        
        /* 恢复主菜单动效 */
        .nav-item { 
            cursor: pointer; 
            opacity: 0.7; 
            transition: 0.3s; 
            list-style: none; 
            padding: 8px 15px; 
            border-left: 3px solid rgba(0, 242, 255, 0.3); 
            background: rgba(255, 255, 255, 0.03); 
        }
        .nav-item:hover { 
            opacity: 1; 
            background: rgba(0, 242, 255, 0.1); 
            border-left: 3px solid #00f2ff; 
            filter: drop-shadow(0 0 5px #00f2ff);
        }

        .en-title { font-size: 14px; display: block; font-weight: bold; letter-spacing: 1px; }
        .cn-title { font-size: 12px; display: block; opacity: 0.8; margin-top: 2px; }

        /* --- 3. 手机端适配 --- */
        @media (max-width: 768px) {
            body, html {
                overflow-x: hidden;
                overflow-y: auto; 
                height: auto;
                background-color: #050505;
            }

            .ui-scene {
                position: fixed; 
                width: 100vw; height: 100vh;
                left: 0; 
                top: -12vh; 
                transform: none; 
                z-index: 1; 
            }

            .video-target-box { display: none; }

            .hud-overlay {
                width: 240%; height: 100%;
                left: -70%; top: 0;
                opacity: 0.25;
            }

            .ship-main {
                position: absolute; 
                width: 95%; 
                left: 50%;
                top: 36%; /* 保持你手动修正的 36% */
                transform: translateX(-50%);
                z-index: 3;
                filter: drop-shadow(0 0 30px rgba(0, 238, 255, 0.3));
                animation: shipHoverMobile 6s ease-in-out infinite;
            }

            @keyframes shipHoverMobile {
                0%, 100% { transform: translateX(-50%) translateY(0); }
                50% { transform: translateX(-50%) translateY(-2.5%); }
            }

            .bottom-nav {
                position: relative;
                margin-top: 58vh; 
                margin-bottom: 80px;
                width: 80%;
                left: 50%;
                transform: translateX(-50%);
                flex-direction: column;
                gap: 15px;
                z-index: 20; 
            }

            .nav-item {
                border-left: none;
                border-bottom: 1px solid rgba(0, 242, 255, 0.2);
                text-align: center;
                background: rgba(0, 0, 0, 0.7);
                padding: 16px 0;
                backdrop-filter: blur(10px);
            }
            /* 手机端点击反馈 */
            .nav-item:active {
                background: rgba(0, 242, 255, 0.2);
            }
            
            .en-title { font-size: 19px; } 
            .cn-title { font-size: 14px; opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="ui-scene">
        <img src="images/rh/hud.webp" class="hud-overlay">
        <img src="images/rh/ship.png" class="ship-main">
        <div class="video-target-box">
            <video id="mini-video" autoplay loop muted playsinline>
                <source src="images/rh/city.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onmouseover="switchVideo('city.mp4')">
            <span class="en-title">Rhapsody in Neon</span>
            <span class="cn-title">霓虹狂想曲</span>
        </div>
        <div class="nav-item" onmouseover="switchVideo('battleship.mp4')">
            <span class="en-title">The Celestial Chronicle</span>
            <span class="cn-title">苍穹列记</span>
        </div>
        <div class="nav-item" onmouseover="switchVideo('Human.mp4')">
            <span class="en-title">Personnel Files</span>
            <span class="cn-title">人物档案</span>
        </div>
        <div class="nav-item" onmouseover="switchVideo('Warning.mp4')">
            <span class="en-title">Polifonía: Enroque</span>
            <span class="cn-title">复调:王车易位</span>
        </div>
    </div>

    <script>
        function switchVideo(fileName) {
            if (window.innerWidth <= 768 || !fileName) return;
            const v = document.getElementById('mini-video');
            const targetPath = 'images/rh/' + fileName;
            
            // 只有当路径真正变化时才切换，避免重复触发
            if (v.src.toLowerCase().endsWith(fileName.toLowerCase())) return;
            
            v.src = targetPath;
            v.load(); // 强制重新加载新资源
            v.play().catch(e => console.log("Video play blocked"));
        }
    </script>
</body>
</html>
