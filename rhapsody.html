<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* --- 1. 基础环境 --- */
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Emberly', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden; 
        }

        /* --- 2. 核心容器 (16:9 锁定) --- */
        .ui-viewport {
            position: fixed;
            top: 50%; left: 50%;
           transform: translate(-50%, -50%) scale(1.15);
            width: 100vw; height: 56.25vw;
            max-height: 100vh; max-width: 177.78vh;
            z-index: 1;
        }

        /* 【找回视频框样式】 精准定位在绿框左侧 */
        .video-box {
            position: absolute;
            left: 71.22%; top: 61.66%;
            width: 10.1%; height: 11.75%;
            z-index: 5; 
            background: #000;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

       #mini-video { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    transition: filter 0.5s ease, opacity 0.5s ease;
}

/* 当视频没有播放时，让它稍微暗一点或者带点模糊，显得没那么突兀 */
#mini-video:paused {
    filter: brightness(0.5) grayscale(0.5);
    opacity: 0.8;
}
        /* HUD & 舰船：发光与动画 */
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 10; pointer-events: none; }
        .ship-main {
            position: absolute;
            width: 45%; left: 50%; top: 46%;
            transform: translate(-50%, -50%);
            z-index: 15;
            filter: drop-shadow(0 0 30px rgba(0, 238, 255, 0.4)); 
            animation: shipHover 5s ease-in-out infinite;
        }
        @keyframes shipHover {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-2%); }
        }

        /* Home 键：动效 + 右对齐 */
        .home-btn {
            position: absolute;
            right: 13.1%; top: 20.5%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end; 
            text-decoration: none;
            color: #fff;
            transition: 0.3s;
        }
        .home-btn img { width: 75px; height: auto; transition: 0.4s ease; }
        .home-btn:hover img { transform: scale(1.1); filter: brightness(1.2) drop-shadow(0 0 15px #00f2ff); }
        .home-btn .text { 
            font-size: 10px; opacity: 0.6; 
            border-top: 1px solid rgba(255,255,255,0.3); 
            margin-top: 8px; padding-top: 4px; 
            text-align: right; 
            line-height: 1.4;
            letter-spacing: 1px;
        }
        .home-btn:hover .text {
    opacity: 1;
    color: #00f2ff;
    text-shadow: 0 0 8px rgba(0, 242, 255, 0.8);
    border-top: 1px solid #00f2ff;
}

        /* 底部导航：找回分行与动效 */
        .bottom-nav {
    position: absolute;
    /* 17.5% 是经过计算对齐 HUD 左侧白框横向坐标的位置 */
    left: 17.5%; 
    /* 78% 确保它垂直方向贴合底部 */
    top: 78.5%; 
    width: 70%; 
    z-index: 20;
    display: flex; 
    gap: 20px;
    pointer-events: auto; /* 确保在容器内可点击 */
}

.nav-card {
    cursor: pointer; 
    opacity: 0.6; 
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    padding: 12px 25px; 
    border-left: 3px solid rgba(0, 242, 255, 0.2);
    background: linear-gradient(90deg, rgba(0, 242, 255, 0.05) 0%, transparent 100%);
    backdrop-filter: blur(5px);
    text-decoration: none; 
    color: white;
}

/* --- 强化发光动效 --- */
.nav-card:hover { 
    opacity: 1; 
    background: rgba(0, 242, 255, 0.15); 
    border-left: 3px solid #00f2ff;
    /* 核心发光：多层阴影叠加实现霓虹感 */
    box-shadow: 
        -5px 0 15px rgba(0, 242, 255, 0.3),
        inset 5px 0 20px rgba(0, 242, 255, 0.1);
    transform: translateY(-5px);
}

.nav-card b { 
    display: block; 
    font-size: 15px; 
    letter-spacing: 1.5px; 
    color: #fff;
    /* 文字微弱发光 */
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
}

.nav-card:hover b {
    text-shadow: 0 0 10px rgba(0, 242, 255, 0.8);
}

.nav-card span { 
    display: block; 
    font-size: 13px; 
    opacity: 0.8; 
    margin-top: 4px; 
    color: #00f2ff; 
}

       /* --- 4. 手机端完全重写 --- */
        @media (max-width: 768px) {
            body, html {
                overflow-x: hidden;
                overflow-y: auto; 
                height: auto;
                background-color: #050505;
            }

            /* 核心：靠这个 -12vh 把 HUD 整体往上提，防止下沉 */
            .ui-scene, .ui-viewport {
                position: fixed; 
                width: 100vw; height: 100vh;
                left: 0; 
                top: -12vh; 
                transform: none; 
                z-index: 1; 
            }

            .video-box { display: none; } /* 手机端隐藏视频防止错位 */

            .hud-overlay {
                width: 240%; height: 100%;
                left: -70%; top: 0;
                opacity: 0.25;
            }

            /* 核心：靠这个 36% 锁定舰船位置，防止它压在菜单上 */
            .ship-main, .ship-layer {
                position: absolute; 
                width: 95%; 
                left: 50%;
                top: 36%; 
                transform: translateX(-50%);
                z-index: 3;
                filter: drop-shadow(0 0 30px rgba(0, 238, 255, 0.3));
                animation: shipHoverMobile 6s ease-in-out infinite;
            }

            @keyframes shipHoverMobile {
                0%, 100% { transform: translateX(-50%) translateY(0); }
                50% { transform: translateX(-50%) translateY(-2.5%); }
            }

            /* Home 键：固定在右上角，取消歪斜动效 */
            .home-btn {
                position: fixed; 
                right: 20px;
                top: 25px;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                z-index: 100;
            }
            .home-btn img { width: 55px; transition: 0.3s; }
            .home-btn:hover img { transform: scale(1.1); filter: brightness(1.2) drop-shadow(0 0 10px #00f2ff); }
            .home-btn .text { display: none; }

            /* 菜单区域：锁定 58vh 间距 */
          .bottom-nav {
        /* 1. 强制改为固定定位，脱离父容器的 top: -12vh 限制 */
        position: fixed !important; 
        
        /* 2. 重新定位到屏幕底部区域 */
        top: auto !important;
        bottom: 50px !important; 
        left: 50% !important;
        transform: translateX(-50%) !important;
        
        /* 3. 这里的 margin-top 已经没用了，设为 0 */
        margin-top: 0 !important; 
        
        width: 85% !important;
        flex-direction: column;
        gap: 12px;
        z-index: 999; /* 确保在最上层 */
    }

   .nav-card {
    cursor: pointer; 
    opacity: 0.7; 
    transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    padding: 12px 25px; 
    /* 1. 改为极细的边框 */
    border-left: 2px solid rgba(0, 242, 255, 0.2); 
    
    /* 2. 关键：背景改为从左向右淡出，右侧完全透明 */
    background: linear-gradient(90deg, 
        rgba(0, 242, 255, 0.08) 0%, 
        rgba(0, 242, 255, 0.02) 50%, 
        transparent 100%);
        
    /* 3. 这里的毛玻璃效果调低一点，更透亮 */
    backdrop-filter: blur(4px); 
    text-decoration: none; 
    color: white;
}
.nav-card:hover { 
    opacity: 1; 
    /* 增加左侧激活色块的亮度 */
    background: linear-gradient(90deg, 
        rgba(0, 242, 255, 0.2) 0%, 
        rgba(0, 242, 255, 0.05) 60%, 
        transparent 100%); 
    
    border-left: 2px solid #00f2ff;
    
    /* 增加类似显示屏的微弱外发光 */
    box-shadow: -10px 0 20px rgba(0, 242, 255, 0.15); 
    transform: translateX(5px); /* 轻轻向右滑，增加交互感 */
}
            .nav-item, .nav-card {
                border-left: none;
                border-bottom: 1px solid rgba(0, 242, 255, 0.2);
                text-align: center;
                background: rgba(0, 0, 0, 0.7);
                padding: 16px 0;
                backdrop-filter: blur(10px);
                display: block; /* 确保英文中文分行 */
            }
            .nav-item b, .nav-card b { display: block; font-size: 19px; } 
            .nav-item span, .nav-card span { display: block; font-size: 14px; opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="ui-viewport">
        <div class="video-box">
            <video id="mini-video" autoplay loop muted playsinline>
               <source src="images/rh/Battleship.mp4" type="video/mp4">
            </video>
        </div>

        <img src="images/rh/hud.webp" class="hud-overlay">
        <img src="images/rh/ship.png" class="ship-main">
        
        <a href="index.html" class="home-btn">
            <img src="logo.png" alt="Home">
            <div class="text">NAV-SYS // HOME<br>ACCESS MAIN DATA</div>
        </a>
         <div class="bottom-nav">
        <div class="nav-card" onmouseover="switchVideo('City.mp4')">
            <b>Rhapsody in Neon</b>
            <span>霓虹狂想曲</span>
        </div>
        <div class="nav-card" onmouseover="switchVideo('Battleship.mp4')">
            <b>The Celestial Chronicle</b>
            <span>苍穹列记</span>
        </div>
        <div class="nav-card" onmouseover="switchVideo('Human.mp4')">
            <b>Personnel Files</b>
            <span>人物档案</span>
        </div>
        <div class="nav-card" onmouseover="switchVideo('Warning.mp4')">
            <b>Polifonía: Enroque</b>
            <span>复调:王车易位</span>
        </div>
    </div>

    </div>

    <script>
       const v = document.getElementById('mini-video');
const navContainer = document.querySelector('.bottom-nav');
const defaultVideo = 'battleship.mp4'; // 你希望固定播放的视频

function switchVideo(fileName) {
    if (window.innerWidth <= 768) return;
    const path = 'images/rh/' + fileName;
    
    // 如果已经在播这个了，就别重跑了
    if (v.src.includes(fileName)) {
        if (v.paused) v.play();
        return;
    }
    
    v.src = path;
    v.play().catch(e => console.log("播放被拦截:", e));
}

// 监听鼠标离开整个菜单区域
navContainer.addEventListener('mouseleave', () => {
    if (window.innerWidth <= 768) return;
    
    // 方案 A：直接暂停
    v.pause(); 
    
    // 方案 B：如果你希望回到固定播放舰船，取消下面两行的注释
    // v.src = 'images/rh/' + defaultVideo;
    // v.play();
});
    </script>
</body>
</html>
