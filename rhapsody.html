<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="preload" href="images/rh/City.mp4" as="video" type="video/mp4">
    <link rel="preload" href="images/rh/Battleship.mp4" as="video" type="video/mp4">
    <link rel="preload" href="images/rh/Human.mp4" as="video" type="video/mp4">
    <link rel="preload" href="images/rh/Warning.mp4" as="video" type="video/mp4">

    <style>
        /* --- 1. 基础环境 --- */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #ffffff;
            /* 严格遵循你的字体要求 */
            font-family: 'Emberly', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }

        /* --- 2. 核心容器 (16:9 锁定) --- */
        .ui-viewport {
            position: fixed;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.15);
            width: 100vw;
            height: 56.25vw;
            /* 锁定 16:9 */
            max-height: 100vh;
            max-width: 177.78vh;
            z-index: 1;
        }

        .video-box {
            position: absolute;
            left: 71.22%;
            top: 61.66%;
            width: 10.1%;
            height: 11.75%;
            z-index: 5;
            background: #000;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

        #mini-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.5s ease, opacity 0.5s ease;
        }

        #mini-video:paused {
            filter: brightness(0.4) grayscale(0.3);
            opacity: 0.8;
        }

        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 10;
            pointer-events: none;
        }

        .ship-main {
            position: absolute;
            width: 45%;
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%);
            z-index: 15;
            filter: drop-shadow(0 0 30px rgba(0, 238, 255, 0.4));
            animation: shipHover 5s ease-in-out infinite;
        }

        

        @keyframes shipHover {

            0%,
            100% {
                transform: translate(-50%, -50%) translateY(0);
            }

            50% {
                transform: translate(-50%, -50%) translateY(-2%);
            }
        }

        .home-btn {
            position: absolute;
            right: 13.1%;
            top: 20.5%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-decoration: none;
            color: #fff;
            transition: 0.3s;
        }

        .home-btn img {
            width: 75px;
            height: auto;
            transition: 0.4s ease;
        }

        .home-btn:hover img {
            transform: scale(1.1);
            filter: brightness(1.2) drop-shadow(0 0 15px #00f2ff);
        }

        .home-btn .text {
            font-size: 10px;
            opacity: 0.6;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            margin-top: 8px;
            padding-top: 4px;
            text-align: right;
            line-height: 1.4;
            letter-spacing: 1px;
        }

        /* --- 3. 底部导航 --- */
        .bottom-nav {
            position: absolute;
            left: 17.5%;
            top: 73.5%;
            width: 70%;
            z-index: 20;
            display: flex;
            gap: 20px;
        }

        .nav-card {
            position: relative;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            padding: 12px 25px;
            border-left: 2px solid rgba(0, 242, 255, 0.2);
            background: linear-gradient(90deg, rgba(0, 242, 255, 0.08) 0%, transparent 100%);
            backdrop-filter: blur(4px);
            text-decoration: none;
            color: white;
            height: 46px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .nav-card:hover,
        .nav-card.active {
            opacity: 1;
            border-left: 2px solid #00f2ff;
            box-shadow: -8px 0 20px rgba(0, 242, 255, 0.2);
            transform: translateX(8px);
        }

        .nav-card b {
            display: block;
            font-size: 15px;
            letter-spacing: 1.5px;
            color: #fff;
        }

        .nav-card span {
            display: block;
            font-size: 15px;
            color: #00f2ff;
            margin-top: 3px;
        }

@keyframes hudFadeUp {
    0% {
        transform: translateY(15px);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    100% {
        transform: translateY(0);
        opacity: 1;
    }
}

.show {
    animation: hudFadeUp 0.6s ease;
}

#hud-zh {
    position: absolute;
z-index: 20;

    left: 27%;   /* 左右位置 */
    top: 28.7%;    /* 上下位置 */

    width: 38%;
    

    color: #b4f0ff;
    font-family: 'Microsoft YaHei', 'Noto Sans SC', sans-serif;

    font-size: 10px;
    line-height: 1.6;
    letter-spacing: 1px;

    white-space: pre-line;
   text-align: center;

    opacity: 0;
    overflow: hidden;
word-break: break-word;
 transform: translateY(0);
 
 display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
text-shadow:
    0 0 6px rgba(0,0,0,0.8),
    0 0 12px rgba(0,0,0,0.6),
    0 0 20px rgba(0,0,0,0.4);
  

}

#hud-en {
    position: absolute;
z-index: 20;
    left: 27%;
    top: 57%;

    width: 38%;
    

    color: #b4f0ff;
   font-family: 'Share Tech Mono', monospace;

    font-size: 10px;
    line-height: 1.6;

    white-space: pre-line;
    text-align: center;

    opacity: 0;
    overflow: hidden;
word-break: break-word;
 transform: translateY(0);

  display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;

  text-shadow:
    0 0 4px rgba(0,0,0,0.9),
    0 0 10px rgba(0,0,0,0.7),
    0 0 18px rgba(0,0,0,0.5),
    0 0 30px rgba(0,0,0,0.3);


}


#hud-zh, #hud-en {
    opacity: 1;
}




        .sub-menu,
        /* 修改此处的 padding-left 来解决“贴线”问题 */
        .lock-info {
            position: absolute;
            left: -2px;
            top: 100%;
            width: 100%;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: 0.4s ease;
            border-left: 1px solid #00f2ff;
            /* 对应卡片的左侧竖线 */
            background: rgba(0, 0, 0, 0.8);
            pointer-events: none;

            /* 核心修复：添加左边距，让内容不再贴线 */
            padding-left: 25px;
            box-sizing: border-box;
            /* 确保 padding 不会撑爆容器 */
        }

        /* 确保提示文字也是红色的 */
        /* --- 彻底修复：字体变小、行间距收紧、红色锁定 --- */
        .lock-text {
            font-size: 10px !important;
            /* 稍微调成 10px 比较精致 */
            color: #ff4444 !important;
            /* 强制红色 */
            opacity: 0.9;
            letter-spacing: 1px;
            line-height: 1.2;
            /* 关键：把行高压下来，字就不会显得大而散 */
            display: block;
            margin: 0;
            /* 消除默认外边距 */
            padding: 0;
            /* 消除默认内边距 */
            text-align: left;
            /* 网页端左对齐 */
        }

        .nav-card:hover .sub-menu,
        .nav-card.active .sub-menu,
        .nav-card:hover .lock-info {
            max-height: 120px;
            opacity: 1;
            margin-top: 5px;
            pointer-events: auto;
        }

        .sub-menu a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 13.5px;
            padding: 8px 15px;
            display: block;
        }

        .sub-menu a:hover {
            color: #00f2ff;
            background: rgba(0, 242, 255, 0.1);
        }

        .progress-mini {
            width: 60px;
            height: 1px;
            background: #333;
            margin-bottom: 6px;
            position: relative;
        }

        .progress-mini::after {
            content: '';
            position: absolute;
            left: 0;
            width: 30%;
            height: 100%;
            background: #ff4444;
        }



        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

.star-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: radial-gradient(circle at center, #0a0a12 0%, #020204 100%);
    z-index: 0;
}
.star-bg::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;

    background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
    opacity: 0.2;

    animation: starDriftSlow 220s linear infinite;
}
@keyframes starDriftSlow {
    from {
        background-position: 0 0;
    }
    to {
        background-position: -600px 800px;
    }
}
.star-bg::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;

    background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
    opacity: 1.5;

    animation: starDrift 180s linear infinite;
}

@keyframes starDrift {
    from {
        background-position: 0 0;
    }
    to {
        background-position: -800px 1200px;
    }
}

        /* --- 4. 手机端完全重写 (保持 16:9 且不重叠) --- */
        @media (max-width: 768px) {
#hud-zh,
#hud-en {
    display: none;
}
            body,
            html {
                overflow-y: auto;
                height: auto;
            }

            .ui-viewport {
                /* 1. 基础定位保持你原本的 */
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                transform: none !important;
                width: 100vw !important;

                /* 2. 核心修复：锁死高度计算 */
                /* 使用 min-height 确保即使内容没加载，容器也撑开了 16:9 的空间 */
                height: 56.25vw !important;
                min-height: 56.25vw !important;

                /* 3. 强制布局模式 */
                display: block !important;
                overflow: visible !important;
                z-index: 1;
            }

            .ship-main {
                /* 4. 严格锁定你的 70% 排版 */
                width: 90% !important;
                top: 70% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                position: absolute !important;

                /* 5. 解决“刷新才归位”的终极补丁：强制提升渲染层级 */
                will-change: transform;
                -webkit-transform: translate(-50%, -40%);
                /* 兼容老款 iPhone Safari */
            }
    

        .video-box {
            display: none;
        }

        .hud-overlay {
            width: 200%;
            left: -50%;
            opacity: 0.4;
            top: 20%;
        }

        /* Home 键重生：层级置顶且可点击 */
        .home-btn {
            position: fixed !important;
            right: 20px;
            top: 20px;
            z-index: 2000 !important;
            pointer-events: auto !important;
        }

        .home-btn img {
            width: 55px;
        }

        .home-btn .text {
            display: none;
        }

        /* 菜单区域：流式布局，排在图片下方 */
        .bottom-nav {
            position: relative !important;
            top: auto !important;
            left: 0 !important;
            width: 90% !important;
            margin: 20px auto 40px !important;
            flex-direction: column;
            gap: 12px;
            transform: none !important;
        }

        .nav-card {
            height: auto;
            min-height: 50px;
            opacity: 0.9;
            background: rgba(10, 10, 10, 0.95) !important;
            border-left: 2px solid rgba(0, 242, 255, 0.5) !important;
            align-items: center;
            text-align: center;
            transform: none !important;
        }

        .sub-menu,
        .lock-info {
            position: static;
            max-height: 0;
            opacity: 1;
            background: transparent;
            border-left: none;
            align-items: center;
        }

        .nav-card.active .sub-menu,
        .nav-card.active .lock-info {
            max-height: 200px;
            margin-top: 10px;
        }

        .progress-mini {
            margin: 0 auto 8px auto;
        }
        }
    </style>
</head>

<body>
<div class="star-bg"></div>
    <div class="ui-viewport">
        <div class="video-box">
           <video id="mini-video" preload="auto" loop muted playsinline>
                <source src="images/rh/Battleship.mp4" type="video/mp4">
            </video>
        </div>
<div id="hud-zh"></div>
<div id="hud-en"></div>
        <img src="images/rh/hud.webp" class="hud-overlay">
        <img src="images/rh/ship.png" class="ship-main">

        <a href="index.html" class="home-btn">
            <img src="logo.png" alt="Home">
            <div class="text">NAV-SYS // HOME<br>ACCESS MAIN DATA</div>
        </a>
    </div>

    <div class="bottom-nav">
        <div class="nav-card" onclick="toggleSubMenu(this)" onmouseover="switchVideo('City.mp4'); showHUD('neon')">
            <b>Rhapsody in Neon</b>
            <span>霓虹狂想曲</span>
            <div class="sub-menu">
                <a href="comic-02.html" onclick="transitionToPage(event, 'comic-02.html')">序章漫画</a>
                <a href="#">章节故事</a>
            </div>
        </div>

        <div class="nav-card" onclick="toggleSubMenu(this)" onmouseover="switchVideo('Battleship.mp4'); showHUD('chronicle')">
            <b>The Celestial Chronicle</b>
            <span>苍穹列记</span>
            <div class="sub-menu">
                <a href="#">序章漫画</a>
                <a href="#">章节故事</a>
            </div>
        </div>

        <div class="nav-card" onclick="toggleSubMenu(this)" onmouseover="switchVideo('Human.mp4'); showHUD('file')">
            <b>Personnel Files</b>
            <span>人物档案</span>
        </div>

        <div class="nav-card status-locked" onmouseover="switchVideo('Warning.mp4'); showHUD('poly')">
            <b>Polifonía: Enroque</b>
            <span>复调:王车易位</span>
            <div class="lock-info">
                <div class="progress-mini"></div>
                <span class="lock-text">ACCESS DENIED<br>权限未开放</span>
            </div>
        </div>
    </div>

    <script>
        



        const v = document.getElementById('mini-video');
        let currentActiveCard = null;

        const cache = {};

function preloadVideo(fileName) {
    if (cache[fileName]) return;

    const vid = document.createElement('video');
    vid.src = 'images/rh/' + fileName;
    vid.preload = 'auto';
    vid.muted = true;

    cache[fileName] = vid;
}

function switchVideo(fileName) {
    if (window.innerWidth <= 768) return;

    const path = 'images/rh/' + fileName;

    // 切换当前视频
    if (!v.src.includes(fileName)) {
        v.src = path;
        v.play().catch(() => {});
    }

    // 👇 只预加载“下一个可能用到的”
    if (fileName === 'City.mp4') preloadVideo('Battleship.mp4');
    if (fileName === 'Battleship.mp4') preloadVideo('Human.mp4');
    if (fileName === 'Human.mp4') preloadVideo('Warning.mp4');
}

        function toggleSubMenu(card) {
            if (currentActiveCard === card) {
                card.classList.remove('active');
                currentActiveCard = null;
                return;
            }
            document.querySelectorAll('.nav-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            currentActiveCard = card;
        }

       document.querySelector('.bottom-nav').addEventListener('mouseleave', () => {
    if (window.innerWidth <= 768) return;
    if (!currentActiveCard) v.pause();
    hideHUD();
});

        function transitionToPage(e, url) {
            e.preventDefault();
            document.body.classList.add('fade-out');
            setTimeout(() => { window.location.href = url; }, 500);
        }

        const hudTexts = {
    neon: {
        zh: "作为一个地下武器师，列奥波尔德被当作暗杀对象袭击时他本不感到意外。\n但当他发现杀手竟是一年前死去的爱人之时，一切都天翻地覆。",
        en: "\nAs an underground weaponsmith, \nLeopold isn’t surprised to find himself marked for assassination. \nUntil the man sent to kill him turns out to be \nthe lover he lost a year ago—and everything unravels."
    },

    chronicle: {
        zh: "作为唯一能穿越天空洋流的舰船，\n这是狂想曲号——以及驾驶着她的人们——的传说。",
        en: "\n\nThe only vessel capable of crossing the Aetherial Tide, \nthis is the legend of the Rhapsody—and those who dare to steer her."
    },

     file: {
        zh: "收录于极夜城警局档案馆",
        en: "\n\n\nKCPD Archive Record"
    },

    poly: {
    
        zh: "在义体失控事件后，极夜城中涌动着更多暗流。\n家族、企业以及那一丝苦苦维持的人性，该何去何从？",
        en: "\nAfter the cybernetic collapse, \nKaamos City slips into silent conspiracies. \nBetween power, loyalty, and the last trace of humanity, \nsomething is bound to give."
    }
};


function showHUD(key) {
    const zhBox = document.getElementById('hud-zh');
    const enBox = document.getElementById('hud-en');

    zhBox.textContent = hudTexts[key].zh;
    enBox.textContent = hudTexts[key].en;

    zhBox.classList.remove('show');
    enBox.classList.remove('show');

    void zhBox.offsetWidth;
    void enBox.offsetWidth;

    zhBox.classList.add('show');
    enBox.classList.add('show');
}

function hideHUD() {
    document.getElementById('hud-zh').textContent = "";
    document.getElementById('hud-en').textContent = "";
}

    </script>
</body>

</html>
