<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain's Lounge | Replenish</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0a0a0f;
            color: #00ffcc; /* 典型的赛博青绿，比之前的琥珀色更具科技感 */
            font-family: 'DotGothic16', sans-serif; /* 像素感十足的科幻字体 */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🌌 背景：深空动态效果 */
        .stars-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #11112b 0%, #050508 100%);
            z-index: -1;
        }

        /* 🛸 全息投影容器 */
        .lounge-panel {
            width: 95%;
            max-width: 700px;
            background: rgba(0, 20, 20, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 255, 204, 0.1);
            padding: 30px;
            border-radius: 4px;
            text-align: center;
            position: relative;
            /* 模拟屏幕微弱的闪烁动画 */
            animation: monitorFlicker 4s infinite;
        }

        @keyframes monitorFlicker {
            0%, 100% { opacity: 1; }
            95% { opacity: 0.98; }
            97% { opacity: 0.99; }
        }

        /* 🖼️ 动图监视器部分 */
        .monitor-frame {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 25px;
            border: 1px solid rgba(0, 255, 204, 0.5);
            padding: 10px;
            background: #000;
        }

        .monitor-frame::before {
            content: "LIVE FEED: SECTOR-07";
            position: absolute;
            top: -10px; left: 10px;
            background: #0a0a0f;
            padding: 0 5px;
            font-size: 10px;
            color: #00ffcc;
        }

        .monitor-frame img {
            width: 100%;
            height: auto;
            display: block;
            filter: brightness(0.9) contrast(1.1);
        }

        /* 模拟扫描线效果 */
        .scanlines {
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* 🏷️ 标题与文案 */
        .status-header {
            font-family: 'Press Start 2P', cursive; /* 更像素化的标题 */
            font-size: 14px;
            margin-bottom: 25px;
            color: #00ffcc;
            text-shadow: 2px 2px #ff0055; /* 复古色散效果 */
        }

        .message-content {
            font-size: 14px;
            line-height: 1.8;
            text-align: center;
            margin-bottom: 30px;
            color: #a0ffe0;
        }

        .message-content p { margin: 10px 0; }

        /* ☕ Ko-fi 按钮：小游戏风格 */
        .kofi-button {
            display: inline-block;
            font-family: 'Press Start 2P', cursive;
            padding: 18px 30px;
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            text-decoration: none;
            font-size: 10px;
            transition: 0.2s;
            cursor: pointer;
            box-shadow: 4px 4px 0px #008877;
        }

        .kofi-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #008877;
            background: #00ffcc;
            color: #000;
        }

        .kofi-button:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #008877;
        }

        .back-link {
            display: block;
            margin-top: 30px;
            font-size: 12px;
            text-decoration: none;
            color: rgba(0, 255, 204, 0.4);
        }

        .back-link:hover { color: #ff0055; }

    </style>
</head>
<body>

    <div class="stars-bg"></div>

    <div class="lounge-panel">
        <div class="status-header">LOUNGE TERMINAL v1.0</div>

        <div class="monitor-frame">
            <img src="images/about/draw.gif" alt="Captain & Ryutaro">
            <div class="scanlines"></div>
        </div>

        <div class="message-content">
            <p>A vessel runs on energy, an artist runs on coffee~</p>
            <p>舰船需要能源，艺术工作者需要咖啡！</p>
            <p style="font-size: 12px; opacity: 0.7;">
                All support goes toward food for Ryutaro... or the Captain! 😉<br>
                您投资的每一笔费用将用于我家小兔龙太郎的食物——或者请船长喝咖啡！
            </p>
        </div>

        <a href="https://ko-fi.com/YOUR_USERNAME" target="_blank" class="kofi-button">
            INSERT COFFEE [OK]
        </a>

        <a href="index.html" class="back-link">&lt; RETURN TO SHIP</a>
    </div>

</body>
</html>
