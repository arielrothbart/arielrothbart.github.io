<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustration | Symphony Noir</title>

    <style>
        /* 1. 基础全局样式 */
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            color: white;
            font-family: 'Special Elite', serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            z-index: 1;
        }

        img {
            user-select: none;
            -webkit-user-drag: none;
        }

        /* 2. 全屏 Banner (移出 Container 确保全宽) */
        .gallery-header {
            position: relative;
            width: 100%;
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            background: #000;
        }

        .banner-bg-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center 20%;
            filter: grayscale(100%) contrast(120%) brightness(40%);
            opacity: 0.6;
            z-index: 1;
        }

        .banner-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 50%, rgba(0,0,0,0.9) 100%);
            z-index: 2;
        }

        .header-content {
            position: relative;
            z-index: 3;
        }

        .main-title {
            font-size: clamp(32px, 7vw, 70px);
            letter-spacing: 12px;
            text-transform: uppercase;
            margin: 15px 0;
            font-weight: 300;
            animation: titleFadeIn 1.8s ease-out forwards;
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 5px;
            opacity: 0.6;
        }

        .header-line {
            width: 60px; height: 1px;
            background: rgba(255,255,255,0.3);
            margin: 25px auto 0;
            transition: 0.8s;
        }

        .gallery-header:hover .header-line { width: 120px; }

        @keyframes titleFadeIn {
            0% { opacity: 0; transform: translateY(20px); letter-spacing: 25px; filter: blur(5px); }
            100% { opacity: 0.9; transform: translateY(0); letter-spacing: 12px; filter: blur(0); }
        }

        /* 3. 瀑布流容器 */
        .container {
            max-width: 1400px;
            margin: auto;
            padding: 80px 40px;
        }

        .gallery {
            column-count: 3;
            column-gap: 40px;
        }

        .item {
            break-inside: avoid;
            margin-bottom: 50px;
            cursor: pointer;
            background: #111;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.4s;
        }

        .item:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,60,60,0.2);
        }

        .item img {
            width: 100%;
            display: block;
            filter: grayscale(0.2);
            transition: 0.4s;
        }

        .item:hover img {
            filter: grayscale(0);
            opacity: 0.9;
        }

        .caption {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.6;
            line-height: 1.6;
            border-left: 2px solid rgba(255,60,60,0.3);
            padding-left: 10px;
        }

        /* 4. 图片查看器 (Viewer) */
        .viewer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(10px);
        }

        .viewer-content { text-align: center; }

        #viewer-img {
            max-width: 90vw;
            max-height: 70vh;
            object-fit: contain;
            transition: 0.6s cubic-bezier(0.22,1,0.36,1);
        }

        #viewer-caption {
            margin-top: 25px;
            font-size: 14px;
            opacity: 0.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .arrow {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            font-size: 40px;
            color: white;
            cursor: pointer;
            padding: 20px;
            opacity: 0.4;
            transition: 0.3s;
        }

        .arrow:hover { opacity: 1; }
        .left { left: 20px; }
        .right { right: 20px; }

        /* 5. UI 元素 */
        .home-logo {
            position: fixed;
            top: 40px; right: 40px;
            z-index: 1000;
        }
        .home-logo img { width: 60px; opacity: 0.7; transition: 0.3s; }
        .home-logo img:hover { opacity: 1; transform: scale(1.1); }

        .scroll-top {
            position: fixed;
            right: 40px; bottom: 40px;
            width: 48px; height: 48px;
            border: 1px solid rgba(255,60,60,0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff3b3b;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.4s;
            z-index: 1000;
        }

        .scroll-top.show { opacity: 1; transform: translateY(0); }

        /* 响应式适配 */
        @media (max-width: 1000px) { .gallery { column-count: 2; } }
        @media (max-width: 768px) {
            .gallery-header { height: 60vh; }
            .home-logo { top: 20px; right: 20px; }
            .scroll-top { right: 20px; bottom: 20px; }
        }
        @media (max-width: 600px) { .gallery { column-count: 1; } }
    </style>
</head>

<body>

    <header class="gallery-header">
        <img src="images/illustration/ill-banner.jpg" class="banner-bg-img" alt="Banner">
        <div class="banner-overlay"></div>
        <div class="header-content">
            <p class="subtitle">SELECTED WORKS</p>
            <h1 class="main-title">ILLUSTRATIONS</h1>
            <div class="header-line"></div>
        </div>
    </header>

    <div class="container">
        <div class="gallery">
            <figure class="item">
                <img src="images/illustration/ill1.jpg">
                <div class="caption">
                    Achron Nocturne<br>
                    Digital<br>
                    In an assassin universe like 《John Wick》.
                </div>
            </figure>
            
            <figure class="item">
                <img src="images/illustration/ill2.jpg">
                <div class="caption">
                    Hell Hound<br>
                   Digital<br>
                    The childhood of a hellhound——Sanada Tetsu.
                </div>
            </figure>

            <figure class="item">
                <img src="images/illustration/ill3.jpg">
                <div class="caption">
                    人之怒 兽之哀<br>
                  Digital<br>
                    Yagami as Yamata no Orochi, Shin as Sugahara no Michizane in Fate au.
                </div>
            </figure>

            <figure class="item">
                <img src="images/illustration/ill4.jpg">
                <div class="caption">The Meeting<br>
                  Digital<br>
                  London Continental group.</div>
            </figure>

            <figure class="item">
                <img src="images/illustration/ill5.jpg">
                <div class="caption">Batman and Two Face<br>
                  Digital<br>
                  Batman Fan art.</div>
            </figure>

            <figure class="item">
                <img src="images/illustration/ill6.jpg">
                <div class="caption">Gotham Nocturne<br>
                  Digital<br>
                  Fan art for Batman.</div>
            </figure>

            <figure class="item">
                <img src="images/illustration/ill7.jpg">
                <div class="caption">The Light<br>
                  Digital<br>
                  Fan art for Harvey Dent.</div>
            </figure>
        </div>
    </div>

    <div class="viewer" id="viewer">
        <span class="arrow left" id="prev">&#10094;</span>
        <div class="viewer-content">
            <img id="viewer-img">
            <div id="viewer-caption"></div>
        </div>
        <span class="arrow right" id="next">&#10095;</span>
    </div>

    <a href="index.html" class="home-logo"><img src="logo.png"></a>
    <div class="scroll-top" id="scrollTop">↑</div>

    <script>
        // 逻辑保持不变，确保与上面的 HTML 元素 ID 对应
        const viewer = document.getElementById('viewer');
        const viewerImg = document.getElementById('viewer-img');
        const viewerCaption = document.getElementById('viewer-caption');
        let currentIndex = 0;
        let list = [];
        let scrollLock = false;

        const items = document.querySelectorAll('.item');
        items.forEach(item => {
            const img = item.querySelector("img");
            const caption = item.querySelector(".caption").innerHTML;
            list.push({ src: img.src, caption: caption });
            img.onclick = () => {
                currentIndex = list.findIndex(i => i.src === img.src);
                openViewer();
            };
        });

        function openViewer() {
            viewer.style.display = 'flex';
            viewerImg.src = list[currentIndex].src;
            viewerCaption.innerHTML = list[currentIndex].caption;
            document.body.style.overflow = 'hidden'; // 禁止背景滚动
        }

        function closeViewer() {
            viewer.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function change(direction) {
            const offset = 100;
            viewerImg.style.opacity = 0;
            viewerImg.style.transform = direction === 'next' ? `translateX(-${offset}px)` : `translateX(${offset}px)`;

            setTimeout(() => {
                currentIndex = direction === 'next' 
                    ? (currentIndex + 1) % list.length 
                    : (currentIndex - 1 + list.length) % list.length;
                
                viewerImg.src = list[currentIndex].src;
                viewerCaption.innerHTML = list[currentIndex].caption;
                
                viewerImg.style.transition = 'none';
                viewerImg.style.transform = direction === 'next' ? `translateX(${offset}px)` : `translateX(-${offset}px)`;
                
                viewerImg.offsetHeight; // 强制重绘
                viewerImg.style.transition = '0.6s cubic-bezier(0.22,1,0.36,1)';
                viewerImg.style.transform = 'translateX(0)';
                viewerImg.style.opacity = 1;
            }, 300);
        }

        document.getElementById('next').onclick = () => change('next');
        document.getElementById('prev').onclick = () => change('prev');
        viewer.onclick = (e) => { if (e.target === viewer) closeViewer(); };
        
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('scrollTop');
            if (window.scrollY > 300) btn.classList.add('show');
            else btn.classList.remove('show');
        });

        document.getElementById('scrollTop').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
    </script>

</body>
</html>
