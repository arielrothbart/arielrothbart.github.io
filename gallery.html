<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Symphony Noir</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
}

/* ===== sidebar ===== */
.sidebar{
  position:fixed;
  width:220px;
  height:100vh;
  background:#0a0a0a;
  padding:30px;
  z-index:10;
}

.logo{width:80px;cursor:pointer;}
.title{font-size:26px;margin:20px 0;cursor:pointer;}

.nav-item{margin:12px 0;color:#666;cursor:pointer;}
.nav-item.active{color:white;}

/* ===== main ===== */
.main{
  margin-left:220px;
  padding:60px;
}

/* ===== gallery ===== */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.gallery img{
  width:100%;
  cursor:pointer;
  transition:0.3s;
}

.gallery img:hover{
  transform:scale(1.05);
}

/* ===== lightbox ===== */
.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.lightbox img{
  max-width:85%;
  max-height:85%;
}

/* 左右翻页按钮 */
.nav-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:30px;
  cursor:pointer;
  opacity:0.6;
  padding:20px;
}

.prev{left:10px;}
.next{right:10px;}

.nav-btn:hover{
  opacity:1;
}

/* top */
.top-btn{
  position:fixed;
  right:30px;
  bottom:30px;
  font-size:12px;
  opacity:0.6;
  cursor:pointer;
}
  .floating-buttons{
  position:fixed;
  right:20px;
  bottom:80px;
  display:flex;
  flex-direction:column;
  gap:20px;
  z-index:200;
}

.gif-btn{
  text-align:center;
  cursor:pointer;
  opacity:0.8;
  transition:0.3s;
}

.gif-btn img{
  width:100px;
}

.gif-btn:hover{
  opacity:1;
  transform:scale(1.1);
}

.gif-label{
  font-size:10px;
  margin-top:4px;
  opacity:0.6;
}

/* ===== mobile ===== */
.menu-btn{display:none;}

@media(max-width:768px){
.floating-buttons{
  left:20px;
  right:auto;
  bottom:20px;
}
  .menu-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.08);
    border-radius:10px;
    z-index:200;
  }

  .overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    display:none;
    z-index:100;
  }

  .overlay.show{display:block;}

  .sidebar{
    transform:translateX(-100%);
    transition:0.3s;
    z-index:300;
  }

  .sidebar.open{transform:translateX(0);}

  .main{
    margin-left:0;
    padding:80px 20px;
  }
}

</style>
</head>

<body>

<div class="menu-btn" onclick="toggleMenu()">☰</div>
<div class="overlay" onclick="toggleMenu()"></div>

<div class="sidebar">
  <img src="logo.png" class="logo" onclick="goHome()">
  <div class="title" onclick="goHome()">Symphony Noir</div>

 <div class="nav-item" onclick="goHome()">Title</div>
<div class="nav-item" onclick="goHome()">Story</div>
<div class="nav-item" onclick="goHome()">Characters</div>
<div class="nav-item" onclick="goHome()">Network</div>
<div class="nav-item" onclick="goTimeline()">Timeline</div>
<div class="nav-item active">Gallery</div>
</div>

<div class="main">

<div class="gallery" id="gallery"></div>

</div>

<!-- lightbox -->
<div class="lightbox" id="lightbox">
  <div class="nav-btn prev" onclick="prevImg()">‹</div>
  <img id="lightImg">
  <div class="nav-btn next" onclick="nextImg()">›</div>
</div>

<div class="floating-buttons">

  <div class="gif-btn" onclick="scrollToTop()">
    <img src="images/top.gif">
    <div class="gif-label">Top</div>
  </div>
</div>
<script>

/* ===== 图片自动加载 ===== */
const gallery = document.getElementById("gallery");
let images = [];

for(let i=1;i<=12;i++){   // 👉 改这里数量
  let src = "images/sym"+i+".png";
  images.push(src);

  const img = document.createElement("img");
  img.src = src;
  img.onclick = ()=>openLightbox(i-1);
  img.oncontextmenu = e=>e.preventDefault();
  gallery.appendChild(img);
}

/* ===== lightbox ===== */
let current = 0;

function openLightbox(index){
  current = index;
  document.getElementById("lightbox").style.display="flex";
  document.getElementById("lightImg").src = images[current];
}

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

/* 点击背景关闭 */
document.getElementById("lightbox").onclick = e=>{
  if(e.target.id==="lightbox") closeLightbox();
}

/* 翻页 */
function nextImg(){
  current = (current+1)%images.length;
  updateImg();
}

function prevImg(){
  current = (current-1+images.length)%images.length;
  updateImg();
}

function updateImg(){
  document.getElementById("lightImg").src = images[current];
}

/* 键盘控制 */
document.onkeydown = e=>{
  if(e.key==="ArrowRight") nextImg();
  if(e.key==="ArrowLeft") prevImg();
  if(e.key==="Escape") closeLightbox();
}

/* ===== nav ===== */
function goHome(){location.href="index.html";}
function goTimeline(){location.href="timeline.html";}
/* ===== menu ===== */
function toggleMenu(){
  document.querySelector(".sidebar").classList.toggle("open");
  document.querySelector(".overlay").classList.toggle("show");
}

/* ===== scroll ===== */
function scrollToTop(){
  window.scrollTo({top:0,behavior:"smooth"});
}
let startX = 0;

document.getElementById("lightbox").addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

document.getElementById("lightbox").addEventListener("touchend", e=>{
  let endX = e.changedTouches[0].clientX;

  if(endX - startX > 50){
    prevImg();
  }
  else if(startX - endX > 50){
    nextImg();
  }
});
</script>

</body>
</html>
