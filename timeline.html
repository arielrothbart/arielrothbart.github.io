<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Timeline</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
}

/* ===== sidebar ===== */
.sidebar{
  position:fixed;
  width:200px;
  height:100vh;
  background:#0a0a0a;
  padding:30px;
}

.nav div{
  margin:12px 0;
  color:#666;
  cursor:pointer;
}

.nav .active{ color:white; }

/* 返回按钮 */
.back{
  margin-bottom:20px;
  cursor:pointer;
  opacity:0.6;
}
.back:hover{opacity:1;}

/* ===== main ===== */
.main{
  margin-left:200px;
  padding:100px 0;
}

/* timeline */
.timeline{
  position:relative;
}

.timeline::before{
  content:"";
  position:absolute;
  left:50%;
  width:1px;
  height:100%;
  background:rgba(255,255,255,0.2);
}

/* event */
.event{
  width:50%;
  padding:30px 50px;
  box-sizing:border-box;
}

.left{ left:0; text-align:right; position:relative;}
.right{ left:50%; position:relative;}

.year{ font-size:22px; }
.text{ opacity:0.7; }

/* detail */
.detail{
  opacity:0;
  transition:0.3s;
  font-size:13px;
}
.event:hover .detail{opacity:1;}

/* color */
.modern .year{ color:#d8e6ff; }
.historical .year{ color:#f5e6c8; }

/* section */
.section{ display:none; }
.section.active{ display:block; }

</style>
</head>

<body>

<div class="sidebar">
  <div class="back" onclick="goBack()">← Back</div>

  <div class="nav">
    <div id="btn-mod" class="active" onclick="showSection('mod')">Vermont</div>
    <div id="btn-his" onclick="showSection('his')">Historical</div>
  </div>
</div>

<div class="main">

<!-- ===== 现代线（在前） ===== -->
<div id="mod" class="section active">
<div class="timeline">

<div class="event right modern">
<div class="year">1950</div>
<div class="text">八神伊织出生</div>
<div class="detail">八神伊织 出生</div>
</div>

<div class="event left modern">
<div class="year">1958</div>
<div class="text">菅原真出生</div>
<div class="detail">菅原真 出生</div>
</div>

<div class="event right modern">
<div class="year">1982</div>
<div class="text">诅咒事件</div>
<div class="detail">
钦悟去世<br>
海斗失踪<br>
真生命力遭到稀释
</div>
</div>

<div class="event left modern">
<div class="year">1999</div>
<div class="text">调查Antonio</div>
<div class="detail">
前往意大利与马德里收集情报
</div>
</div>

</div>
</div>

<!-- ===== 历史线 ===== -->
<div id="his" class="section">
<div class="timeline">

<div class="event left historical">
<div class="year">1465</div>
<div class="text">Osvaldo出生</div>
<div class="detail">1465年 Osvaldo出生</div>
</div>

<div class="event right historical">
<div class="year">1498</div>
<div class="text">政治联姻</div>
<div class="detail">
Osvaldo同Cathetine Macarena政治联姻
</div>
</div>

<div class="event left historical">
<div class="year">1508</div>
<div class="text">王室暗杀</div>
<div class="detail">
国王与王储被暗杀<br>
王后与王子逃离
</div>
</div>

</div>
</div>

</div>

<script>

function goBack(){
  window.location.href="sym-noir.html";
}

function showSection(type){
  document.getElementById("mod").classList.remove("active");
  document.getElementById("his").classList.remove("active");

  document.getElementById("btn-mod").classList.remove("active");
  document.getElementById("btn-his").classList.remove("active");

  document.getElementById(type).classList.add("active");
  document.getElementById("btn-"+type).classList.add("active");
}

</script>

</body>
</html>
