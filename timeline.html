<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Timeline</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
}

/* ===== sidebar ===== */
.sidebar{
  position:fixed;
  width:200px;
  height:100vh;
  background:#0a0a0a;
  padding:30px;
}

.back{
  margin-bottom:20px;
  cursor:pointer;
  opacity:0.6;
}
.back:hover{opacity:1;}

.nav div{
  margin:12px 0;
  color:#666;
  cursor:pointer;
}
.nav .active{color:white;}

.main{
  margin-left:200px;
  padding:100px 0;
}

/* ===== timeline ===== */
.timeline{
  position:relative;
}

.timeline::before{
  content:"";
  position:absolute;
  left:50%;
  width:1px;
  height:100%;
  background:rgba(255,255,255,0.2);
}

/* ===== event ===== */
.event{
  width:50%;
  padding:30px 50px;
  box-sizing:border-box;
  position:relative;

  opacity:0;
  transform:translateY(60px);
  transition:1s ease;
}

.event.show{
  opacity:1;
  transform:translateY(0);
}

.left{ left:0; text-align:right;}
.right{ left:50%; }

.year{ font-size:22px; }

/* ===== 标题切换 ===== */
.text{
  position:relative;
  height:20px;
}

.text span{
  position:absolute;
  left:0;
  right:0;
  transition:0.4s;
}

.en{ opacity:1; }
.cn{ opacity:0; }

.event:hover .en{ opacity:0; transform:translateY(-6px); }
.event:hover .cn{ opacity:1; transform:translateY(0); }

/* ===== detail ===== */
.detail{
  opacity:0;
  transition:0.4s;
  font-size:13px;
  white-space:pre-line;
}

.event:hover .detail{opacity:1;}

.modern .year{color:#d8e6ff;}
.historical .year{color:#f5e6c8;}

.section{display:none;}
.section.active{display:block;}

.top-btn{
  position:fixed;
  right:30px;
  bottom:30px;
  cursor:pointer;
  opacity:0.5;
}
.top-btn:hover{opacity:1;}

</style>
</head>

<body>

<div class="sidebar">
  <div class="back" onclick="goBack()">← Back</div>

  <div class="nav">
    <div id="btn-mod" class="active" onclick="showSection('mod')">Vermont</div>
    <div id="btn-his" onclick="showSection('his')">Historical</div>
  </div>
</div>

<div class="main">

<!-- ===== 现代线 ===== -->
<div id="mod" class="section active">
<div class="timeline">

<div class="event right modern">
<div class="year">1950</div>
<div class="text">
<span class="en">Yagami Iori is born</span>
<span class="cn">八神伊织 出生</span>
</div>
<div class="detail">1950
八神伊织 出生</div>
</div>

<div class="event left modern">
<div class="year">1958</div>
<div class="text">
<span class="en">Sugahara Shin is born</span>
<span class="cn">菅原真 出生</span>
</div>
<div class="detail">1958
菅原真 出生</div>
</div>

</div>
</div>

<!-- ===== 历史线 ===== -->
<div id="his" class="section">
<div class="timeline">

<div class="event left historical">
<div class="year">1465</div>
<div class="text">
<span class="en">Osvaldo is born</span>
<span class="cn">Osvaldo出生</span>
</div>
<div class="detail">1465年 Osvaldo出生</div>
</div>

<div class="event right historical">
<div class="year">1498</div>
<div class="text">
<span class="en">Political Marriage</span>
<span class="cn">政治联姻</span>
</div>
<div class="detail">1498年
Osvaldo同那不勒斯公国的Cathetine Macarena公主政治联姻</div>
</div>

<div class="event left historical">
<div class="year">1508</div>
<div class="text">
<span class="en">Royal Assassination</span>
<span class="cn">王室暗杀</span>
</div>
<div class="detail">1508年
国王和王储被暗杀</div>
</div>

</div>
</div>

</div>

<div class="top-btn" onclick="scrollTopSmooth()">TOP ↑</div>

<script>

function goBack(){
  window.location.href="sym-noir.html";
}

function showSection(type){
  document.getElementById("mod").classList.remove("active");
  document.getElementById("his").classList.remove("active");

  document.getElementById("btn-mod").classList.remove("active");
  document.getElementById("btn-his").classList.remove("active");

  document.getElementById(type).classList.add("active");
  document.getElementById("btn-"+type).classList.add("active");
}

/* ===== 滚动浮现 ===== */
const events = document.querySelectorAll(".event");

function reveal(){
  const trigger = window.innerHeight * 0.85;

  events.forEach(e=>{
    if(e.getBoundingClientRect().top < trigger){
      e.classList.add("show");
    }
  });
}

window.addEventListener("scroll", reveal);
window.addEventListener("load", reveal);

function scrollTopSmooth(){
  window.scrollTo({top:0,behavior:"smooth"});
}

</script>

</body>
</html>
