<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Timeline</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:black;
  color:white;
  font-family:'Special Elite',cursive;
}

/* ===== 主轴 ===== */
.timeline{
  position:relative;
  width:100%;
  padding:100px 0;
}

.timeline::before{
  content:"";
  position:absolute;
  left:50%;
  width:1px;
  height:100%;
  background:rgba(255,255,255,0.2);
  box-shadow:0 0 6px rgba(255,255,255,0.4);
}

/* ===== 事件 ===== */
.event{
  position:relative;
  width:50%;
  padding:20px 40px;
  box-sizing:border-box;

  opacity:0;
  transform:translateY(40px);
  transition:1s;
}

.event.show{
  opacity:1;
  transform:translateY(0);
}

.left{
  left:0;
  text-align:right;
}

.right{
  left:50%;
}

/* 年份 */
.year{
  font-size:22px;
  margin-bottom:6px;
}

/* 内容 */
.text{
  font-size:14px;
  opacity:0.7;
}

/* 横线 */
.event::after{
  content:"";
  position:absolute;
  top:30px;
  width:40px;
  height:1px;
  background:rgba(255,255,255,0.4);
}

.left::after{ right:-40px; }
.right::after{ left:-40px; }

/* ===== 历史线颜色 ===== */
.historical .year{
  color:#f5e6c8;
  text-shadow:0 0 6px rgba(255,220,150,0.4);
}

/* ===== 现代线颜色 ===== */
.modern .year{
  color:#d8e6ff;
  text-shadow:0 0 6px rgba(150,180,255,0.4);
}

/* 标题 */
.section-title{
  text-align:center;
  margin:80px 0 40px;
  font-size:20px;
  letter-spacing:2px;
  opacity:0.8;
}

</style>
</head>

<body>

<div class="timeline">

<!-- ===== 历史线 ===== -->
<div class="section-title">Historical Timeline</div>

<div class="event left historical" id="year-1465">
  <div class="year">1465</div>
  <div class="text">Osvaldo 出生</div>
</div>

<div class="event right historical" id="year-1467">
  <div class="year">1467</div>
  <div class="text">Antonio 出生</div>
</div>

<div class="event left historical">
  <div class="year">1484</div>
  <div class="text">Osvaldo 继位</div>
</div>

<div class="event right historical">
  <div class="year">1498</div>
  <div class="text">政治联姻</div>
</div>

<div class="event left historical">
  <div class="year">1508</div>
  <div class="text">王室遇刺</div>
</div>

<div class="event right historical">
  <div class="year">1516</div>
  <div class="text">王朝复辟</div>
</div>


<!-- ===== 现代线 ===== -->
<div class="section-title">Ghost in Vermont</div>

<div class="event right modern" id="year-1950">
  <div class="year">1950</div>
  <div class="text">八神伊织 出生</div>
</div>

<div class="event left modern" id="year-1958">
  <div class="year">1958</div>
  <div class="text">菅原真 出生</div>
</div>

<div class="event right modern">
  <div class="year">1976</div>
  <div class="text">初遇</div>
</div>

<div class="event left modern">
  <div class="year">1982</div>
  <div class="text">诅咒事件</div>
</div>

<div class="event right modern">
  <div class="year">1986</div>
  <div class="text">组队调查</div>
</div>

<div class="event left modern">
  <div class="year">1999</div>
  <div class="text">调查Antonio</div>
</div>

</div>

<script>

/* ===== 滚动出现 ===== */
const events = document.querySelectorAll(".event");

window.addEventListener("scroll", ()=>{
  const trigger = window.innerHeight * 0.85;

  events.forEach(e=>{
    const top = e.getBoundingClientRect().top;
    if(top < trigger){
      e.classList.add("show");
    }
  });
});

/* ===== 跳转定位 ===== */
window.onload = ()=>{
  const hash = window.location.hash;

  if(hash){
    const el = document.querySelector(hash);

    if(el){
      setTimeout(()=>{
        el.scrollIntoView({behavior:"smooth", block:"center"});
      },300);
    }
  }
};

</script>

</body>
</html>
