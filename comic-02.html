<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhapsody in Neon</title>

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial, sans-serif;
}

/* ===== HOME LOGO ===== */
.home-logo{
  position:fixed;
  top:80px;
  right:60px;
  z-index:1000;
}
.home-logo img{
  width:80px;
  opacity:0.8;
  transition:0.3s;
}
.home-logo img:hover{
  opacity:1;
  transform:scale(1.08);
}

/* ===== HERO（头图） ===== */
.hero{
  height:100vh;
  background:url("images/comics/comic-02/cover.jpg") center/cover no-repeat;
  position:relative;
  z-index:1;
}

.hero::after{
  content:"";
  position:absolute;
  bottom:0;
  width:100%;
  height:200px;
  background:linear-gradient(transparent, black);
}

/* 标题浮在头图上 */
.hero-title{
  position:absolute;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
}

.hero-title h1{
  font-size:48px;
  letter-spacing:3px;
  margin:0;
}

.hero-title p{
  font-size:14px;
  opacity:0.6;
  margin-top:10px;
}
.intro{
  width:90%;
  max-width:1000px;
  margin:0 auto 60px;
}

.intro h1{
  font-size:clamp(60px, 10vw, 140px);
  color:#bfe9ff; /* 浅蓝 */

  line-height:0.9;
  margin:0 0 20px;
}

.intro p{
  font-size:16px;
  color:#f5a3c7; /* 粉色说明 */
  opacity:0.8;
}
/* ===== 内容区 ===== */
.content{
  background:black;

  margin-top:-120px; /* 👈 关键：往上盖住头图 */
  padding:120px 0 80px;

  position:relative;
  z-index:2;
}
.content::before{
  content:"";
  position:absolute;
  top:-120px;
  left:0;
  width:100%;
  height:120px;
  background:linear-gradient(transparent, black);
}
/* 每一页 */
.page{
  display:flex;
  justify-content:center;
  margin-bottom:60px;
}

.page img{
  width:90%;
  max-width:700px;
  cursor:zoom-in;
  transition:0.3s;
}

.page img:hover{
  transform:scale(1.01);
}

/* ===== 放大查看 ===== */
.zoom{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:2000;
}

.zoom img{
  max-width:90%;
  max-height:90%;
  cursor:zoom-out;
}

/* ===== 返回顶部 ===== */
.top-btn{
  position:fixed;
  right:60px;
  bottom:60px;
  width:48px;
  height:48px;
  border:1px solid rgba(255,255,255,0.3);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  opacity:0;
  transition:0.3s;
}

.top-btn.show{
  opacity:1;
}

.top-btn:hover{
  transform:scale(1.1);
}
</style>
</head>

<body>

<!-- HOME -->
<a href="index.html" class="home-logo">
  <img src="logo.png">
</a>

<!-- HERO -->

<div class="content">

  <!-- 标题现在放进内容层 -->
  <div class="intro">
    <h1>Rhapsody In Neon</h1>
    <p>OVERTURE</p>
    <p>An original graphic Novel<br>
    written & illustrated by Ariel Rothbart</p>
  </div>
  
<!-- CONTENT -->
<div class="content">

  <!-- 一页 -->
  <div class="page">
    <img src="images/comics/comic-02/page1.jpg">
  </div>

  <div class="page">
    <img src="images/comics/comic-02/page2.jpg">
  </div>

  <div class="page">
    <img src="images/comics/comic-02/page3.jpg">
  </div>

</div>

<!-- 放大 -->
<div class="zoom" id="zoom">
  <img id="zoomImg">
</div>

<!-- 返回顶部 -->
<div class="top-btn" id="topBtn">↑</div>

<script>
/* 放大 */
const zoom = document.getElementById("zoom");
const zoomImg = document.getElementById("zoomImg");

document.querySelectorAll(".page img").forEach(img=>{
  img.onclick = ()=>{
    zoom.style.display = "flex";
    zoomImg.src = img.src;
  }
});

zoom.onclick = ()=>{
  zoom.style.display = "none";
};

/* 返回顶部 */
const topBtn = document.getElementById("topBtn");

window.addEventListener("scroll", ()=>{
  if(window.scrollY > 300){
    topBtn.classList.add("show");
  }else{
    topBtn.classList.remove("show");
  }
});

topBtn.onclick = ()=>{
  window.scrollTo({top:0, behavior:"smooth"});
};
</script>

</body>
</html>
