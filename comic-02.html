<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhapsody in Neon</title>

<link href="https://fonts.googleapis.com/css2?family=Francois+One&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial, sans-serif;
}

/* ===== HOME ===== */
.home-logo{
  position:fixed;
  top:80px;
  right:60px;
  z-index:1000;
}
.home-logo img{
  width:80px;
  opacity:0.8;
  transition:0.3s;
}
.home-logo img:hover{
  opacity:1;
  transform:scale(1.08);
}

/* ===== HERO（底层头图） ===== */
.hero{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;

  background:url("images/comics/comic-02/cover.jpg") center/cover no-repeat;
  z-index:0;
}
  
/* ===== 覆盖层（标题在这里） ===== */
.overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100vh;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  z-index:2;
  pointer-events:none;
}

/* 标题整体位置 */
.intro{
  width:90%;
  max-width:1200px;
  margin-bottom:80px;
}

/* 主标题 */
.intro h1{
  font-family:'Francois One', sans-serif;
  font-size:clamp(60px, 10vw, 140px);
  color:#cff2ff;

  text-align:center;
  margin:0;
  line-height:0.9;
}

/* OVERTURE */
.intro .sub{
  font-family:'Francois One', sans-serif;
  font-size:18px;
  color:#cff2ff;
  opacity:0.6;

  text-align:center;
  margin-top:8px;
}

/* 小字说明 */
.intro .desc{
  font-family:'Francois One', sans-serif;
  font-size:clamp(14px, 2vw, 28px);
  color:#fdbcec;

  margin-top:20px;
  width:max-content;

  /* 👇 关键：左对齐标题 */
  margin-left:auto;
  margin-right:auto;
  transform:translateX(-25%);
}
  
/* ===== 内容层（会覆盖上来） ===== */
.content{
  position:relative;
  z-index:3;

  margin-top:100vh; /* 👈 提前开始覆盖 */
  background:#000;

  padding:120px 0 80px;
}

/* ===== 标题区 ===== */
.intro{
  width:90%;
  max-width:1200px;
  margin:0 auto 100px;
}

.intro h1{
  font-family:'Francois One', sans-serif;
  font-size:clamp(60px, 10vw, 140px);
  color:#bfe9ff;

  margin:0;
  line-height:0.9;
}

.intro .sub{
  font-family:'Francois One', sans-serif;
  font-size:18px;
  color:#bfe9ff;
  opacity:0.6;
  margin-top:10px;
}

/* ===== 漫画页 ===== */
.page{
  display:flex;
  justify-content:center;
  margin-bottom:80px;
}

.page img{
  width:90%;
  max-width:800px;
  cursor:zoom-in;
}

/* ===== 放大 ===== */
.zoom{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:2000;
}

.zoom img{
  max-width:90%;
  max-height:90%;
}

/* ===== TOP 按钮 ===== */
.top-btn{
  position:fixed;
  right:60px;
  bottom:60px;
  width:48px;
  height:48px;
  border:1px solid rgba(255,255,255,0.3);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  opacity:0;
  transition:0.3s;
}

.top-btn.show{
  opacity:1;
}

</style>
</head>

<body>

<!-- 背景头图 -->
<div class="hero"></div>
<div class="overlay">
  <div class="intro">
    <h1>Rhapsody In Neon</h1>
    <div class="sub">OVERTURE</div>
    <p class="desc">
      An original graphic Novel<br>
      written & illustrated by Ariel Rothbart
    </p>
  </div>
</div>
<!-- HOME -->
<a href="index.html" class="home-logo">
  <img src="logo.png">
</a>

<!-- 内容 -->
<div class="content">


  <!-- 漫画页 -->
  <div class="page">
    <img src="images/comics/comic-02/page1.jpg">
  </div>

  <div class="page">
    <img src="images/comics/comic-02/page2.jpg">
  </div>

  <div class="page">
    <img src="images/comics/comic-02/page3.jpg">
  </div>
  
 <div class="page">
    <img src="images/comics/comic-02/page4.jpg">
  </div>
   
 <div class="page">
    <img src="images/comics/comic-02/page5.jpg">
  </div>
   
 <div class="page">
    <img src="images/comics/comic-02/page6.jpg">
  </div>
   
 <div class="page">
    <img src="images/comics/comic-02/page7.jpg">
  </div>
   
 <div class="page">
    <img src="images/comics/comic-02/page8.jpg">
  </div>
   
 <div class="page">
    <img src="images/comics/comic-02/page9.jpg">
  </div>
   
 <div class="page">
    <img src="images/comics/comic-02/page10.jpg">
  </div>
  
</div>

<!-- 放大 -->
<div class="zoom" id="zoom">
  <img id="zoomImg">
</div>

<!-- TOP -->
<div class="top-btn" id="topBtn">↑</div>

<script>

/* 放大 */
const zoom = document.getElementById("zoom");
const zoomImg = document.getElementById("zoomImg");

document.querySelectorAll(".page img").forEach(img=>{
  img.onclick = ()=>{
    zoom.style.display = "flex";
    zoomImg.src = img.src;
  }
});

zoom.onclick = ()=>{
  zoom.style.display = "none";
};

/* top按钮 */
const topBtn = document.getElementById("topBtn");

window.addEventListener("scroll", ()=>{
  if(window.scrollY > 300){
    topBtn.classList.add("show");
  }else{
    topBtn.classList.remove("show");
  }
});

topBtn.onclick = ()=>{
  window.scrollTo({top:0, behavior:"smooth"});
};

</script>

</body>
</html>
